syntax = "proto3";

package toevan.v1;

option go_package = "github.com/toevan/api-server/gen/toevan/v1;toevanv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// ============================================
// FeatureFlagService — Real-time Feature Flags
// ============================================

service FeatureFlagService {
  // CRUD
  rpc CreateFlag(CreateFlagRequest) returns (CreateFlagResponse);
  rpc GetFlag(GetFlagRequest) returns (GetFlagResponse);
  rpc ListFlags(ListFlagsRequest) returns (ListFlagsResponse);
  rpc UpdateFlag(UpdateFlagRequest) returns (UpdateFlagResponse);
  rpc DeleteFlag(DeleteFlagRequest) returns (DeleteFlagResponse);
  rpc ToggleFlag(ToggleFlagRequest) returns (ToggleFlagResponse);

  // Evaluation
  rpc EvalFlag(EvalFlagRequest) returns (EvalFlagResponse);
  rpc EvalFlags(EvalFlagsRequest) returns (EvalFlagsResponse);

  // Real-time streaming — server pushes flag changes to connected clients
  rpc StreamFlags(StreamFlagsRequest) returns (stream FlagUpdate);

  // Audit
  rpc GetFlagAuditLog(GetFlagAuditLogRequest) returns (GetFlagAuditLogResponse);
}

// ── Enums ──

enum FlagType {
  FLAG_TYPE_UNSPECIFIED = 0;
  FLAG_TYPE_BOOLEAN = 1;
  FLAG_TYPE_STRING = 2;
  FLAG_TYPE_NUMBER = 3;
  FLAG_TYPE_JSON = 4;
}

enum FlagAuditAction {
  FLAG_AUDIT_ACTION_UNSPECIFIED = 0;
  FLAG_AUDIT_ACTION_CREATED = 1;
  FLAG_AUDIT_ACTION_UPDATED = 2;
  FLAG_AUDIT_ACTION_TOGGLED = 3;
  FLAG_AUDIT_ACTION_DELETED = 4;
}

// ── Core Messages ──

// TagList wraps a repeated string as a MESSAGE field specifically so it carries proto3's
// native message-field presence (nil vs. an explicit, possibly-empty message) — a bare
// `repeated string` cannot distinguish "not set" from "set to empty" on the wire, which
// would make it impossible for UpdateFlagRequest to ever CLEAR a tag list back to "no
// restriction" (the same gap this proto's own targeting_rules/rollout_percentage fields
// already have — deliberately not repeated here for a field admins will genuinely want to
// clear).
message TagList {
  repeated string tags = 1;
}

message FeatureFlag {
  string id = 1;
  string org_id = 2;                               // empty = global flag
  string key = 3;                                   // unique identifier (e.g. "enable_dark_mode")
  string name = 4;                                  // display name
  string description = 5;
  FlagType flag_type = 6;
  google.protobuf.Value default_value = 7;          // typed default value
  bool enabled = 8;                                 // master kill switch
  string targeting_rules = 9;                       // JSON string of targeting rules
  int32 rollout_percentage = 10;                    // 0-100 for gradual rollout
  string created_by = 11;
  string updated_by = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;

  // allowed_tags/blocked_tags gate this flag on the account-tags substrate (the same
  // tags assignable to an org elsewhere in platform-admin). Evaluated per-org at read
  // time — see EvalFlag: a blocked-tag match always wins over an allowed-tag match; an
  // empty allowed_tags list means "no allow-list restriction" (falls through to
  // rollout_percentage), a non-empty one means the org needs at least one of these
  // tags to receive the flag. Both empty = tag gating not configured for this flag.
  // Always present on read (never nil) — empty tags means "no gating", not "unknown".
  TagList allowed_tags = 15;
  TagList blocked_tags = 16;
}

message FlagUpdate {
  string key = 1;
  google.protobuf.Value value = 2;
  bool enabled = 3;
  bool deleted = 4;
  google.protobuf.Timestamp updated_at = 5;

  // heartbeat marks a keepalive frame carrying NO flag. A client MUST drop it
  // rather than apply it, or every beat would evaluate as a delete of the empty
  // key.
  //
  // StreamFlags sends a snapshot and then idles, often for the whole session —
  // flags change rarely by design. Behind the reverse proxy the on-prem guide
  // ships (nginx, proxy_read_timeout 60s, no override) that idle connection is
  // dropped every minute. The client re-reads its snapshot on reconnect, so no
  // STATE is lost, which is why this is lower stakes than its siblings; the cost
  // is a reconnect per minute per connected client, forever.
  //
  // An ADDITIVE field rather than a oneof frame, for the same reason
  // ViolationLifecycleEvent took one: this message ships in a released client and
  // wrapping it would change the type on the wire, so every deployed build would
  // fail to decode every frame.
  bool heartbeat = 6;
}

message FlagAuditEntry {
  string id = 1;
  string flag_id = 2;
  FlagAuditAction action = 3;
  string old_value = 4;                             // JSON string
  string new_value = 5;                             // JSON string
  string changed_by = 6;
  google.protobuf.Timestamp changed_at = 7;
}

message FlagEvalResult {
  string key = 1;
  google.protobuf.Value value = 2;
  bool enabled = 3;
}

// ── CreateFlag ──

message CreateFlagRequest {
  string org_id = 1;                                // empty = global flag
  string key = 2;
  string name = 3;
  string description = 4;
  FlagType flag_type = 5;
  google.protobuf.Value default_value = 6;
  bool enabled = 7;
  string targeting_rules = 8;                       // JSON string
  int32 rollout_percentage = 9;
  TagList allowed_tags = 10;                        // see FeatureFlag.allowed_tags; absent = none
  TagList blocked_tags = 11;                        // see FeatureFlag.blocked_tags; absent = none
}

message CreateFlagResponse {
  FeatureFlag flag = 1;
}

// ── GetFlag ──

message GetFlagRequest {
  string flag_id = 1;
}

message GetFlagResponse {
  FeatureFlag flag = 1;
}

// ── ListFlags ──

message ListFlagsRequest {
  string org_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  bool include_global = 4;                          // include global flags in results
}

message ListFlagsResponse {
  repeated FeatureFlag flags = 1;
  int32 total = 2;
}

// ── UpdateFlag ──

message UpdateFlagRequest {
  string flag_id = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Value default_value = 4;
  string targeting_rules = 5;                       // JSON string
  int32 rollout_percentage = 6;
  // nil = leave this list untouched; a present TagList (even TagList{}) REPLACES the
  // flag's current list with exactly the tags it carries — the only way to explicitly
  // clear a list back to "no restriction" is to send a present-but-empty TagList.
  TagList allowed_tags = 7;
  TagList blocked_tags = 8;
}

message UpdateFlagResponse {
  FeatureFlag flag = 1;
}

// ── DeleteFlag ──

message DeleteFlagRequest {
  string flag_id = 1;
}

message DeleteFlagResponse {
  bool success = 1;
}

// ── ToggleFlag ──

message ToggleFlagRequest {
  string flag_id = 1;
  bool enabled = 2;
}

message ToggleFlagResponse {
  FeatureFlag flag = 1;
}

// ── EvalFlag (single) ──

message EvalFlagRequest {
  string org_id = 1;
  string key = 2;
}

message EvalFlagResponse {
  FlagEvalResult result = 1;
}

// ── EvalFlags (batch) ──

message EvalFlagsRequest {
  string org_id = 1;
  repeated string keys = 2;                         // empty = all enabled flags
}

message EvalFlagsResponse {
  repeated FlagEvalResult results = 1;
}

// ── StreamFlags ──

message StreamFlagsRequest {
  string org_id = 1;

  // supports_heartbeat declares that this client filters FlagUpdate.heartbeat
  // frames instead of applying them as data. The server beats ONLY at clients
  // that set it.
  //
  // Why opt-in when the field is already additive: additive means an old
  // client DECODES the frame — as an empty FlagUpdate, indistinguishable from
  // a real update naming the empty key — not that it handles it. Deployed
  // builds predate the filter, so an unconditional heartbeat would apply junk
  // to every released client three times a minute for the life of every
  // session. A client that stays silent here keeps the exact behavior it was
  // built against (the proxy drops its idle stream and it reconnects — churn,
  // not corruption); a client that declares support gets the keepalive.
  bool supports_heartbeat = 2;
}

// Response is stream FlagUpdate (defined above)

// ── GetFlagAuditLog ──

message GetFlagAuditLogRequest {
  string flag_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetFlagAuditLogResponse {
  repeated FlagAuditEntry entries = 1;
  int32 total = 2;
}
