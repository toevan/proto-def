syntax = "proto3";

package toevan.v1;

option go_package = "github.com/toevan/api-server/gen/toevan/v1;toevanv1";

import "google/protobuf/timestamp.proto";
import "toevan/v1/blueprint.proto";

// ============================================
// RepoService — GitHub Repos, Onboarding, Indexing
// ============================================

service RepoService {
  // GitHub integration
  rpc ListGitHubRepos(ListGitHubReposRequest) returns (ListGitHubReposResponse);

  // Repo CRUD
  rpc OnboardRepo(OnboardRepoRequest) returns (OnboardRepoResponse);
  rpc OnboardRepos(OnboardReposRequest) returns (OnboardReposResponse);
  rpc GetRepo(GetRepoRequest) returns (GetRepoResponse);
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  rpc DisconnectRepo(DisconnectRepoRequest) returns (DisconnectRepoResponse);

  // Indexing
  rpc ReindexRepo(ReindexRepoRequest) returns (ReindexRepoResponse);
  rpc BatchReindexRepos(BatchReindexReposRequest) returns (BatchReindexReposResponse);
  rpc GetIndexStatus(GetIndexStatusRequest) returns (GetIndexStatusResponse);
  rpc StreamIndexProgress(StreamIndexProgressRequest) returns (stream IndexProgressUpdate);
  rpc StreamBatchIndexProgress(StreamBatchIndexProgressRequest) returns (stream IndexProgressUpdate);
  // ListActiveIndexJobs returns every IN-FLIGHT index job for the caller's
  // org — the discovery surface the activity panel uses to pick up
  // server-triggered runs (push webhooks, catch-up sweeps) it never
  // dispatched itself and would otherwise never see.
  rpc ListActiveIndexJobs(ListActiveIndexJobsRequest) returns (ListActiveIndexJobsResponse);
  rpc GetRepoProgressMetrics(GetRepoProgressMetricsRequest) returns (GetRepoProgressMetricsResponse);

  // Server-stream of repo-state changes for an ORG, wrapped in a frame envelope
  // so the server can interleave droppable heartbeats past reverse-proxy idle
  // timeouts (nginx default proxy_read_timeout is 60s).
  //
  // Org-scoped, unlike StreamIndexProgress beside it, and that is the whole
  // point. Index progress is addressed by JOB id, so only the client that
  // started an index can subscribe — a second device, or a repo whose index was
  // started by a push webhook or the freshness sweep, has no job id and can
  // never learn the outcome. An org id is something every client already has, so
  // an OBSERVER can converge.
  //
  // Frames are INVALIDATION SIGNALS carrying the new status, not snapshots. A
  // client may flip a status-only control straight from `status`, but anything
  // derived — violation counts, compliance rate, health — must be re-fetched,
  // because it is computed from evidence this frame does not carry.
  //
  // Delivery is best-effort and unreplayed: frames published while a client is
  // disconnected are gone, and a broker outage manifests as SILENCE rather than
  // an error. A subscriber MUST therefore keep a low-frequency reconciliation
  // read; the stream makes convergence fast, it does not make it guaranteed.
  rpc StreamRepoChanges(StreamRepoChangesRequest) returns (stream RepoChangeFrame);

  // Blueprint assignment (repo-scoped)
  rpc AssignBlueprint(AssignBlueprintRequest) returns (AssignBlueprintResponse);
  rpc RemoveBlueprint(RemoveBlueprintRequest) returns (RemoveBlueprintResponse);
  rpc ListRepoBlueprints(ListRepoBlueprintsRequest) returns (ListRepoBlueprintsResponse);
}

// ── Core Types ──

message Repo {
  string id = 1;
  string org_id = 2;
  RepoProjectRef project = 3;                // nullable — may not be assigned to a project yet
  string github_id = 4;
  string name = 5;                       // "payment-service"
  string full_name = 6;                  // "acme-corp/payment-service"
  string description = 24;               // repo's GitHub "About" text (empty when none)
  string default_branch = 7;            // "main"
  string primary_language = 8;          // "go"
  repeated string languages = 9;        // all detected languages
  RepoStatus status = 10;
  google.protobuf.Timestamp last_indexed_at = 11;
  string last_indexed_commit = 12;

  // Repo-scoped blueprints
  repeated BlueprintRef blueprints = 13;

  // Aggregated metrics
  int32 symbol_count = 14;
  int32 edge_count = 15;
  int32 file_count = 16;
  int32 violation_count = 17;
  int32 layer_count = 23;

  // Compliance metrics — derived from evidence_records at list time
  float compliance_rate = 20;                          // 0.0–1.0; 0.0 when never scanned
  google.protobuf.Timestamp last_scan_at = 21;         // last constraint evaluation; absent when never scanned
  RepoHealthLabel health_label = 22;                   // computed from violation_count: healthy/warning/critical

  // Timestamps
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
}

enum RepoStatus {
  REPO_STATUS_UNSPECIFIED = 0;
  REPO_STATUS_PENDING = 1;              // connected but not yet indexed
  REPO_STATUS_INDEXING = 2;             // tree-sitter phase in progress
  REPO_STATUS_ENRICHING = 3;            // LSP phase in progress
  REPO_STATUS_INDEXED = 4;              // fully indexed (tree-sitter + LSP)
  REPO_STATUS_PARTIAL = 5;             // tree-sitter done, LSP failed
  REPO_STATUS_ERROR = 6;               // indexing failed
  REPO_STATUS_DISCONNECTED = 7;        // GitHub access revoked
}

enum RepoHealthLabel {
  REPO_HEALTH_UNSPECIFIED = 0;          // not yet scanned
  REPO_HEALTH_HEALTHY = 1;             // 0 violations
  REPO_HEALTH_WARNING = 2;             // 1–5 violations
  REPO_HEALTH_CRITICAL = 3;            // >5 violations
}

message RepoProjectRef {
  string project_id = 1;
  string project_name = 2;
  bool onboarded = 3;
  string repo_id = 4;
}

message GitHubRepo {
  string github_id = 1;
  string name = 2;
  string full_name = 3;
  string default_branch = 4;
  string language = 5;
  int32 size_kb = 6;
  bool private = 7;

  // Project information if assigned to a project
  RepoProjectRef project = 8;

  // Whether KoreLink can index this repository's language today. False only for
  // a language the registry does not yet support; a repository with no detected
  // language is left true, since an empty primary language is GitHub declining
  // to classify it rather than a positive "unsupported". The client gates
  // selection on this so a user cannot onboard a language nothing will index.
  bool language_supported = 9;
}

// ── Index Status ──

message IndexStatus {
  string repo_id = 1;
  string job_id = 2;
  IndexPhase phase = 3;
  float progress = 4;                   // 0.0 to 1.0
  int32 files_processed = 5;
  int32 files_total = 6;
  int32 symbols_found = 7;
  int32 edges_found = 8;
  string current_file = 9;              // file being processed now
  string error = 10;
  google.protobuf.Timestamp started_at = 11;
  int32 duration_ms = 12;
  repeated LanguageLspStatus lsp_status = 13;
}

enum IndexPhase {
  INDEX_PHASE_UNSPECIFIED = 0;
  INDEX_PHASE_QUEUED = 1;
  INDEX_PHASE_CLONING = 2;
  INDEX_PHASE_TREESITTER = 3;
  INDEX_PHASE_LSP_INIT = 4;
  INDEX_PHASE_LSP_ENRICHING = 5;
  INDEX_PHASE_COMPUTING_FLOWS = 6;
  INDEX_PHASE_WRITING_GRAPH = 7;
  INDEX_PHASE_COMPLETED = 8;
  INDEX_PHASE_FAILED = 9;
  // Incremental reindexing phases (KA-51).
  INDEX_PHASE_DIFFING = 10;
  INDEX_PHASE_RIPPLE_ANALYSIS = 11;
  INDEX_PHASE_INCREMENTAL_INDEXING = 12;
  // Terminal: a newer run took over; this run's results were discarded. Not a failure.
  INDEX_PHASE_SUPERSEDED = 13;
}

message LanguageLspStatus {
  string language = 1;                   // "go", "typescript"
  string server = 2;                     // "gopls", "typescript-language-server"
  LspState state = 3;
  int32 queries_completed = 4;
  int32 queries_total = 5;
  string error = 6;
}

enum LspState {
  LSP_STATE_UNSPECIFIED = 0;
  LSP_STATE_PENDING = 1;
  LSP_STATE_INITIALIZING = 2;
  LSP_STATE_RUNNING = 3;
  LSP_STATE_COMPLETED = 4;
  LSP_STATE_FAILED = 5;
  LSP_STATE_SKIPPED = 6;               // language not supported or toolchain missing
}

message IndexProgressUpdate {
  string repo_id = 1;
  string job_id = 2;
  IndexPhase phase = 3;
  float progress = 4;
  string message = 5;                    // human-readable status line
  int32 files_processed = 6;
  int32 symbols_found = 7;
  string current_file = 8;
  int32 files_total = 9;
  int32 edges_found = 10;
}

// ── Requests/Responses ──

// Controls which GitHub repos are returned based on onboarding status.
enum GitHubRepoFilter {
  GITHUB_REPO_FILTER_UNSPECIFIED = 0;   // default = available (non-onboarded) only
  GITHUB_REPO_FILTER_ALL = 1;           // all repos from GitHub installation
  GITHUB_REPO_FILTER_AVAILABLE = 2;     // only repos not yet onboarded
  GITHUB_REPO_FILTER_ONBOARDED = 3;     // only repos already onboarded
}

message ListGitHubReposRequest {
  string org_id = 1;
  GitHubRepoFilter filter = 2;          // defaults to available-only for backward compat
}
message ListGitHubReposResponse {
  repeated GitHubRepo repos = 1;
  // Live GitHub App install state for this account, resolved (and self-healed)
  // alongside the repo list at no extra GitHub round-trip. Lets the client tell
  // "App not installed" from "installed but no repositories shared" — the empty
  // `repos` list alone cannot: both are empty. `installed` is whether an
  // installation currently exists; `accessible_repo_count` is how many repos it
  // can reach (0 while installed ⇒ share repositories, don't re-install).
  bool installed = 2;
  int32 accessible_repo_count = 3;
}

message OnboardRepoRequest {
  string org_id = 1;
  string github_id = 2;
  string project_id = 3;                // optional — assign to project during onboarding
  repeated string blueprint_ids = 4;    // optional — auto-assign blueprints
}
message OnboardRepoResponse {
  Repo repo = 1;
  string index_job_id = 2;              // track progress with GetIndexStatus or StreamIndexProgress
}

// ── Batch Onboarding ──

message OnboardReposRequest {
  string org_id = 1;
  repeated string github_ids = 2;       // multiple github repo IDs to onboard
  string project_id = 3;                // existing project (mutually exclusive with new_project)
  repeated string blueprint_ids = 4;    // optional — shared across all repos
  NewProjectSpec new_project = 5;       // create new project inline (mutually exclusive with project_id)
}

// Inline project creation spec for OnboardRepos.
message NewProjectSpec {
  string name = 1;                      // required project name
  string description = 2;              // optional description
}

message OnboardReposResponse {
  repeated OnboardRepoResult results = 1;
  int32 succeeded = 2;
  int32 failed = 3;
  string project_id = 4;               // populated when new_project was created or project_id was provided
}

message OnboardRepoResult {
  string github_id = 1;
  Repo repo = 2;                        // set on success
  string index_job_id = 3;              // set on success
  string error = 4;                     // set on failure
}

message GetRepoRequest {
  // Internal UUID — historical lookup path. Exactly one of
  // [repo_id] / [repo_handle] MUST be set; the server rejects
  // requests that set both or neither.
  string repo_id = 1;

  // Human-readable repository handle (the repo's `name` column,
  // e.g. `api-server`). Used by URL-driven client routes so the
  // address bar carries a friendly name instead of a UUID.
  //
  // Resolved server-side against `(org_id, name)` where org_id
  // comes from the request. A partial unique index on
  // (org_id, name) WHERE deleted_at IS NULL backstops the lookup;
  // a handle that doesn't resolve within the org returns NotFound.
  //
  // Mutually exclusive with [repo_id].
  string repo_handle = 2;

  // Required when looking up by [repo_handle] — the handle is
  // scoped within an org, so the server needs to know which one.
  // Ignored when [repo_id] is set (UUID lookup is global; the
  // handler enforces org ownership against the caller's context
  // either way).
  string org_id = 3;
}
message GetRepoResponse {
  Repo repo = 1;
  repeated IndexRun index_runs = 2;                  // recent indexing runs
  repeated BlueprintAssignment blueprint_assignments = 3; // enriched assignments with violation/rule counts
  repeated RepoActivity recent_activity = 4;          // unified timeline of repo events
}

// RepoActivity represents a single event in a repository's timeline.
message RepoActivity {
  string id = 1;
  RepoActivityType type = 2;
  string title = 3;
  string description = 4;
  string severity = 5;                                // "info", "success", "warning", "error"
  string action_url = 6;
  google.protobuf.Timestamp created_at = 7;
}

enum RepoActivityType {
  REPO_ACTIVITY_UNSPECIFIED = 0;
  REPO_ACTIVITY_ONBOARDED = 1;                        // repo was connected
  REPO_ACTIVITY_INDEXED = 2;                          // indexing completed
  REPO_ACTIVITY_INDEX_FAILED = 3;                     // indexing failed
  REPO_ACTIVITY_PR_PASSED = 4;                        // PR check passed
  REPO_ACTIVITY_PR_BLOCKED = 5;                       // PR check blocked (violations)
  REPO_ACTIVITY_BLUEPRINT_ASSIGNED = 6;               // blueprint adopted
  REPO_ACTIVITY_BLUEPRINT_REMOVED = 7;                // blueprint removed
  REPO_ACTIVITY_PR_WARNING = 8;                       // PR check passed with warnings
  REPO_ACTIVITY_PR_PENDING = 9;                       // PR check scanning
  REPO_ACTIVITY_PR_ERROR = 10;                        // PR check errored
}

// IndexRun represents a single completed or in-progress indexing run.
message IndexRun {
  string job_id = 1;
  string commit_sha = 2;
  IndexPhase phase = 3;
  int32 symbols_found = 4;
  int32 edges_found = 5;
  int32 duration_ms = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp completed_at = 8;
  string error = 9;
  // last_heartbeat_at is the running indexer's most recent proof-of-life, stamped
  // on a fixed cadence (~60s) AND on every phase transition. It is the definitive
  // liveness signal: a live index — even a huge repo grinding for many minutes —
  // keeps this fresh, while a dead/hung worker stops stamping it. Clients gate the
  // "Force re-index" affordance on its STALENESS (now - last_heartbeat_at past a
  // small threshold) rather than on wall-clock run age, which false-positives on
  // legitimately-long indexes. For a not-yet-picked-up job it is the row's creation
  // time (DB default), so a job that never gets a worker still goes stale correctly.
  google.protobuf.Timestamp last_heartbeat_at = 10;
}

message ListReposRequest {
  string org_id = 1;
  string project_id = 2;                // optional filter
  RepoStatus status_filter = 3;         // optional filter
  int32 limit = 4;
  int32 offset = 5;
}

// RepoListSummary drives the top-of-screen analytics bar on the Repositories page.
// Counts are over ALL repos in the org (or project), not just the current page.
message RepoListSummary {
  int32 total            = 1;   // all non-deleted repos
  int32 healthy          = 2;   // violation_count == 0
  int32 warning          = 3;   // violation_count 1–5
  int32 critical         = 4;   // violation_count > 5
  int32 open_violations  = 5;   // SUM(violation_count) across all repos — OPEN only: actively-excepted findings are excluded
  int32 excepted_findings = 6;  // current violations under an ACTIVE approved exception — accepted risk, shown, never hidden; open + excepted = every current violation
}

message ListReposResponse {
  repeated Repo repos      = 1;
  int32 total              = 2;
  RepoListSummary summary  = 3;  // top-of-screen analytics bar
}

message DisconnectRepoRequest { string repo_id = 1; }
message DisconnectRepoResponse {
  bool success = 1;
  string error = 2;
}

message ReindexRepoRequest {
  string repo_id = 1;
  bool full = 2;                         // true = full reindex, false = incremental
  // Restart a repo whose index looks wedged (worker died mid-index, so the repo is stuck
  // "indexing" and an ordinary reindex is refused with IndexAlreadyInProgress).
  //
  // A user-initiated force is UNCONDITIONAL — it always supersedes the current index and
  // starts a fresh run, so healing a wedged repo never fails. This does NOT risk double-
  // indexing a genuinely-live repo: the new run supersedes the old, and the worker discards
  // a superseded job's writes at completion (its completion-time supersede guard), so two
  // runs can never both publish. Only the user "Force re-index" path sets this; batch and
  // system reindexes never force.
  bool force = 3;
}
message ReindexRepoResponse {
  string job_id = 1;
  bool accepted = 2;
  string error = 3;
}

// ── Batch Reindex ──

message BatchReindexReposRequest {
  repeated string repo_ids = 1;
  bool full = 2;                        // true = full reindex, false = incremental
}

message BatchReindexReposResponse {
  repeated ReindexRepoResult results = 1;
  int32 succeeded = 2;
  int32 failed = 3;
}

message ReindexRepoResult {
  string repo_id = 1;
  string job_id = 2;                    // set on success
  bool accepted = 3;
  string error = 4;                     // set on failure
}

message GetIndexStatusRequest { string job_id = 1; }
message GetIndexStatusResponse { IndexStatus status = 1; }

message StreamIndexProgressRequest { string job_id = 1; }

message StreamBatchIndexProgressRequest {
  repeated string job_ids = 1;          // track multiple jobs over a single stream
}

message ListActiveIndexJobsRequest { string org_id = 1; }
message ListActiveIndexJobsResponse { repeated ActiveIndexJob jobs = 1; }

// One in-flight index job, with enough identity to track it live
// (StreamBatchIndexProgress by job_id) and render it (repo name, trigger).
message ActiveIndexJob {
  string job_id = 1;
  string repo_id = 2;
  string repo_name = 3;                 // repositories.full_name
  string phase = 4;                     // index_job_phase value
  float progress = 5;
  string trigger = 6;                   // user | push | catch_up | onboard | ...
  google.protobuf.Timestamp started_at = 7;
}

message GetRepoProgressMetricsRequest {}
message GetRepoProgressMetricsResponse {
  int64 checkpoints_total = 1;
  int64 persist_failures = 2;
  int64 publish_failures = 3;
  // Incremental reindexing counters (KA-51).
  int64 full_index_total = 4;
  int64 incremental_index_total = 5;
}

message AssignBlueprintRequest {
  string repo_id = 1;
  string blueprint_id = 2;
  string blueprint_version = 3;
}
message AssignBlueprintResponse {
  bool success = 1;
  string error = 2;
}

message RemoveBlueprintRequest {
  string repo_id = 1;
  string blueprint_id = 2;
}
message RemoveBlueprintResponse {
  bool success = 1;
  string error = 2;
}

message ListRepoBlueprintsRequest { string repo_id = 1; }
message ListRepoBlueprintsResponse {
  repeated BlueprintAssignment assignments = 1;
}

message BlueprintAssignment {
  string blueprint_id = 1;
  string blueprint_name = 2;
  string blueprint_version = 3;
  BlueprintScope scope = 4;
  bool is_active = 5;
  google.protobuf.Timestamp assigned_at = 6;
  int32 rule_count = 7;                    // number of rules in the blueprint
  int32 violation_count = 8;               // repo-level violations for this blueprint
}

// ── Repo change stream ──

message StreamRepoChangesRequest {
  string org_id = 1;
}

// RepoChangeFrame is one frame on the StreamRepoChanges wire: either a real
// change or a droppable heartbeat. Mirrors NotificationStreamFrame — an idle
// stream MUST still put a byte on the wire inside the smallest reverse-proxy
// idle window or the connection is dropped.
message RepoChangeFrame {
  oneof payload {
    RepoChange change = 1;
    RepoChangeHeartbeat heartbeat = 2;
  }
}

// RepoChangeHeartbeat is a keepalive frame the client drops on receipt.
message RepoChangeHeartbeat {
  google.protobuf.Timestamp sent_at = 1;
}

// RepoChangeReason says WHY the repo row changed, so a client can decide how much
// work to do.
//
// The distinction is load-bearing rather than descriptive: the repo LIST renders
// health derived from violation counts, NOT from repo status, and those counts are
// recomputed at a different seam entirely. A surface that only watched status
// would never converge on the value it actually renders.
enum RepoChangeReason {
  REPO_CHANGE_REASON_UNSPECIFIED = 0;
  REPO_CHANGE_REASON_CREATED = 1;             // onboarded
  REPO_CHANGE_REASON_STATUS_CHANGED = 2;      // every index lifecycle transition
  REPO_CHANGE_REASON_EVALUATION_UPDATED = 3;  // constraint evaluation rewrote violation counts
  REPO_CHANGE_REASON_PROJECT_CHANGED = 4;     // re-parented; regroups project-scoped surfaces
  REPO_CHANGE_REASON_METRICS_UPDATED = 5;     // indexer symbol/edge/file/layer counts
  REPO_CHANGE_REASON_DESCRIPTION_CHANGED = 6; // GitHub "About" text backfilled
}

message RepoChange {
  string repo_id = 1;
  // The repo's status as known at the seam that published. UNSPECIFIED when that
  // seam does not read it — the evaluation and metrics rollups recompute counts
  // without touching the repositories row, and a lookup purely to fill this field
  // would cost a query per rollup.
  //
  // Client rule: trust `status` only when it is not UNSPECIFIED; always re-fetch
  // anything derived. That is the rule the invalidation-signal design imposes
  // anyway, so an unset status costs a client nothing.
  RepoStatus status = 2;
  RepoChangeReason reason = 3;
  google.protobuf.Timestamp occurred_at = 4;

  // Display name, so a client learning about this repo FROM this frame has
  // something to render instead of a UUID. Identity, not derived state.
  string repo_name = 5;

  // Set only when the publishing seam knows it — the reindex flip and the
  // onboarding write, which create the job in the same transaction.
  //
  // This is what lets an OBSERVER watch a running index in DETAIL. Index
  // progress is addressed by job id, so a device that did not dispatch the index
  // has no id to subscribe with and can otherwise only learn that something is
  // happening. Handing the id out here closes that gap: the observer picks it up
  // and subscribes to the per-job progress stream exactly as the dispatching
  // device does.
  string index_job_id = 6;
}
