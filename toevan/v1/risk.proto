syntax = "proto3";

package toevan.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/toevan/api-server/gen/toevan/v1;toevanv1";

// Org-posture aggregates for the Risk Dashboard. Every number is derived
// from the same canonical sources the rest of the product shows —
// open_violation_findings (deduped, exception-aware), current_repo_evidence,
// the evidence ledger, and pr_checks — so the dashboard can never disagree
// with the pages it links to.
service RiskService {
  rpc GetRiskDashboard(GetRiskDashboardRequest) returns (GetRiskDashboardResponse);
  // Org-level blueprint analytics: per-blueprint current state + weekly
  // violation series, per-rule quality, and 30-day totals — the Blueprint
  // Analytics page's data, from the same canonical sources.
  rpc GetBlueprintInsights(GetBlueprintInsightsRequest) returns (GetBlueprintInsightsResponse);
}

message GetBlueprintInsightsRequest { string org_id = 1; }

message BlueprintInsightRow {
  string blueprint_id = 1;
  string blueprint_name = 2;
  // LEGACY, unchanged meaning: open FINDINGS of this blueprint (a count of
  // violations). Never derive a compliance rate from it.
  int32 open_violations = 3;
  // LEGACY, unchanged meaning: the passed rows of the default-branch evidence view
  // for this blueprint (resolution markers a re-evaluation writes), NOT a count of
  // passing rules. It is not comparable with open_violations: a client must not
  // compute passed_now / (passed_now + open_violations). Use pass_rate, or
  // rules_total and rules_failing.
  int32 passed_now = 4;
  // Twelve ISO weeks of violation evidence, oldest first (sparse, weeks
  // with no rows are omitted; clients pad).
  repeated WeeklyTrendPoint weekly = 5;
  // Rule instances (one per evaluated repo and governed rule) of this blueprint,
  // and how many of them have an open finding.
  int32 rules_total = 6;
  int32 rules_failing = 7;
  // False when no repo has a default-branch evaluation of this blueprint yet:
  // render "not evaluated", never 0%.
  bool evaluated = 8;
  // Rule instances in repos where this blueprint has not been evaluated yet. They
  // are not in rules_total and never count as passing.
  int32 rules_pending = 9;
  // (rules_total - rules_failing) / rules_total, computed on the server. Absent
  // when evaluated is false. The client never divides.
  optional float pass_rate = 10;
}

message RuleQualityRow {
  string rule_id = 1;
  string rule_name = 2;
  string blueprint_name = 3;
  // LEGACY, unchanged meaning: open FINDINGS of this rule (a count of violations).
  // Never derive a compliance rate from it.
  int32 open_violations = 4;
  // LEGACY, unchanged meaning: the passed rows of the default-branch evidence view
  // for this rule (resolution markers), NOT a count of repos or rules passing. Use
  // pass_rate, or rules_total and rules_failing.
  int32 passed_now = 5;
  // Rule instances of this rule id: one per evaluated repo and governing blueprint
  // (a rule id shared by two blueprints in one repo counts twice), and how many of
  // them have an open finding.
  int32 rules_total = 6;
  int32 rules_failing = 7;
  bool evaluated = 8;
  // Rule instances of this rule in repos where the blueprint is not evaluated yet.
  int32 rules_pending = 9;
  // (rules_total - rules_failing) / rules_total, computed on the server. Absent
  // when evaluated is false. The client never divides.
  optional float pass_rate = 10;
}

message GetBlueprintInsightsResponse {
  int32 violations_30d = 1;
  int32 checks_30d = 2;
  // The org's derived compliance (see RiskMetrics.compliance_rate); meaningful
  // only when org_evaluated is true.
  float org_pass_rate = 3;
  repeated BlueprintInsightRow blueprints = 4;
  repeated RuleQualityRow rules = 5;
  repeated RepoCompliance repos = 6;
  repeated WeeklyTrendPoint activity = 7;
  bool org_evaluated = 8;
}

message GetRiskDashboardRequest { string org_id = 1; }

message RiskMetrics {
  int32 open_violations = 1;
  // Open findings whose rule severity is critical or error.
  int32 high_risk_open = 2;
  // Derived on read, org-wide: governing rules with no open finding over all
  // governing rules, summed across the org's evaluated repos (api view
  // repo_blueprint_compliance), the same number every repo card is built from.
  // Meaningful only when evaluated is true; otherwise 0.0 means "not evaluated".
  float compliance_rate = 3;
  int32 blueprints_enforced = 4;
  int32 repos_covered = 5;
  // PR checks that finished blocked in the last 30 days.
  int32 prs_blocked_30d = 6;
  // Accepted risk in plain sight: findings under an active approved exception.
  int32 excepted_findings = 7;
  // False when no repo of the org has been evaluated yet: compliance_rate is
  // then 0.0 and must render as "Not evaluated yet".
  bool evaluated = 8;
  // Governed rules of (repo, blueprint) pairs not evaluated yet, summed over the
  // org's repos. compliance_rate covers evaluated rules only.
  int32 rules_pending = 9;
}

// severity x age bucket ('fresh' <24h, 'recent' <=7d, 'stale' >7d).
message RiskMatrixCell {
  string severity = 1;
  string age_bucket = 2;
  int32 count = 3;
}

message WeeklyTrendPoint {
  google.protobuf.Timestamp week_start = 1;
  int32 violations = 2;
  int32 passed = 3;
}

message BlueprintCoverage {
  string blueprint_id = 1;
  string blueprint_name = 2;
  float pass_rate = 3;
  int32 open_violations = 4;
  // False when no repo has a default-branch evaluation of this blueprint yet;
  // pass_rate is then 0.0 and means "not evaluated".
  bool evaluated = 5;
  // Rule instances in repos where this blueprint is not evaluated yet (not in the
  // rate, never counted as passing).
  int32 rules_pending = 6;
}

message OpenViolationRow {
  string severity = 1;
  string blueprint_name = 2;
  string rule_name = 3;
  string file_path = 4;
  int32 line = 5;
  string repo_name = 6;
  google.protobuf.Timestamp detected_at = 7;
  string author = 8;
  // These are REPO-BRANCH (main head) violations — the client deep-links to
  // the repo surface, not PR Gate, and needs the id to do it.
  string repo_id = 9;
}

// pr_checks over the last 30 days, grouped by author.
message LeaderboardEntry {
  string author = 1;
  string author_avatar = 2;
  int32 prs = 3;
  float pass_rate = 4;
  int32 violations = 5;
}

// An open rule breaching more than one repo.
message RuleCorrelation {
  string rule_id = 1;
  string rule_name = 2;
  repeated string repo_names = 3;
  int32 total = 4;
}

message RepoCompliance {
  string repo_id = 1;
  string repo_name = 2;
  // Share of the repo's governing rules with no open finding; meaningful only
  // when evaluated is true (otherwise 0.0 means "not evaluated yet").
  float compliance_rate = 3;
  int32 open_violations = 4;
  bool evaluated = 5;
  // Governed rules of blueprints not evaluated yet in this repo (not in the rate).
  int32 rules_pending = 6;
}

message GetRiskDashboardResponse {
  RiskMetrics metrics = 1;
  repeated RiskMatrixCell matrix = 2;
  // Oldest-first, 12 ISO weeks.
  repeated WeeklyTrendPoint weekly_trend = 3;
  repeated BlueprintCoverage coverage = 4;
  // Highest severity first, capped server-side.
  repeated OpenViolationRow open_violations = 5;
  repeated LeaderboardEntry leaderboard = 6;
  repeated RuleCorrelation correlations = 7;
  // Meaningful only when org_evaluated is true.
  float org_compliance_rate = 8;
  repeated RepoCompliance repo_compliance = 9;
  // True when this week's violation evidence rose >=25% (and >=5 rows)
  // over last week.
  bool violation_spike = 10;
  float spike_delta_pct = 11;
  // False when no repo of the org has been evaluated yet: org_compliance_rate
  // is then 0.0 and means "not evaluated", never 0%.
  bool org_evaluated = 12;
}
