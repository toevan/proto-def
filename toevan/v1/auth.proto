syntax = "proto3";

package toevan.v1;

option go_package = "github.com/toevan/api-server/gen/toevan/v1;toevanv1";

import "google/protobuf/timestamp.proto";
import "korelink/v1/moderation.proto";
import "korelink/v1/org.proto";

// ============================================
// AuthService — OAuth2 + JWT Authentication
// ============================================

service AuthService {
  rpc OAuthLogin(OAuthLoginRequest) returns (OAuthLoginResponse);
  rpc OAuthCallback(OAuthCallbackRequest) returns (OAuthCallbackResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc RevokeAllSessions(RevokeAllSessionsRequest) returns (RevokeAllSessionsResponse);

  // API Key management
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (RevokeAPIKeyResponse);

  // Platform role management (super-admin only)
  rpc UpdatePlatformRole(UpdatePlatformRoleRequest) returns (UpdatePlatformRoleResponse);

  // ListAllUsers returns platform-wide users for the platform-admin Users
  // page. Admin-only (same tier as OrgService.ListAllOrgs — a platform-
  // console listing, not a tenant-owned resource).
  rpc ListAllUsers(ListAllUsersRequest) returns (ListAllUsersResponse);

  // Locale
  // ListSupportedLocales is UNAUTHENTICATED — the login screen and the marketing site both
  // need the language list before a user exists. It exposes only the shipped catalogue.
  rpc ListSupportedLocales(ListSupportedLocalesRequest) returns (ListSupportedLocalesResponse);
  // SetUserLocale records an explicit choice. Rejects a locale the client has no bundle for.
  rpc SetUserLocale(SetUserLocaleRequest) returns (SetUserLocaleResponse);
  // SeedUserLocale records the locale a user arrived through, and takes effect only if they
  // have never expressed a preference. Idempotent and safe to call on every sign-in.
  rpc SeedUserLocale(SeedUserLocaleRequest) returns (SeedUserLocaleResponse);
}

// User-level plan — governs individual user access and personal feature limits.
// Distinct from OrgPlan (defined in org.proto) which governs organization-wide limits.
// A user on Pro can be a member of an org on Free — they are independent axes.
enum UserPlan {
  USER_PLAN_UNSPECIFIED = 0;
  USER_PLAN_FREE = 1;                               // basic access, 1 personal repo
  USER_PLAN_PRO = 2;                                // advanced features, 5 personal repos, priority indexing
  USER_PLAN_MAX = 3;                                // power user, 15 personal repos, AI suggestions, priority support
}

enum PlatformRole {
  PLATFORM_ROLE_UNSPECIFIED = 0;
  PLATFORM_ROLE_USER = 1;
  PLATFORM_ROLE_ADMIN = 2;
  PLATFORM_ROLE_SUPERADMIN = 3;
}

// AuthUser is the user profile returned in auth responses.
message AuthUser {
  string id = 1;                                    // internal KoreLink user ID
  string email = 2;
  string name = 3;
  string avatar_url = 4;
  string provider = 5;                              // "github" or "google"
                                                    // NOTE: Distinct from OrgRole (per-organization).
                                                    // Blueprint publishing is a capability, not a role —
                                                    // any user can create/publish blueprints.
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp last_login_at = 7;

  // subscription
  UserPlan plan = 8;                                // individual user plan (Free, Pro, Max)

  // platform role and permissions
  PlatformRole platform_role = 9;                   // [RENAMED from "role"] "user", "admin", "super-admin"
                                                    // NOTE: This is the PLATFORM-LEVEL role (KoreLink account).
                                                    // Distinct from OrgRole which is per-organization.
                                                    // "user" = regular user
                                                    // "admin" = KoreLink staff
                                                    // "super-admin" = KoreLink platform owner
                                                    // No "author" role — blueprint publishing is a capability,
                                                    // not a role. Any user can create/publish blueprints.
  repeated string permissions = 10;                 // permissions assigned to the user (e.g. "project.create", "project.read", "project.update", "project.delete")
  string username = 11;                              // provider username (e.g. GitHub login: "kwado-tech")

  // Locale. Two fields because a recorded preference and a renderable locale are not the
  // same thing: we deliberately remember that a user arrived through the German site before
  // the app ships German bundles, so `locale` can be "de" while `effective_locale` is "en".
  string locale = 12;                               // the user's stored preference; "" = never chosen
  string effective_locale = 13;                     // what the client should actually render — always set

  // Moderation (restriction) state of THIS user, so the client can render an
  // explicit "account restricted" screen instead of a wall of PermissionDenied
  // (GetCurrentUser is the one RPC the moderation interceptor exempts, by
  // design, precisely so this signal has a channel). DELIBERATELY NON-LEAKY:
  // the auth surface only ever reports UNSPECIFIED, SUSPENDED, or BANNED —
  // ACTIVE and FLAGGED (the internal staff-only watch marker) both collapse to
  // UNSPECIFIED here, so an ordinary user learns nothing about being watched.
  ModerationStatus moderation_status = 14;
  // The operator-authored, user-facing justification. Set ONLY when
  // moderation_status is SUSPENDED or BANNED; empty otherwise. Written for the
  // user to read (see PRD_ACCOUNT_TAGS §8) — surfaced verbatim on the screen.
  string moderation_reason = 15;
  // When a SUSPENSION lapses, so the restricted screen can say "until <when>"
  // instead of leaving the user guessing whether it is permanent. Set ONLY
  // alongside SUSPENDED and only when the suspension is time-boxed; unset for
  // BANNED (permanent) and for an open-ended suspension. A lapsed suspension
  // never reaches the client at all — the caller simply reads as unrestricted.
  google.protobuf.Timestamp moderation_suspended_until = 16;

  // Real per-user aggregates for the platform-admin Users table
  // (ListAllUsers) — empty/zero unless that RPC populates them, same
  // "zero unless populated" convention as Org.violation_count/pr_count
  // (org.proto). Every other AuthUser-returning RPC (GetCurrentUser etc.)
  // leaves these at their wire default.
  //
  // EVERY team org this user belongs to (a user may belong to zero, one,
  // or several — a personal account is intentionally excluded, since it's
  // trivial/uninformative for a platform admin), ordered most-recently-
  // active first. Not just a single "primary" org: a user's full
  // membership set is the whole point of a platform-admin roster.
  repeated UserOrgMembership organizations = 17;

  // All-time PR count, matched via pr_checks.author = users.username
  // (case-insensitive GitHub-login match — users.username is never null).
  // 0 when never matched or not populated.
  int32 pr_count = 18;

  // This user's own personal account_id (accounts.id where kind='personal',
  // owner_user_id=this user) — every user has exactly one. Account-scoped
  // operations (e.g. AccountTagsService) key on account_id, not user_id;
  // this is what lets the platform-admin Users page attach one to a user
  // without a second resolver round-trip. Empty unless this RPC populates
  // it (same "zero unless populated" convention as organizations/pr_count).
  string personal_account_id = 19;
}

// One team-org membership, as seen from the platform-admin Users listing
// (AuthUser.organizations) — the org's own display identity plus this
// user's role within it.
message UserOrgMembership {
  string org_name = 1;
  string org_handle = 2;
  OrgRole role = 3;
}

message OAuthLoginRequest {
  string provider = 1;                              // "github" or "google"
  string redirect_uri = 2;                          // where to redirect after consent (client's callback URL)
}
message OAuthLoginResponse {
  string auth_url = 1;                              // full OAuth consent URL — client opens this in a browser/webview
  string state = 2;                                 // CSRF state token — client must verify this on callback
}

message OAuthCallbackRequest {
  string provider = 1;                              // "github" or "google"
  string code = 2;                                  // authorization code from OAuth provider
  string state = 3;                                 // CSRF state — must match the state from OAuthLoginResponse
  string device_name = 4;                           // optional: client-provided device identifier (e.g. "Chrome on macOS")
}
message OAuthCallbackResponse {
  AuthUser user = 1;                                // authenticated user profile
  string access_token = 2;                          // JWT access token (short-lived, e.g. 1 hour)
  string refresh_token = 3;                         // JWT refresh token (long-lived, e.g. 30 days)
  google.protobuf.Timestamp expires_at = 4;
  bool   is_new_user = 5;                          // true if this was the user's first login
}

message RefreshTokenRequest {
  string refresh_token = 1;                         // the refresh token to exchange
}
message RefreshTokenResponse {
  string access_token = 1;                          // new JWT access token
  string refresh_token = 2;                         // new refresh token (rotated)
  google.protobuf.Timestamp expires_at = 3;
}

message GetCurrentUserRequest {}                    // user is extracted from the JWT in the interceptor
message GetCurrentUserResponse {
  AuthUser user = 1;
}

// ---- Session management ----

message SessionInfo {
  string id = 1;
  string device_name = 2;
  string ip_address = 3;
  google.protobuf.Timestamp last_active_at = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListSessionsRequest {
  int32 limit = 1;
  int32 offset = 2;
}
message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
  int32 total = 2;
}

message RevokeSessionRequest {
  string session_id = 1;
}
message RevokeSessionResponse {
  bool success = 1;
  string error = 2;
}

message RevokeAllSessionsRequest {}
message RevokeAllSessionsResponse {
  bool success = 1;
  string error = 2;
}

// ---- API Key management ----

message APIKeyInfo {
  string id = 1;
  string org_id = 2;
  string name = 3;
  string key_prefix = 4;                              // "kl_xxxx" (display only, not full key)
  repeated string scopes = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp last_used_at = 7;
  google.protobuf.Timestamp created_at = 8;
}

message CreateAPIKeyRequest {
  string org_id = 1;
  string name = 2;
  repeated string scopes = 3;
  google.protobuf.Timestamp expires_at = 4;           // optional
}
message CreateAPIKeyResponse {
  APIKeyInfo api_key = 1;
  string secret = 2;                                  // full key — shown ONLY at creation
}

message ListAPIKeysRequest {
  string org_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListAPIKeysResponse {
  repeated APIKeyInfo api_keys = 1;
  int32 total = 2;
}

message RevokeAPIKeyRequest {
  string org_id = 1;
  string key_id = 2;
}
message RevokeAPIKeyResponse {
  bool success = 1;
}

// ---- Platform Role Management ----

message UpdatePlatformRoleRequest {
  string user_id = 1;
  PlatformRole new_role = 2;
}
message UpdatePlatformRoleResponse {
  bool success = 1;
  string previous_role = 2;
  string new_role = 3;
}

// ---- Platform Admin: Users ----

message ListAllUsersRequest {
  int32 limit = 1;
  int32 offset = 2;
  string search = 3;                                  // optional: matches name/email/username
}
message ListAllUsersResponse {
  repeated AuthUser users = 1;
  int32 total = 2;                                     // true platform-wide count matching the request's filters
}

// ---- Locale ----

// SupportedLocale is one entry in the shipped locale catalogue.
message SupportedLocale {
  string code = 1;                                  // BCP-47: "en", "de", "pt-BR"
  string native_name = 2;                           // "Deutsch" — render this in the picker
  string english_name = 3;                          // "German"  — admin surfaces
  bool is_default = 4;                              // the fallback every unresolvable preference lands on
}

message ListSupportedLocalesRequest {}
message ListSupportedLocalesResponse {
  // Only locales the client can actually render (enabled AND a bundle ships for them).
  // Safe to drive a language picker directly — no client-side filtering required.
  repeated SupportedLocale locales = 1;
  string default_code = 2;
}

message SetUserLocaleRequest {
  string locale = 1;                                // must be one of ListSupportedLocales
}
message SetUserLocaleResponse {
  string locale = 1;                                // the stored preference, echoed back
  string effective_locale = 2;                      // what to render — equals locale on success
}

message SeedUserLocaleRequest {
  string locale = 1;                                // the locale the user arrived through
}
message SeedUserLocaleResponse {
  // False means the user already had a preference and it was left untouched. This is the
  // normal outcome on every sign-in after the first, and is not an error.
  bool seeded = 1;
  string locale = 2;                                // the stored preference after this call
  string effective_locale = 3;                      // what to render
}
