syntax = "proto3";

package toevan.v1;

option go_package = "github.com/toevan/api-server/gen/toevan/v1;toevanv1";

import "google/protobuf/timestamp.proto";

// ============================================
// WebhookService — Outbound Event Delivery
// ============================================

service WebhookService {
  rpc CreateWebhook(CreateWebhookRequest) returns (CreateWebhookResponse);
  rpc GetWebhook(GetWebhookRequest) returns (GetWebhookResponse);
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse);
  rpc ListWebhookDeliveries(ListWebhookDeliveriesRequest) returns (ListWebhookDeliveriesResponse);
  // Pause/resume a webhook without destroying it (URL/events stay immutable —
  // rotating a sink is delete+create so the secret always rotates with it).
  // Admin-gated and audited with the old→new value like create/delete.
  rpc SetWebhookEnabled(SetWebhookEnabledRequest) returns (SetWebhookEnabledResponse);
  // Sends a signed `test.ping` payload to the webhook SYNCHRONOUSLY (single
  // attempt, no retry ladder) and reports the endpoint's verdict. The
  // attempt is recorded in the delivery log like any real delivery.
  rpc TestWebhook(TestWebhookRequest) returns (TestWebhookResponse);
}

// ── Types ──

message WebhookInfo {
  string id = 1;
  string org_id = 2;
  string url = 3;
  repeated string events = 4;
  bool enabled = 5;
  string description = 6;
  google.protobuf.Timestamp created_at = 7;
}

message WebhookDeliveryInfo {
  string id = 1;
  string webhook_id = 2;
  string event_type = 3;
  int32 status_code = 4;
  int32 response_ms = 5;
  int32 attempt = 6;
  google.protobuf.Timestamp delivered_at = 7;
  // Never populated. The words of a failed delivery are a transport error's text (a URL, a resolver, a dial), which is for the
  // operator and not for the person reading the list: failure_code says what failed.
  string error = 8;
  google.protobuf.Timestamp created_at = 9;
  // Why the delivery failed, as an ERR_ code the client words: ERR_WEBHOOK_TIMEOUT, ERR_WEBHOOK_DNS, ERR_WEBHOOK_TLS,
  // ERR_WEBHOOK_REFUSED, ERR_WEBHOOK_UNREACHABLE, ERR_WEBHOOK_HTTP_STATUS (the status is status_code), ERR_WEBHOOK_PAYLOAD_TOO_LARGE,
  // ERR_WEBHOOK_REQUEST_FAILED. Empty for a delivery that succeeded, and for a failed delivery recorded before the code existed (the
  // client words it from status_code, or as an unknown failure).
  string failure_code = 10;
}

// ── Requests / Responses ──

message CreateWebhookRequest {
  string org_id = 1;
  string url = 2;
  repeated string events = 3;
  string description = 4;
}
message CreateWebhookResponse {
  WebhookInfo webhook = 1;
  string secret = 2;                                  // full secret — shown ONLY at creation
}

message GetWebhookRequest {
  string org_id = 1;
  string webhook_id = 2;
}
message GetWebhookResponse {
  WebhookInfo webhook = 1;
}

message ListWebhooksRequest {
  string org_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListWebhooksResponse {
  repeated WebhookInfo webhooks = 1;
  int32 total = 2;
}

message DeleteWebhookRequest {
  string org_id = 1;
  string webhook_id = 2;
}
message DeleteWebhookResponse {
  bool success = 1;
}

message ListWebhookDeliveriesRequest {
  string webhook_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListWebhookDeliveriesResponse {
  repeated WebhookDeliveryInfo deliveries = 1;
  int32 total = 2;
}

message SetWebhookEnabledRequest {
  string org_id = 1;
  string webhook_id = 2;
  bool enabled = 3;
}
message SetWebhookEnabledResponse {
  WebhookInfo webhook = 1;
}

message TestWebhookRequest {
  string org_id = 1;
  string webhook_id = 2;
}
message TestWebhookResponse {
  // True when the endpoint answered 2xx.
  bool success = 1;
  // HTTP status the endpoint returned; 0 when the request never completed
  // (network error / timeout), see failure_code.
  int32 status_code = 2;
  int32 response_ms = 3;
  // Never populated (see WebhookDeliveryInfo.error): failure_code says what failed.
  string error = 4;
  // Why the test failed, an ERR_ code the client words (see WebhookDeliveryInfo.failure_code). Empty on success.
  string failure_code = 5;
}
