syntax = "proto3";

package toevan.v1;

option go_package = "github.com/toevan/api-server/gen/toevan/v1;toevanv1";

import "google/protobuf/timestamp.proto";
import "toevan/v1/org.proto";
import "toevan/v1/blueprint.proto";

// ============================================
// PlatformStatsService — aggregate, platform-wide metrics
// ============================================
//
// Backs the platform-admin Overview dashboard's summary numbers (organization
// counts, plan mix, and — over time — whatever else gets a real aggregation).
// Deliberately its own service, not folded into OrgService/etc.: the metrics
// span multiple domains (orgs today; users, PR volume, and more as they land),
// so a single, purpose-built, admin-gated surface is the only home that fits
// all of them without becoming a domain-mismatched grab bag on someone else's
// service.
//
// GetOverviewStatsResponse grows ONE FIELD AT A TIME, and only once its own
// real query exists — never a placeholder for a number nobody computes yet.
// A metric with no real backing does not get a field here; it stays absent
// from the contract until it has real data to report, and the client shows
// "not yet available" rather than a wire zero that reads as "we checked and
// it's zero." total_users, prs_scanned, and mrr_cents all now have real
// backing (the users table, the concluded pr_checks log, and Stripe Model B
// billing respectively), so each carries a field; a genuine 0 (e.g. no paid
// subscriptions) is a real answer the client renders, not "unavailable."
service PlatformStatsService {
  // GetOverviewStats returns platform-wide aggregate metrics for the admin
  // overview dashboard. Admin-only.
  rpc GetOverviewStats(GetOverviewStatsRequest) returns (GetOverviewStatsResponse);

  // GetPlatformAnalytics returns platform-wide aggregate metrics for the
  // admin Analytics dashboard (scan volume, blueprint adoption/publishing,
  // AI fix outcomes). A distinct RPC from GetOverviewStats — different page,
  // different metrics — not a second copy of the same "grow one field at a
  // time, only once real" discipline stated above, which applies here too.
  // Admin-only.
  rpc GetPlatformAnalytics(GetPlatformAnalyticsRequest) returns (GetPlatformAnalyticsResponse);

  // GetRevenueStats returns platform-wide revenue metrics for the admin
  // Revenue dashboard: subscription MRR/ARR + a per-plan breakdown + churn,
  // the accruing MRR history, and blueprint-marketplace sales. A distinct RPC
  // from the two above — same "grow one field at a time, only once real"
  // discipline applies. Admin-only.
  rpc GetRevenueStats(GetRevenueStatsRequest) returns (GetRevenueStatsResponse);
}

message GetOverviewStatsRequest {}

message GetOverviewStatsResponse {
  // Every non-deleted account (orgs + personal accounts), same population
  // `OrgService.ListAllOrgs`'s own `total` reports — so this number always
  // agrees with what an admin sees paging through that list.
  int32 total_orgs = 1;

  // total_orgs broken down by plan tier. Always sums to total_orgs — same
  // population, grouped instead of listed.
  repeated PlanCount plan_distribution = 2;

  // Cumulative total_orgs population AS OF each of the last 7 ISO week
  // boundaries (Monday 00:00 UTC), oldest first. The final entry always
  // equals total_orgs above (evaluated at the same instant). Powers the
  // Overview dashboard's org-growth sparkline — derived on demand from
  // accounts.created_at/deleted_at, not a snapshot table, so history is
  // correct from day one rather than only accumulating from deploy forward.
  repeated WeeklyOrgCount weekly_org_growth = 3;

  // Every non-deleted platform user (users table, deleted_at IS NULL). The raw
  // people count, distinct from total_orgs (accounts): one org has many users.
  int32 total_users = 4;

  // All-time PRs scanned platform-wide: concluded pr_checks rows
  // (status passed/warning/blocked). The same figure the Analytics dashboard
  // reports as prs_scanned_total, so the two surfaces always agree.
  int32 prs_scanned = 5;

  // Monthly Recurring Revenue in minor units (EUR cents). Summed over ACTIVE
  // subscriptions from the catalogue price (entitlement.ShippedPrice) x seats,
  // with annual subscriptions normalized to monthly (period total / 12). Money
  // stays integer cents on the wire; the client formats to EUR at the edge.
  int64 mrr_cents = 6;
}

message PlanCount {
  OrgPlan plan = 1;
  int32 count = 2;
}

message WeeklyOrgCount {
  google.protobuf.Timestamp week_start = 1;
  int32 total_orgs = 2;
}

message GetPlatformAnalyticsRequest {}

// Tier a blueprint is presented under in admin/marketplace surfaces.
// Derived server-side from (source, license) — see
// internal/platformanalytics.ClassifyBlueprintTier for the exact rule and
// its documented product basis (the marketplace page's access-model
// explainer). Not a raw column; there is no single DB field for this.
enum BlueprintTier {
  BLUEPRINT_TIER_UNSPECIFIED = 0;
  BLUEPRINT_TIER_OFFICIAL = 1;
  BLUEPRINT_TIER_PREMIUM = 2;
  BLUEPRINT_TIER_COMMUNITY = 3;
}

message GetPlatformAnalyticsResponse {
  // All-time count of pr_checks that concluded a scan (status IN passed,
  // warning, blocked) — mirrors DevWeekly's "concluded" convention.
  int32 prs_scanned_total = 1;

  // Trailing 7 ISO calendar weeks of scan volume + average violations per
  // scanned PR, oldest first. Powers the Weekly PR Volume chart AND both
  // the "this week" and Avg-Violations trend deltas — same 7-week window,
  // one query, so the chart and the stat cards can never drift apart.
  repeated WeeklyPRStat weekly_pr_stats = 2;

  // Non-deleted blueprints with status=published.
  int32 blueprints_published_total = 3;
  // Same population, published_at >= start of the current calendar month.
  int32 blueprints_published_month_to_date = 4;

  // Active-adoption counts grouped by BlueprintType. Always sums to the
  // total active-adoption count (client derives percentages from the
  // counts, same as it already does).
  repeated BlueprintTypeShare blueprint_adoption_by_type = 5;

  // Top blueprints by active-adoption count, highest first.
  repeated TopAdoptedBlueprint top_blueprints = 6;

  // Fraction of AI-suggested-fix dispatches (manual apply, existing-PR
  // apply, and org-level auto-fix — all three funnel into the same
  // agent_runs dispatch, see ClassifyBlueprintTier's sibling doc in
  // internal/platformanalytics) whose linked fix branch/PR ended up merged,
  // for the current ISO week. Absent (not zero) when there were zero
  // dispatches in the window — a metric with no denominator has no rate.
  optional double ai_fix_merge_rate = 7;
  // Same metric, prior ISO week — powers the trend delta. Absent under the
  // same zero-denominator rule.
  optional double ai_fix_merge_rate_prev = 8;
}

message WeeklyPRStat {
  google.protobuf.Timestamp week_start = 1;
  int32 scanned_count = 2;
  double avg_violations = 3;
}

message BlueprintTypeShare {
  BlueprintType type = 1;
  int32 count = 2;
}

message TopAdoptedBlueprint {
  string blueprint_id = 1;
  string name = 2;
  BlueprintTier tier = 3;
  int32 adoption_count = 4;
  // Adoption-event growth, current vs prior ISO week, as a fraction (e.g.
  // 0.12 = +12%). Absent when there were zero adoptions in the prior week
  // (no baseline to compare against), same zero-denominator rule as above.
  optional double growth_pct = 5;
}

// RevenuePeriod is the aggregation window the Revenue dashboard's WINDOWED
// metrics use (churn, blueprint sales, and the growth-chart granularity). The
// MRR/ARR rate cards and the per-plan breakdown are point-in-time rates and do
// NOT change with the period. UNSPECIFIED is treated as MONTHLY.
enum RevenuePeriod {
  REVENUE_PERIOD_UNSPECIFIED = 0;
  REVENUE_PERIOD_MONTHLY = 1;     // trailing 1 month
  REVENUE_PERIOD_QUARTERLY = 2;   // trailing 3 months
  REVENUE_PERIOD_SIX_MONTHS = 3;  // trailing 6 months
  REVENUE_PERIOD_ANNUAL = 4;      // trailing 12 months
}

message GetRevenueStatsRequest {
  // The aggregation window for the windowed metrics. UNSPECIFIED => MONTHLY.
  RevenuePeriod period = 1;
}

// GetRevenueStatsResponse backs the platform-admin Revenue dashboard. Same
// "grow one field at a time, only once real" discipline as the sibling
// responses: every figure here has a real query behind it (Stripe Model B
// subscriptions for MRR/ARR/plan/churn, the mrr_snapshots table a periodic job
// records for history, blueprint_purchases for marketplace sales). Money is
// integer EUR cents on the wire; the client formats it at the edge. Rates that
// have no denominator (no paying base) are absent, not a fabricated zero.
message GetRevenueStatsResponse {
  // Monthly Recurring Revenue in minor units (EUR cents), current — the SAME
  // reporter GetOverviewStats.mrr_cents uses, so the two surfaces agree.
  int64 mrr_cents = 1;

  // Annual Recurring Revenue = mrr_cents x 12, in minor units. Precomputed so
  // both cards format from one source rather than the client re-deriving it.
  int64 arr_cents = 2;

  // MRR broken down by self-serve plan over the SAME active subscriptions,
  // each with its paying-subscriber count. Only plans that carry catalogue
  // prices appear (team + personal pro/max); negotiated (enterprise) and free
  // are not self-serve MRR and are omitted rather than shown as a fake zero.
  repeated PlanRevenue revenue_by_plan = 3;

  // Subscription churn over the request's trailing PERIOD as a fraction (0.018 =
  // 1.8%): paid subscriptions canceled in the window over the paying base at the
  // window start. Absent (not zero) when there is no paying base — a churn rate
  // with no denominator is not a rate.
  optional double churn_rate = 4;
  // The same metric over the PRIOR equal-length window — powers the trend delta.
  // Absent under the same no-denominator rule.
  optional double churn_rate_prev = 5;

  // MRR snapshots bucketed to the request's period granularity (one point per
  // month/quarter/half/year, the latest snapshot in each bucket), oldest first —
  // the growth chart. Derived from the mrr_snapshots table a periodic job
  // records, so history accrues from the first snapshot forward (sparse at first)
  // and is never fabricated.
  repeated MrrSnapshotPoint mrr_history = 6;

  // Blueprint-marketplace gross sales over the request's trailing PERIOD, in
  // minor units (sum of blueprint_purchases.price_paid_minor). 0 is a real answer
  // (no sales in the window), not "unavailable".
  int64 blueprint_sales_period_cents = 7;
  // The same gross sales over the PRIOR equal-length window — powers the delta.
  int64 blueprint_sales_prev_period_cents = 8;
  // Per-blueprint marketplace sales over the request's trailing PERIOD, highest
  // revenue first.
  repeated BlueprintSaleRow blueprint_sales = 9;

  // The platform commission applied to marketplace sales, as a fraction
  // (0.20 = 20%). A live platform-config knob, sent so the client labels the
  // fee column with the current rate instead of a hardcoded percentage.
  double marketplace_commission_rate = 10;
}

message PlanRevenue {
  // Display name of the plan tier ("Team", "Pro", "Max"). A plain label, not
  // an enum: the breakdown spans both the org axis (team) and the personal
  // axis (pro/max), which are distinct plan enums, so one label string is the
  // only shape that carries both uniformly.
  string plan_name = 1;
  // This plan's contribution to MRR, in minor units (EUR cents).
  int64 mrr_cents = 2;
  // Number of active paying subscriptions on this plan.
  int32 subscriber_count = 3;
}

message MrrSnapshotPoint {
  // First day (UTC) of the snapshot's calendar month.
  google.protobuf.Timestamp period_month = 1;
  // MRR captured for that month, in minor units (EUR cents).
  int64 mrr_cents = 2;
}

message BlueprintSaleRow {
  string blueprint_id = 1;
  string name = 2;
  // The blueprint author — the display name of the creating user
  // (blueprints.created_by -> users.name), the same identity the marketplace
  // shows as the author. There is no separate publisher entity.
  string author = 3;
  // The blueprint's current list price, in minor units (EUR cents).
  int64 unit_price_cents = 4;
  // Number of purchases this calendar month.
  int32 sales_count = 5;
  // Gross revenue this calendar month (sum of price_paid_minor), minor units.
  int64 revenue_cents = 6;
  // The platform's cut = revenue_cents x marketplace_commission_rate, minor
  // units, rounded. Precomputed so the table never re-derives money on the
  // client.
  int64 platform_fee_cents = 7;
}
