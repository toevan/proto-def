syntax = "proto3";

package toevan.v1;

option go_package = "github.com/toevan/api-server/gen/toevan/v1;toevanv1";

import "google/protobuf/timestamp.proto";

// ============================================
// BlueprintService — CRUD, Marketplace, Reviews, Purchases
// ============================================

service BlueprintService {
  // CRUD
  rpc CreateBlueprint(CreateBlueprintRequest) returns (CreateBlueprintResponse);
  rpc GetBlueprint(GetBlueprintRequest) returns (Blueprint);
  rpc UpdateBlueprint(UpdateBlueprintRequest) returns (UpdateBlueprintResponse);
  rpc SearchBlueprints(SearchBlueprintsRequest) returns (SearchBlueprintsResponse);

  // Marketplace
  rpc PublishBlueprint(PublishBlueprintRequest) returns (PublishBlueprintResponse);
  rpc ListMarketplaceBlueprints(ListMarketplaceRequest) returns (ListMarketplaceResponse);
  rpc ArchiveBlueprint(ArchiveBlueprintRequest) returns (ArchiveBlueprintResponse);

  // Review & Approval Workflow
  rpc ValidateBlueprint(ValidateBlueprintRequest) returns (ValidateBlueprintResponse);
  rpc SubmitBlueprintForReview(SubmitForReviewRequest) returns (SubmitForReviewResponse);
  rpc ApproveBlueprintSubmission(ApproveBlueprintRequest) returns (ApproveBlueprintResponse);
  rpc RejectBlueprintSubmission(RejectBlueprintRequest) returns (RejectBlueprintResponse);
  rpc ListPendingBlueprintReviews(ListPendingReviewsRequest) returns (ListPendingReviewsResponse);
  // ListBlueprintDrafts lists an organization's draft blueprints to its members, and the
  // caller's own drafts that belong to no organization.
  rpc ListBlueprintDrafts(ListBlueprintDraftsRequest) returns (ListBlueprintDraftsResponse);
  rpc GetBlueprintReviewHistory(GetReviewHistoryRequest) returns (GetReviewHistoryResponse);

  // Versioning
  rpc CreateBlueprintVersion(CreateVersionRequest) returns (CreateVersionResponse);
  rpc GetBlueprintVersionHistory(GetVersionHistoryRequest) returns (GetVersionHistoryResponse);
  rpc CompareBlueprintVersions(CompareBlueprintVersionsRequest) returns (CompareBlueprintVersionsResponse);
  rpc GetBlueprintImpactAnalysis(GetBlueprintImpactAnalysisRequest) returns (GetBlueprintImpactAnalysisResponse);
  // The preview of a blueprint (the dry run) runs where the repository's clone and the index live, in the
  // index worker, on the commit the repository was last indexed at, with the engine an index run uses. It
  // is asynchronous: StartBlueprintPreview queues it and answers a preview id; GetBlueprintPreview reads the
  // status and, once it SUCCEEDED, the result. Nothing is written for the repositories (no violation,
  // verdict or evidence); the result is kept for a short while for this read only. The synchronous
  // DryRunBlueprintConstraints is gone: the API server holds no clone, so it could not check a rule that
  // reads files and answered "0 findings" for a run that checked nothing.
  rpc StartBlueprintPreview(StartBlueprintPreviewRequest) returns (StartBlueprintPreviewResponse);
  rpc GetBlueprintPreview(GetBlueprintPreviewRequest) returns (GetBlueprintPreviewResponse);
  // AI explanation of one dry-run violation: why the engine flagged it and
  // whether the fix belongs in the code or in the blueprint (review-first flow).
  rpc ExplainDryRunViolation(ExplainDryRunViolationRequest) returns (ExplainDryRunViolationResponse);
  // Full engine validation of an IN-FLIGHT spec (nothing saved) — backs the
  // editor's live as-you-type validation against the authoring contract.
  rpc ValidateBlueprintSpec(ValidateBlueprintSpecRequest) returns (ValidateBlueprintResponse);

  // User Reviews
  rpc ReviewBlueprint(ReviewBlueprintRequest) returns (ReviewBlueprintResponse);
  rpc GetBlueprintReviews(GetReviewsRequest) returns (GetReviewsResponse);

  // Assignment & Updates
  rpc AssignBlueprint(BlueprintAssignRequest) returns (BlueprintAssignResponse);
  rpc RemoveBlueprint(BlueprintRemoveRequest) returns (BlueprintRemoveResponse);
  rpc ListProjectBlueprints(ListProjectBlueprintsRequest) returns (ListProjectBlueprintsResponse);
  rpc ListRepoBlueprints(BlueprintListRepoAssignmentsRequest) returns (BlueprintListRepoAssignmentsResponse);
  rpc CheckBlueprintUpdates(CheckUpdatesRequest) returns (CheckUpdatesResponse);
  rpc GetBlueprintAnalytics(GetAnalyticsRequest) returns (BlueprintAnalytics);
  rpc UpdateAdoptionParams(UpdateAdoptionParamsRequest) returns (BlueprintAssignResponse);
  // AddAdoptionRuleExclude appends a single exclude entry to a rule's
  // param_overrides on an adoption. Atomic on the server: reads the current
  // overrides, merges the new entry with append + dedupe semantics
  // (see internal/constraint/params_merge.go), writes back. Admin-gated.
  // Designed for the canvas-details "Add to exceptions" admin action.
  rpc AddAdoptionRuleExclude(AddAdoptionRuleExcludeRequest) returns (AddAdoptionRuleExcludeResponse);
  rpc ListBlueprintAdopters(ListBlueprintAdoptersRequest) returns (ListBlueprintAdoptersResponse);
  rpc ListOrgAdoptedBlueprints(ListOrgAdoptedBlueprintsRequest) returns (ListOrgAdoptedBlueprintsResponse);
  rpc SetAdoptionStatus(SetAdoptionStatusRequest) returns (SetAdoptionStatusResponse);
  // SetAdoptionMode sets whether adoptions ENFORCE (their rules can block the PR gate under the org's
  // gate policy) or ANNOTATE (findings are reported, never block). Org admin only. Pause stays on
  // SetAdoptionStatus.
  rpc SetAdoptionMode(SetAdoptionModeRequest) returns (SetAdoptionModeResponse);

  // Purchases (premium blueprints)
  rpc RecordBlueprintPurchase(RecordPurchaseRequest) returns (RecordPurchaseResponse);
  rpc GetUserPurchases(GetUserPurchasesRequest) returns (GetUserPurchasesResponse);

  // Compliance Coverage
  rpc ListComplianceFrameworks(ListComplianceFrameworksRequest) returns (ListComplianceFrameworksResponse);
  // DEPRECATED, and answers Unimplemented. It counted every rule_control_mappings row as covered with no
  // checkable gate, no cap on a part and no level: a third, divergent derivation of requirement coverage.
  // Use GetBlueprintRequirementCoverage, which states each requirement's level.
  rpc GetComplianceCoverage(GetComplianceCoverageRequest) returns (ComplianceCoverageReport) {
    option deprecated = true;
  }
  // GetBlueprintRequirementCoverage states which of a compliance blueprint's framework
  // requirements it checks in code, which cannot be checked in code (and why), and, per rule,
  // when it blocks (before merge or after merge on main) under the caller's org gate policy.
  // Pure read: no index work. Auth: the blueprint read gate, then org membership of org_id.
  rpc GetBlueprintRequirementCoverage(GetBlueprintRequirementCoverageRequest) returns (GetBlueprintRequirementCoverageResponse);

  // Auto-Detected (Inferred) Blueprints
  rpc GetInferredBlueprint(GetInferredBlueprintRequest) returns (GetInferredBlueprintResponse);
  rpc AdoptInferredBlueprint(AdoptInferredBlueprintRequest) returns (AdoptInferredBlueprintResponse);
  // Saves the repository's detected blueprint as a DRAFT: a persisted review decision that never
  // enforces, gates or writes evidence. Idempotent. Maintainer on the repository, like adopt.
  rpc KeepInferredBlueprintAsDraft(KeepInferredBlueprintAsDraftRequest) returns (KeepInferredBlueprintAsDraftResponse);
  // Dismisses the repository's detected blueprint ("Suggested from your code" x): a persisted review
  // decision that never enforces and is not offered again by GetInferredBlueprint or
  // ListInferredBlueprints. Idempotent. Maintainer on the repository, like keep-as-draft. Refused with
  // ERR_STRUCTURAL_BLUEPRINTS_DISABLED while the structural_blueprints flag is OFF.
  rpc DismissInferredBlueprint(DismissInferredBlueprintRequest) returns (DismissInferredBlueprintResponse);
  // One row per repository (that the caller can access) with a detection no adoption governs.
  rpc ListInferredBlueprints(ListInferredBlueprintsRequest) returns (ListInferredBlueprintsResponse);
  rpc ReinferBlueprint(ReinferBlueprintRequest) returns (ReinferBlueprintResponse);
}

// ── Core Blueprint Types ──

message BlueprintRule {
  string id = 1;
  string name = 2;
  string source_layer = 3;   // layer that depends (architectural rules)
  string target_layer = 4;   // layer being depended on (architectural rules)
  bool   allowed = 5;        // architectural rules only
  string description = 6;
  string enforcement = 7;    // "required", "recommended", "optional"
  string rule_type = 8;      // constraint type: "secret_detection", "iac_access_control", etc.
  string severity = 9;       // "CRITICAL", "ERROR", "WARNING", "INFO"
  string params_json = 10;   // JSON-encoded rule parameters
  string controls_json = 11; // JSON-encoded compliance control mappings
}

// Blueprint scope: project or repo
enum BlueprintScope {
  BLUEPRINT_SCOPE_UNSPECIFIED = 0;
  BLUEPRINT_SCOPE_PROJECT = 1;
  BLUEPRINT_SCOPE_REPO = 2;
}

// Blueprint source: who maintains it
enum BlueprintSource {
  BLUEPRINT_SOURCE_UNSPECIFIED = 0;
  BLUEPRINT_SOURCE_SYSTEM = 1;       // Toevan-maintained essentials
  BLUEPRINT_SOURCE_COMMUNITY = 2;    // user-created, shared publicly
  BLUEPRINT_SOURCE_MARKETPLACE = 3;  // curated/paid blueprints
}

// Blueprint type: what it enforces
enum BlueprintType {
  BLUEPRINT_TYPE_UNSPECIFIED = 0;
  BLUEPRINT_TYPE_SECURITY = 1;
  BLUEPRINT_TYPE_COMPLIANCE = 2;
  BLUEPRINT_TYPE_STRUCTURAL = 3;
  BLUEPRINT_TYPE_DESIGN = 4;
}

// Blueprint reference with both ID and display name for UI rendering
message BlueprintRef {
  string blueprint_id = 1;
  string blueprint_name = 2;            // "PCI-DSS Compliance"
  string blueprint_version = 3;
  BlueprintScope scope = 4;                      // "project" or "repo"
  // "structural" | "compliance" | "security" | "design" — clients key the
  // type icon on this (the marketplace icon convention).
  string blueprint_type = 5;
  // Rules the adoption runs (compiled rows at its pinned version, minus the ones the
  // executor skips). Absent = UNKNOWN (the count could not be taken); 0 = none.
  optional int32 rule_count = 6;
}

message Blueprint {
  string id = 1;
  string slug = 2;               // URL-safe identifier: "clean-architecture-flutter"
  string name = 3;
  string description = 4;
  repeated BlueprintRule rules = 5;
  repeated string languages = 6;
  repeated string frameworks = 7;  // ["flutter"], ["gin", "echo"]
  string project_type = 8;        // "mobile", "backend", "fullstack"
  map<string, string> layer_patterns = 9; // regex patterns for layer detection
  repeated string tags = 10;
  google.protobuf.Timestamp created_at = 11;
  string author_id = 12;
  string author_name = 13;
  string status = 14;            // "draft", "pending_review", "approved", "rejected", "published", "archived", "deleted"
  string version = 15;           // semver: "1.0.0", "2.1.0"
  string parent_id = 16;         // root blueprint ID for version chain
  string changelog = 17;
  int32  downloads = 18;
  float  rating = 19;
  int32  rating_count = 20;
  google.protobuf.Timestamp published_at = 21;
  google.protobuf.Timestamp updated_at = 22;
  string license = 23;           // "free" or "premium"
  // Field 24 was `float price`. Money is never a float: 4.99 is not representable in
  // binary floating point, and repeated arithmetic drifts. Integer minor units only.
  reserved 24;
  reserved "price";
  int64  price_minor = 39;       // 0 for free, e.g. 499 for EUR 4.99
  string full_spec_json = 25;
  string reviewer_id = 26;
  string reviewer_notes = 27;
  string rejection_reason = 28;
  google.protobuf.Timestamp submitted_at = 29;
  google.protobuf.Timestamp reviewed_at = 30;
  repeated string validation_errors = 31;
  string blueprint_type = 32;      // "compliance", "structural", "design", "security"
  string visibility = 33;          // "public" (marketplace) or "org_private" (org-only)
  string source = 34;              // "system" (Toevan-maintained), "community" (user-created), "marketplace" (curated/paid)
  string documentation = 35;       // markdown documentation: implementation guides, best practices, usage instructions
  google.protobuf.Timestamp deprecated_at = 36;  // when the blueprint was deprecated (null = active)
  string successor_id = 37;                       // ID of the successor blueprint (null = no successor)
  string migration_guide = 38;                    // markdown migration instructions
}

message BlueprintVersionEntry {
  string id = 1;
  string version = 2;
  string changelog = 3;
  string status = 4;
  int32  downloads = 5;
  google.protobuf.Timestamp created_at = 6;
}

message BlueprintReview {
  string id = 1;
  string blueprint_id = 2;
  string user_id = 3;
  int32  rating = 4;             // 1-5
  string comment = 5;
  google.protobuf.Timestamp created_at = 6;
  string user_name = 7;
  string user_avatar_url = 8;
}

message BlueprintAdoption {
  string blueprint_id = 1;
  string blueprint_version = 2;
  string project_id = 3;
  google.protobuf.Timestamp adopted_at = 4;
  bool   is_active = 5;
}

message ScopedBlueprintAssignment {
  string assignment_id = 1;
  string blueprint_id = 2;
  string blueprint_name = 3;
  string blueprint_version = 4;
  BlueprintScope scope = 5;
  bool is_active = 6;
  bool inherited = 7;
  string project_id = 8;
  string repo_id = 9;
  google.protobuf.Timestamp assigned_at = 10;
  // Rules the adoption runs. Absent = UNKNOWN (the count could not be taken, or this
  // response does not carry it); 0 = none.
  optional int32 rule_count = 11;
  // (renumbered from 11 on consolidation: projects-reads holds 11 for rule_count)
  // The adoption's mode. Never UNSPECIFIED from the server; a paused adoption keeps its mode.
  AdoptionEnforcementMode enforcement_mode = 13;
  // ACTIVE or PAUSED on the project and repo reads (a removed adoption is not listed). A paused
  // adoption is listed with is_active=false, is not evaluated and does not gate.
  AdoptionLifecycle lifecycle = 12;
}

// The adoption lifecycle. is_active is true exactly when ACTIVE.
enum AdoptionLifecycle {
  ADOPTION_LIFECYCLE_UNSPECIFIED = 0;
  // Evaluated, gates per its mode.
  ADOPTION_LIFECYCLE_ACTIVE = 1;
  // Listed, NOT evaluated, does not gate; findings and evidence retained; resumable.
  ADOPTION_LIFECYCLE_PAUSED = 2;
  // Gone from every read; evaluation evidence retired.
  ADOPTION_LIFECYCLE_REMOVED = 3;
}

// What an adoption's findings may do at the PR gate. Pause is not a mode: it is is_active=false.
enum AdoptionEnforcementMode {
  ADOPTION_ENFORCEMENT_MODE_UNSPECIFIED = 0;
  // The adoption's rules can block the PR gate, per the org's gate policy.
  ADOPTION_ENFORCEMENT_MODE_ENFORCE = 1;
  // Findings are reported (annotations, canvas, evidence) and never block.
  ADOPTION_ENFORCEMENT_MODE_ANNOTATE = 2;
}

message BlueprintAnalytics {
  string blueprint_id = 1;
  string blueprint_name = 2;
  int32  total_adoptions = 3;
  int32  active_adoptions = 4;
  int32  total_builds = 5;
  int32  successful_builds = 6;
  float  build_success_rate = 7;
  float  average_rating = 8;
  int32  total_downloads = 9;
  int32  version_count = 10;
}

message ValidationIssue {
  string severity = 1;               // "error" (blocking) or "warning" (advisory)
  string message = 2;
}

// ── CRUD Request/Response ──

message CreateBlueprintRequest {
  Blueprint blueprint = 1;
  // The organization the blueprint is created in: the blueprint is private to it. The caller
  // must be able to write in it. An older client sends none.
  string org_id = 2;
}
message CreateBlueprintResponse {
  Blueprint blueprint = 1;
  repeated ValidationIssue validation_issues = 2;
}

message GetBlueprintRequest {
  string blueprint_id = 1;   // lookup by UUID
  string slug = 2;           // lookup by URL-friendly slug (published blueprints only)
}

message UpdateBlueprintRequest {
  string blueprint_id = 1;
  Blueprint blueprint = 2;
}
message UpdateBlueprintResponse {
  Blueprint blueprint = 1;
  repeated ValidationIssue validation_issues = 2;
}

message SearchBlueprintsRequest {
  string query = 1;
  repeated string tags = 2;
  int32 limit = 3;
  BlueprintSource source = 4;      // filter by source (0 = all)
  BlueprintType type = 5;          // filter by type (0 = all)
  string language = 6;             // filter by language
  // The organization the caller is searching for (optional); same meaning as
  // ListMarketplaceRequest.org_id.
  string org_id = 7;
}
message SearchBlueprintsResponse {
  repeated Blueprint blueprints = 1;
  repeated float scores = 2;
}

// ── Marketplace ──

message PublishBlueprintRequest { string blueprint_id = 1; }
message PublishBlueprintResponse {
  bool   success = 1;
  string error = 2;
}

message ListMarketplaceRequest {
  repeated string tags = 1;
  string language = 2;
  string sort_by = 3;              // "downloads", "newest", "relevance" (default when query is set)
  int32  limit = 4;
  int32  offset = 5;
  string license = 6;
  string project_type = 7;
  string framework = 8;
  BlueprintSource source = 9;     // filter by source (0 = all)
  BlueprintType type = 10;        // filter by type (0 = all)
  string query = 11;              // free-text search against name, tags, languages, frameworks
  // Multi-type filter: OR-semantics across entries (e.g. [SECURITY, COMPLIANCE]
  // = the project-scope catalog the onboarding wizard shows). Empty = no type
  // filter. When set, takes precedence over the single `type` field.
  repeated BlueprintType types = 12;
  // The organization the caller is browsing for (optional). The structural_blueprints feature
  // flag is evaluated for it: OFF removes the structural (architecture) blueprints from the
  // listing. The caller must be a member of it. Empty = the global flag value.
  string org_id = 13;
}
message ListMarketplaceResponse {
  repeated Blueprint blueprints = 1;
  int32 total = 2;
}


message ArchiveBlueprintRequest { string blueprint_id = 1; }
message ArchiveBlueprintResponse {
  bool   success = 1;
  string error = 2;
}

// ── Validation ──

message ValidateBlueprintRequest { string blueprint_id = 1; }
message ValidateBlueprintResponse {
  bool                    valid = 1;
  int32                   error_count = 2;
  int32                   warning_count = 3;
  repeated ValidationIssue issues = 4;
}

// ── Review & Approval ──

message SubmitForReviewRequest { string blueprint_id = 1; }
message SubmitForReviewResponse {
  bool      success = 1;
  string    error = 2;
  Blueprint blueprint = 3;
  string    outcome = 4;
  int32     error_count = 5;
  int32     warning_count = 6;
}

message ApproveBlueprintRequest {
  string blueprint_id = 1;
  string reviewer_id = 2;
  string notes = 3;
  bool   auto_publish = 4;
}
message ApproveBlueprintResponse {
  bool   success = 1;
  string error = 2;
}

message RejectBlueprintRequest {
  string blueprint_id = 1;
  string reviewer_id = 2;
  string reason = 3;
  string notes = 4;
}
message RejectBlueprintResponse {
  bool   success = 1;
  string error = 2;
}

message ListPendingReviewsRequest {
  int32 limit = 1;
  int32 offset = 2;
}
message ListPendingReviewsResponse {
  repeated Blueprint blueprints = 1;
  int32 total = 2;
}

message ListBlueprintDraftsRequest {
  // The organization whose drafts are listed; the caller must be a member of it. The reply also
  // holds the caller's own drafts that belong to no organization.
  string org_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListBlueprintDraftsResponse {
  repeated Blueprint blueprints = 1;
  int32 total = 2;
}

message GetReviewHistoryRequest {
  int32 limit = 1;
  int32 offset = 2;
}
message GetReviewHistoryResponse {
  repeated Blueprint blueprints = 1;
}

// ── Versioning ──

message CreateVersionRequest {
  string parent_id = 1;
  string new_version = 2;
  string changelog = 3;
}
message CreateVersionResponse {
  Blueprint blueprint = 1;
}

message GetVersionHistoryRequest { string parent_id = 1; }
message GetVersionHistoryResponse {
  repeated BlueprintVersionEntry versions = 1;
}

// ── User Reviews ──

message ReviewBlueprintRequest {
  string blueprint_id = 1;
  string user_id = 2;
  int32  rating = 3;
  string comment = 4;
}
message ReviewBlueprintResponse {
  bool   success = 1;
  string error = 2;
}

message GetReviewsRequest {
  string blueprint_id = 1;
  int32  limit = 2;
}
message GetReviewsResponse {
  repeated BlueprintReview reviews = 1;
}

// ── Assignment & Updates ──


message BlueprintAssignRequest {
  string blueprint_id = 1;
  string blueprint_version = 2;          // optional; defaults to latest published version
  repeated string project_ids = 3;       // project-scoped targets (compliance, security)
  repeated string repo_ids = 4;          // repo-scoped targets (structural, design)
  string param_overrides_json = 5;       // optional: per-rule param overrides JSON
  // Start-as mode (PJ-C2): what the new adoption's findings may do at the PR gate, applied in the
  // same transaction that creates it, so no window gates under the default. UNSPECIFIED = the
  // default (ENFORCE). Security Essentials is always ENFORCE: ANNOTATE for it is refused with
  // ERR_SE_ALWAYS_ENFORCED and nothing is created. The mode applies to every target of the request:
  // one Security Essentials target with ANNOTATE refuses the whole request before any adoption is
  // created. Starting as ANNOTATE needs org admin of every target's organization
  // (ERR_ANNOTATE_START_REQUIRES_ADMIN, PermissionDenied); ENFORCE and unset keep the developer floor.
  AdoptionEnforcementMode enforcement_mode = 6;
}

// Per-target assignment result. On failure, assignment is nil and error is set.
message AssignmentResult {
  string target_id = 1;                  // project_id or repo_id that was targeted
  ScopedBlueprintAssignment assignment = 2; // populated on success
  string error = 3;                      // populated on failure (savepoint rolled back)
  // The domain ERR_ code of the failure (e.g. ERR_STRUCTURAL_BLUEPRINTS_DISABLED), empty on success
  // or when the failure carries none. Localise on this, never on `error`.
  string error_code = 4;
}

message BlueprintAssignResponse {
  repeated AssignmentResult results = 1;
  int32 succeeded = 2;
  int32 failed = 3;
}

message UpdateAdoptionParamsRequest {
  string adoption_id = 1;
  string param_overrides_json = 2;       // per-rule param overrides JSON
}

// AddAdoptionRuleExcludeRequest carries a single matcher entry to append
// to a rule's `exclude` list on an adoption's param_overrides. The server
// reads the current overrides, merges the new entry with append + dedup
// semantics (identity tuple = type+pattern+language), and persists. When
// an entry with the same identity already exists, the server's
// override-wins semantics merges the metadata (notably `reason`).
message AddAdoptionRuleExcludeRequest {
  string adoption_id = 1;   // blueprint_adoptions.id (UUID)
  string rule_id     = 2;   // e.g. "handler-lives-in-handler-file"
  ParamOverrideMatcher exclude = 3;  // matcher entry to append
}

// ParamOverrideMatcher mirrors constraint.MatchRule's JSON shape — the
// shape the constraint engine reads at evaluation time. Predicate is
// (type, pattern, language); reason is metadata surfaced in audit
// traces and violation panels.
message ParamOverrideMatcher {
  string type     = 1;   // "name_equals" | "name_suffix" | "directory" | "extends" | "implements" | "annotation"
  string pattern  = 2;   // pattern value matched by `type`
  string language = 3;   // optional — when set, matcher fires only for symbols of this language
  string reason   = 4;   // optional human-readable rationale for the exempt
}

message AddAdoptionRuleExcludeResponse {
  AssignmentResult result = 1;  // the updated adoption (same shape as UpdateAdoptionParams)
}

message BlueprintRemoveRequest {
  string assignment_id = 1;
  string context_repo_id = 2; // optional; used to reject inherited removal from repo context
}
message BlueprintRemoveResponse {}

message ListProjectBlueprintsRequest {
  string project_id = 1;
}
message ListProjectBlueprintsResponse {
  repeated ScopedBlueprintAssignment assignments = 1;
  // The counts of the listed assignments, computed once on the server so every surface agrees.
  // The list also holds PAUSED adoptions (is_active=false, lifecycle PAUSED); a paused adoption is in
  // neither count.
  int32 enforcing_count = 2;
  int32 annotating_count = 3;
}

message BlueprintListRepoAssignmentsRequest {
  string repo_id = 1;
  bool include_inherited = 2;
}
message BlueprintListRepoAssignmentsResponse {
  repeated ScopedBlueprintAssignment assignments = 1;
  // See ListProjectBlueprintsResponse.
  int32 enforcing_count = 2;
  int32 annotating_count = 3;
}

message CheckUpdatesRequest { string project_id = 1; }
message CheckUpdatesResponse {
  bool      update_available = 1;
  string    current_version = 2;
  string    latest_version = 3;
  Blueprint latest_blueprint = 4;
}

message GetAnalyticsRequest { string blueprint_id = 1; }

// ── Purchases ──

// RecordPurchaseRequest is SUPER-ADMIN ONLY and records a purchase settled out of band.
//
// There is no payment provider integration, so there is no shape of this RPC a buyer could
// call safely: accepting a caller-supplied price meant anyone could grant themselves a
// premium blueprint permanently for a claimed payment of zero. Price and currency are read
// from the blueprint, never from the request. When a provider is integrated, its verified
// webhook calls the same service method.
message RecordPurchaseRequest {
  string blueprint_id = 1;
  string user_id = 2;        // the buyer; the caller is the admin recording on their behalf
  string payment_ref = 3;    // the external settlement reference
  // Fields 4 and 5 were `double price_paid` and `string currency`. Both are now derived
  // server-side from the blueprint being purchased.
  reserved 4, 5;
  reserved "price_paid", "currency";
}
message RecordPurchaseResponse {
  bool   success = 1;
  string error = 2;
  string purchase_id = 3;
}

message GetUserPurchasesRequest { string user_id = 1; }
message BlueprintPurchase {
  string id = 1;
  string blueprint_id = 2;
  string user_id = 3;
  // Minor units (cents), integer. Format for display with the currency, never store or
  // transmit money as a float.
  int64  price_paid_minor = 8;
  reserved 4;
  reserved "price_paid";
  string currency = 5;
  string payment_ref = 6;
  google.protobuf.Timestamp purchased_at = 7;
}
message GetUserPurchasesResponse {
  repeated BlueprintPurchase purchases = 1;
}

// ── Compliance Coverage ──

message ComplianceFrameworkInfo {
  string id = 1;
  string name = 2;
  string version = 3;
  string description = 4;
}

message ListComplianceFrameworksRequest {}
message ListComplianceFrameworksResponse {
  repeated ComplianceFrameworkInfo frameworks = 1;
}

message GetComplianceCoverageRequest {
  string org_id = 1;
  string project_id = 2;                             // optional: scope to project's adopted blueprints
  string framework_id = 3;                            // e.g., "soc2", "iso27001"
}

message ComplianceCoverageReport {
  string framework_id = 1;
  string framework_name = 2;
  int32 total_controls = 3;
  int32 covered_controls = 4;
  float coverage_percentage = 5;
  repeated CoveredControlInfo covered = 6;
  repeated UncoveredControlInfo gaps = 7;
  repeated SuggestedBlueprintInfo suggestions = 8;
}

message CoveredControlInfo {
  string control_id = 1;
  string control_name = 2;
  string category = 3;
  string rule_id = 4;
  string blueprint_id = 5;
  string coverage = 6;                                // "full" or "partial"
}

message UncoveredControlInfo {
  string control_id = 1;
  string control_name = 2;
  string description = 3;
  string category = 4;
}

message SuggestedBlueprintInfo {
  string blueprint_id = 1;
  string blueprint_name = 2;
  int32 additional_controls_covered = 3;
}

// ── Auto-Detected (Inferred) Blueprint ──

message GetInferredBlueprintRequest {
  string repo_id = 1;
}

message GetInferredBlueprintResponse {
  Blueprint blueprint = 1;
  optional string pattern_name = 2;
  double confidence = 3;
  repeated string design_signals = 4;
  string boundary_health = 5;
  int32 layer_count = 6;
  repeated CyclicDependency cyclic_groups = 7;
  google.protobuf.Timestamp inferred_at = 8;
  // The review state of THIS detection. UNSPECIFIED when there is no detection or it is adopted.
  InferredReviewState review_state = 9;
  // True when the CALLER is authorized to adopt, keep as draft and dismiss this repository's
  // detection: the server's own decision (the same repository-access rule those RPCs enforce,
  // maintainer on the repository, honouring explicit repository and project member rows), so a client
  // never approximates it from the org role. It is authorization only: a state refusal (an archived
  // project, an already adopted detection, structural blueprints switched off) is still returned by
  // the RPC itself. False when there is no detection, and false (never an error) if the decision
  // could not be made; the mutation RPCs stay authoritative.
  bool viewer_can_maintain = 10;
}

// Where an unadopted detection stands. Neither value enforces anything.
enum InferredReviewState {
  INFERRED_REVIEW_STATE_UNSPECIFIED = 0;
  INFERRED_REVIEW_STATE_PENDING = 1;        // detected, nobody has decided
  INFERRED_REVIEW_STATE_KEPT_AS_DRAFT = 2;  // saved as a draft, not enforced
  INFERRED_REVIEW_STATE_DISMISSED = 3;      // dismissed; never offered again
}

message KeepInferredBlueprintAsDraftRequest {
  string repo_id = 1;
  string blueprint_id = 2;
}

message KeepInferredBlueprintAsDraftResponse {
  InferredReviewState review_state = 1;
  google.protobuf.Timestamp decided_at = 2;
}

message DismissInferredBlueprintRequest {
  string repo_id = 1;
  string blueprint_id = 2;
}

message DismissInferredBlueprintResponse {
  InferredReviewState review_state = 1;
  google.protobuf.Timestamp decided_at = 2;
}

message ListInferredBlueprintsRequest {
  string org_id = 1;
}

message InferredBlueprintSummary {
  string repo_id = 1;
  string repo_name = 2;
  string blueprint_id = 3;
  string blueprint_name = 4;
  InferredReviewState review_state = 5;
  int32 layer_count = 6;
  int32 rule_count = 7;
  double confidence = 8;
  google.protobuf.Timestamp detected_at = 9;
  // True when the CALLER is authorized to adopt, keep as draft and dismiss this repository's
  // detection (authorization only; see GetInferredBlueprintResponse.viewer_can_maintain): the
  // Blueprints page banner reads this.
  bool viewer_can_maintain = 10;
}

message ListInferredBlueprintsResponse {
  repeated InferredBlueprintSummary blueprints = 1;
  // True when more rows exist than were returned (the list is capped); total_count is the number
  // of rows the caller could see before the cap.
  bool truncated = 2;
  int32 total_count = 3;
}

message CyclicDependency {
  repeated string layers = 1;
}

message AdoptInferredBlueprintRequest {
  string repo_id = 1;
  string blueprint_id = 2;
  string name = 3;
  string description = 4;
}

message AdoptInferredBlueprintResponse {
  Blueprint blueprint = 1;
  string assignment_id = 2;
}

message ReinferBlueprintRequest {
  string repo_id = 1;
}

message ReinferBlueprintResponse {
  string job_id = 1;
}

// ── Version Diff ──

message CompareBlueprintVersionsRequest {
  string from_blueprint_id = 1;   // base version (older)
  string to_blueprint_id = 2;     // target version (newer)
}

message CompareBlueprintVersionsResponse {
  string from_version = 1;
  string to_version = 2;
  repeated RuleDiff rule_diffs = 3;
  repeated FieldDiff field_diffs = 4;
}

message RuleDiff {
  string rule_id = 1;
  string change_type = 2;        // "added", "removed", "modified"
  BlueprintRule old_rule = 3;     // nil for added rules
  BlueprintRule new_rule = 4;     // nil for removed rules
}

message FieldDiff {
  string field = 1;
  string old_value = 2;
  string new_value = 3;
}

// ── Impact Analysis ──

message GetBlueprintImpactAnalysisRequest {
  string blueprint_id = 1;             // current adopted version
  string target_version_id = 2;        // version to upgrade to
  string org_id = 3;                   // scope results to this organization
}

message GetBlueprintImpactAnalysisResponse {
  int32 repos_using = 1;               // repos currently adopting this blueprint
  int32 repos_governed = 2;            // total repos in scope for context
  int32 new_violations = 3;            // estimated new violations if upgraded
  int32 prs_affected = 4;              // open PRs that would fail
  float compliance_rate = 5;           // percentage of repos already passing
  repeated AffectedRepo affected_repos = 6;
  repeated RuleDiff new_rules = 7;     // rules added in target version
  repeated RuleDiff removed_rules = 8; // rules removed in target version
  DeprecationInfo deprecation = 9;     // deprecation status of the target version
}

message DeprecationInfo {
  bool is_deprecated = 1;
  string successor_id = 2;
  string successor_name = 3;
  string migration_guide = 4;
}

// Status of a repo relative to a blueprint upgrade.
enum RepoImpactStatus {
  REPO_IMPACT_STATUS_UNSPECIFIED = 0;
  REPO_IMPACT_STATUS_INDEXING = 1;         // active index job, results may be stale
  REPO_IMPACT_STATUS_PENDING = 2;          // never indexed/evaluated with this blueprint
  REPO_IMPACT_STATUS_PASSING = 3;          // all rules pass
  REPO_IMPACT_STATUS_WOULD_FAIL = 4;       // currently passing, new rules would introduce violations
  REPO_IMPACT_STATUS_ALREADY_FAILING = 5;  // already has violations on current version
}

message AffectedRepo {
  string repo_id = 1;
  string repo_name = 2;
  string current_version = 3;
  string target_version = 4;
  int32 current_violations = 5;
  RepoImpactStatus status = 6;
  bool evaluated = 7;                  // false = repo not yet indexed/evaluated with this blueprint
  bool is_indexing = 8;                // true = repo has an active index job (results may be stale)
}

// ── Blueprint Adopters ──

message ListBlueprintAdoptersRequest {
  string blueprint_id = 1;
  string org_id = 2;                   // scope results to this organization
}

message ListBlueprintAdoptersResponse {
  repeated BlueprintAdopter project_adopters = 1;  // project-scope adoptions
  repeated BlueprintAdopter repo_adopters = 2;     // repo-scope adoptions
  int32 total = 3;
}

message BlueprintAdopter {
  string adopter_id = 1;                            // project_id or repo_id
  string adopter_name = 2;                          // project name or repo name
  string scope = 3;                                 // "project" or "repo"
  string blueprint_version = 4;
  int32 violation_count = 5;
  google.protobuf.Timestamp adopted_at = 6;
  bool is_active = 7;                               // latest adoption state; false = deactivated via SetAdoptionStatus
}

// ── Org Adopted Blueprints ──
//
// Aggregated view of all blueprints the org currently has at least one
// adoption for. Powers Configure → Blueprints, where the UI needs one row per
// blueprint with scope + counts + violation totals, not one row per adoption.
// Adopter identities (specific projects/repos) are fetched on demand via
// ListBlueprintAdopters to keep this payload small.

enum AdoptionStatusFilter {
  ADOPTION_STATUS_FILTER_UNSPECIFIED = 0;   // defaults to ACTIVE
  ADOPTION_STATUS_FILTER_ACTIVE = 1;        // at least one is_active=true adoption
  ADOPTION_STATUS_FILTER_INACTIVE = 2;      // only deactivated adoptions
  ADOPTION_STATUS_FILTER_ALL = 3;           // both
}

message ListOrgAdoptedBlueprintsRequest {
  string org_id = 1;
  string search = 2;                        // matches blueprint name/slug (ILIKE)
  repeated BlueprintType types = 3;         // OR filter; empty = all types
  AdoptionStatusFilter status = 4;
  int32 limit = 5;                          // default 50
  int32 offset = 6;
}

message ListOrgAdoptedBlueprintsResponse {
  repeated OrgAdoptedBlueprint items = 1;
  int32 total = 2;                          // for pagination
  OrgAdoptedBlueprintStats stats = 3;       // header card numbers (not paginated)
}

message OrgAdoptedBlueprint {
  Blueprint blueprint = 1;
  BlueprintScope scope = 2;                 // from blueprint_adoptions.scope
  int32 adopter_count = 3;                  // projects if scope=project, repos if scope=repo
  int32 violation_count = 4;                // summed across governed repos
  int32 total_checks = 5;
  google.protobuf.Timestamp first_adopted_at = 6;
  google.protobuf.Timestamp last_adopted_at = 7;
}

message OrgAdoptedBlueprintStats {
  int32 total = 1;          // distinct adopted blueprints (honours filters)
  int32 active = 2;         // with at least one is_active=true adoption
  int32 draft = 3;          // blueprint.status = 'draft'
  int32 enabled = 4;        // blueprint.status = 'published' AND any active adoption
  int32 total_rules = 5;    // sum of rule_count across items
}

// Bulk-toggle is_active on adoption rows of a single blueprint across many
// project or repo adopters in one call. adopter_ids are project_ids when
// scope=PROJECT and repo_ids when scope=REPO — the two lists cannot mix.
// org_id gates the caller (must be an org member) and scopes coverage —
// adopters outside the org are silently skipped in the SQL flip so a
// cross-org id leak can't flip foreign adoption state even if the caller
// passed per-adopter RBAC checks in a weaker deployment.
message SetAdoptionStatusRequest {
  string blueprint_id = 1;
  BlueprintScope scope = 2;            // required; determines which column adopter_ids maps to
  repeated string adopter_ids = 3;     // project_ids or repo_ids; must be non-empty unless assignment_ids is set
  bool is_active = 4;                  // target state
  string org_id = 5;                   // required; org that owns the adopters
  // Target state. UNSPECIFIED keeps the legacy meaning of is_active (true ACTIVE, false REMOVED);
  // otherwise it wins and is_active is ignored. PAUSED retires nothing; REMOVED retires evidence.
  AdoptionLifecycle lifecycle = 6;
  // Address EXACT adoptions (ScopedBlueprintAssignment.assignment_id), at most 50. When non-empty it
  // replaces adopter_ids: only these adoptions change, so one module's adoption can be paused without
  // its siblings. Every id must be an adoption of this blueprint and scope held by org_id, else
  // NOT_FOUND (a foreign id is indistinguishable from an unknown one). With adopter_ids instead, every
  // adoption of the named adopter in the source state changes (all its modules).
  repeated string assignment_ids = 7;
}

message SetAdoptionModeRequest {
  repeated string assignment_ids = 1;  // adoption ids (ScopedBlueprintAssignment.assignment_id); non-empty, at most 50
  AdoptionEnforcementMode mode = 2;    // ENFORCE or ANNOTATE
  string org_id = 3;                   // required; org that owns the adoptions
}

message SetAdoptionModeResponse {
  int32 updated_count = 1;                  // adoptions whose mode actually changed
  repeated string updated_assignment_ids = 2;
  // The repositories the changed adoptions govern right now (none for a paused adoption). When the
  // org's ReevaluatePRsMode is AUTO the server re-gates their open PRs itself, in the background after
  // the change commits; the client must not re-gate again. For OFF and ASK the client decides, as
  // after an adopt or unadopt.
  repeated string affected_repo_ids = 3;
}

message SetAdoptionStatusResponse {
  int32 updated_count = 1;              // adoption rows whose state actually flipped
  repeated string updated_adopter_ids = 2; // project_ids or repo_ids whose adoption flipped
}

// ── Dry Run ──

// Starts a preview. Refusals (a gRPC error with an ERR_ code, nothing queued):
// ERR_BLUEPRINT_PREVIEW_REPO_DISCONNECTED and ERR_BLUEPRINT_PREVIEW_REPO_NOT_INDEXED (a repo named in
// repo_ids), ERR_BLUEPRINT_PREVIEW_NO_REPOSITORY (nothing in scope can be previewed),
// ERR_BLUEPRINT_PREVIEW_UNAVAILABLE (no worker queue on this deployment).
message StartBlueprintPreviewRequest {
  string blueprint_id = 1;              // target blueprint version to evaluate
  string org_id = 2;                    // org scope
  repeated string repo_ids = 3;         // specific repos (empty = all adopting repos, else every org repo)
}

message StartBlueprintPreviewResponse {
  string preview_id = 1;
  BlueprintPreviewStatus status = 2;     // QUEUED, or the status of the preview already running for the same request
}

// A preview of the caller's organization only: another organization's id answers
// ERR_BLUEPRINT_PREVIEW_NOT_FOUND, like an id that expired or never existed.
message GetBlueprintPreviewRequest {
  string preview_id = 1;
  string org_id = 2;
}

message GetBlueprintPreviewResponse {
  string preview_id = 1;
  BlueprintPreviewStatus status = 2;
  // Set only when status is FAILED: why no result exists.
  BlueprintPreviewFailure failure = 3;
  // Set only when status is SUCCEEDED. Every rule that was not checked is listed in it with its closed reason.
  DryRunBlueprintConstraintsResponse result = 4;
  // When the worker finished (SUCCEEDED or FAILED); unset while QUEUED or RUNNING.
  google.protobuf.Timestamp finished_at = 5;
}

enum BlueprintPreviewStatus {
  BLUEPRINT_PREVIEW_STATUS_UNSPECIFIED = 0;
  BLUEPRINT_PREVIEW_STATUS_QUEUED = 1;
  BLUEPRINT_PREVIEW_STATUS_RUNNING = 2;
  BLUEPRINT_PREVIEW_STATUS_SUCCEEDED = 3;
  BLUEPRINT_PREVIEW_STATUS_FAILED = 4;
}

// Why a preview produced no result. UNSPECIFIED is never sent.
enum BlueprintPreviewFailure {
  BLUEPRINT_PREVIEW_FAILURE_UNSPECIFIED = 0;
  // The worker ran the preview and it failed (for every repository, or before any ran).
  BLUEPRINT_PREVIEW_FAILURE_EVALUATION_FAILED = 1;
  // No worker finished it in time (the worker is down or backed up); run it again.
  BLUEPRINT_PREVIEW_FAILURE_TIMED_OUT = 2;
}

// The result of a preview (carried by GetBlueprintPreviewResponse.result).
message DryRunBlueprintConstraintsResponse {
  repeated RepoDryRunResult repo_results = 1;
  int32 total_violations = 2;
  int32 total_affected_files = 3;
  int32 repos_evaluated = 4;
  // Repos that produced no result: evaluation failed, or the request ended before
  // the repo ran (cancelled). Each is also listed in repo_results as skipped with
  // NOT_CHECKABLE_REASON_EVALUATION_FAILED.
  int32 repos_failed = 5;
  // total_violations above is the TRUE count over every evaluated repo; the
  // violations actually carried in repo_results may be capped. returned_violations
  // is how many are carried, truncated is true when returned < total, so a client
  // says "showing N of M" and never presents a capped list as complete.
  int32 returned_violations = 6;
  bool truncated = 7;
  // Rules that did NOT run, summed over the evaluated repos. A rule that did not
  // run contributes no findings and is never a "0 findings" result.
  int32 rules_not_checked = 8;
}

// Why a rule of a dry run could not be checked. UNSPECIFIED is never sent.
enum NotCheckableReason {
  NOT_CHECKABLE_REASON_UNSPECIFIED = 0;
  // A data_tag_* rule whose required tag categories have no tagged symbol in the repo.
  NOT_CHECKABLE_REASON_NO_DATA_TAGS_IN_SCOPE = 1;
  // The repo has no indexed symbols in the graph.
  NOT_CHECKABLE_REASON_REPO_NOT_INDEXED = 2;
  // The repo's languages are not supported by the blueprint (whole repo skipped).
  NOT_CHECKABLE_REASON_UNSUPPORTED_LANGUAGE = 3;
  // The rule has no compiled query to run.
  NOT_CHECKABLE_REASON_RULE_NOT_COMPILED = 4;
  // A file-based rule had no source to read (no checkout or no file runner).
  NOT_CHECKABLE_REASON_SOURCE_UNAVAILABLE = 5;
  // The rule failed while evaluating.
  NOT_CHECKABLE_REASON_EVALUATION_FAILED = 6;
  // The preview evaluates at most 100 repos per request; this repo was past the limit.
  NOT_CHECKABLE_REASON_REPO_LIMIT_EXCEEDED = 7;
  // No language is recorded for the repo yet, so whether the blueprint covers it
  // is not known. Says nothing about the repo's index state.
  NOT_CHECKABLE_REASON_NO_LANGUAGES_DETECTED = 8;
  // The repository is disconnected: Toevan no longer governs it, so a preview does not read it.
  NOT_CHECKABLE_REASON_REPO_DISCONNECTED = 9;
  // The repository has no indexed commit yet (it was never indexed, or its first index has not
  // finished), so there is no commit to preview.
  NOT_CHECKABLE_REASON_NO_INDEXED_COMMIT = 10;
}

// Why a rule that DID run may have judged less than the whole repo. Its findings
// (including 0) are a partial answer, not a clean one.
enum IncompleteReason {
  INCOMPLETE_REASON_UNSPECIFIED = 0;
  // Dependency or module data the rule needs could not be fetched (a vulnerability
  // or license source unreachable, a Terraform module file unavailable).
  INCOMPLETE_REASON_DATA_UNAVAILABLE = 1;
  // Files the rule was to read could not be read (over the size cap, a symbolic
  // link, an IO error).
  INCOMPLETE_REASON_FILES_NOT_READ = 2;
  // Some attributes could not be judged statically (a value set from a variable,
  // a conditional or a function call): no finding, neither compliant nor not.
  INCOMPLETE_REASON_ATTRIBUTES_NOT_JUDGED = 3;
}

// One rule that ran but with a partial answer.
message RuleIncomplete {
  string rule_id = 1;
  string rule_type = 2;
  IncompleteReason reason = 3;
}

// One rule that did not run for a repo.
message RuleNotChecked {
  string rule_id = 1;
  string rule_type = 2;                    // constraint family, e.g. data_tag_query
  NotCheckableReason reason = 3;
  // NO_DATA_TAGS_IN_SCOPE only: the catalog categories the rule needs, e.g.
  // financial.cardholder.pan, and the pattern they were resolved from.
  repeated string required_categories = 4;
  string required_tag_pattern = 5;
  // NO_DATA_TAGS_IN_SCOPE only: the catalog version the names were taken from, and
  // whether it is the version the repo's own data-classification tags record
  // (false = the names are NOT from the repo's indexed catalog: either the index
  // records no data-classification tag, or it records a version this release does
  // not bundle; in both cases they come from the catalog version this release
  // indexes with, the pinned one).
  string catalog_version = 6;
  bool catalog_is_indexed_version = 7;
}

message ExplainDryRunViolationRequest {
  string blueprint_id = 1;
  string org_id = 2;
  string repo_id = 3;
  // The violation as reported by the dry run.
  string rule_id = 4;
  string file_path = 5;
  int32 line = 6;
  string message = 7;
}

message ExplainDryRunViolationResponse {
  // Why the engine flagged this, in terms of the blueprint's rules.
  string explanation = 1;
  // Concrete next step (code change or blueprint adjustment).
  string suggestion = 2;
  // "fix_code" — the code genuinely breaks the intended architecture;
  // "adjust_blueprint" — the rule over-restricts; the blueprint should allow this.
  string suggestion_kind = 3;
}

message ValidateBlueprintSpecRequest {
  // Optional: validate in the context of an existing row (its slug/version/
  // identity fields), with the provided spec/rules spliced over it. Absent →
  // placeholders are synthesized so document-level issues dominate.
  string blueprint_id = 1;
  string name = 2;
  string blueprint_type = 3;   // "structural" | "compliance" | "security" | "design"
  string full_spec_json = 4;
  string rules_json = 5;       // optional: JSON array of rule objects
}

message RepoDryRunResult {
  string repo_id = 1;
  string repo_name = 2;
  int32 violation_count = 3;
  int32 affected_file_count = 4;
  repeated DryRunViolation violations = 5;
  bool skipped = 6;                        // true = repo was not evaluated (language mismatch, etc.)
  string skip_reason = 7;                  // human-readable reason when skipped (e.g. "language not supported")
  NotCheckableReason skip_reason_code = 8; // typed reason when skipped
  // violation_count is the TRUE count; returned_violation_count is how many are in violations.
  int32 returned_violation_count = 9;
  int32 rules_ran = 10;                    // rules that executed (ran, possibly with 0 findings)
  repeated RuleNotChecked not_checked = 11; // rules that did not run: not "0 findings"
  repeated RuleIncomplete incomplete = 12;  // rules that ran with a partial answer
  // The commit the repository was last indexed at: the commit the preview judged. Empty when skipped.
  string indexed_commit = 13;
}

message DryRunViolation {
  string rule_id = 1;
  string rule_name = 2;
  string severity = 3;
  string file_path = 4;
  int32 line = 5;
  string message = 6;
}

// ── Blueprint requirement coverage ──

message GetBlueprintRequirementCoverageRequest {
  string blueprint_id = 1;
  // The org whose PR-gate policy states when a rule blocks. The caller must be a member.
  string org_id = 2;
  // Optional: a repo of org_id, for its Deep Check state. Without it Deep Check is treated as not
  // running, so a rule only Deep Check could block reads after_merge EVALUATED.
  string repo_id = 3;
}

message GetBlueprintRequirementCoverageResponse {
  // The coverage of the FIRST framework edition the blueprint declares; unset when it declares none.
  // Kept for one release for clients that read a single framework: read `coverages`, which holds every
  // declared edition including this one.
  FrameworkRequirementCoverage coverage = 1;
  // The coverage of EVERY framework edition the blueprint declares, in declaration order (a pack for one
  // framework has one entry; Security Essentials has seven). Empty when it declares none. Each entry
  // counts only the controls of its own framework.
  repeated FrameworkRequirementCoverage coverages = 2;
}

// RequirementNotCheckableReason is why a requirement cannot be evidenced from code.
enum RequirementNotCheckableReason {
  REQUIREMENT_NOT_CHECKABLE_REASON_UNSPECIFIED = 0;
  REQUIREMENT_NOT_CHECKABLE_REASON_ORGANISATIONAL_POLICY = 1;
  REQUIREMENT_NOT_CHECKABLE_REASON_PERSONNEL = 2;
  REQUIREMENT_NOT_CHECKABLE_REASON_PHYSICAL_SECURITY = 3;
  REQUIREMENT_NOT_CHECKABLE_REASON_CONTRACTUAL = 4;
  REQUIREMENT_NOT_CHECKABLE_REASON_REGULATORY_PROCEDURE = 5;
  REQUIREMENT_NOT_CHECKABLE_REASON_OPERATIONAL_PROCESS = 6;
  REQUIREMENT_NOT_CHECKABLE_REASON_EXTERNAL_ASSESSMENT = 7;
}

// ControlCoverageLevel is how a rule relates to a requirement it cites. FULL and PARTIAL are what the
// rule states about a requirement that is checkable in code and make it "covered". SUPPORTING is
// derived: the rule cites a requirement that cannot be checked in code (a process, a regulatory
// duty, a contract); it is related evidence and never makes the requirement covered.
enum ControlCoverageLevel {
  CONTROL_COVERAGE_LEVEL_UNSPECIFIED = 0;
  CONTROL_COVERAGE_LEVEL_FULL = 1;
  CONTROL_COVERAGE_LEVEL_PARTIAL = 2;
  CONTROL_COVERAGE_LEVEL_SUPPORTING = 3;
}

// RuleBeforeMerge is what the PR gate does with a rule before merge (the same vocabulary as
// GateBeforeMerge in prgate.proto, which this file cannot import: prgate.proto imports repo.proto,
// which imports this file). A rule has no MIXED state.
enum RuleBeforeMerge {
  RULE_BEFORE_MERGE_UNSPECIFIED = 0;
  RULE_BEFORE_MERGE_BLOCKS = 1;          // an introduced violation fails the gate
  RULE_BEFORE_MERGE_WARNS = 2;           // surfaced, never fails the gate
  RULE_BEFORE_MERGE_OFF = 3;             // the org muted the rule's family
  RULE_BEFORE_MERGE_DEEP_CHECK_ONLY = 4; // the fast gate cannot block it; only Deep Check can
  RULE_BEFORE_MERGE_NOT_EVALUATED = 5;   // the engine cannot evaluate the rule
}

// RuleAfterMerge is what the default branch does with a rule after merge (GateAfterMerge's
// vocabulary, per rule).
enum RuleAfterMerge {
  RULE_AFTER_MERGE_UNSPECIFIED = 0;
  RULE_AFTER_MERGE_RE_EVALUATED = 1; // judged before merge, evaluated again on main
  RULE_AFTER_MERGE_EVALUATED = 2;    // first evaluated on main
  RULE_AFTER_MERGE_NOT_EVALUATED = 3; // the engine cannot evaluate the rule
}

// UnresolvedControlReason is why a rule's controls[] entry did not count toward a requirement.
enum UnresolvedControlReason {
  UNRESOLVED_CONTROL_REASON_UNSPECIFIED = 0;
  UNRESOLVED_CONTROL_REASON_OTHER_FRAMEWORK = 1;      // names a framework the blueprint does not declare
  UNRESOLVED_CONTROL_REASON_UNKNOWN_CONTROL = 2;      // not in the declared edition
  UNRESOLVED_CONTROL_REASON_NOT_CHECKABLE_REQUIREMENT = 3; // no longer produced: such a citation is a SUPPORTING rule link
  UNRESOLVED_CONTROL_REASON_BAD_COVERAGE = 4;         // the authored coverage word is not full or partial
}

message FrameworkRequirementCoverage {
  string framework_id = 1;
  string framework_name = 2;
  string edition = 3;
  // The source the requirement list is taken from.
  string source_name = 4;
  string source_edition = 5;
  string source_url = 6;
  // What a "requirement" is in this edition (for example "sub_requirement", "control", "article").
  string requirement_level = 7;
  int32 total_requirements = 8;
  // Requirements the catalog says can be evidenced in code.
  int32 checkable_in_code = 9;
  // Checkable requirements at least one rule the engine can evaluate cites: covered_fully plus
  // covered_partly. Read the two, not this alone: "N checkable in code: X fully, Y partly covered".
  int32 covered = 10;
  repeated FrameworkRequirement requirements = 11;
  repeated NotCheckableRequirement not_checkable = 12;
  repeated UnresolvedRuleControl unresolved_controls = 13;
  // Of covered: requirements an evaluable rule cites with FULL coverage on the requirement itself.
  int32 covered_fully = 14;
  // Of covered: requirements every covering rule cites PARTIAL (or FULL only on a part of it).
  int32 covered_partly = 15;
}

message FrameworkRequirement {
  string id = 1;
  string label = 2;
  string category = 3;
  bool checkable_in_code = 4;
  RequirementNotCheckableReason not_checkable_reason = 5; // set only when checkable_in_code is false
  bool covered = 6;
  repeated RequirementRuleLink rules = 7;   // evaluable rules citing the requirement (all SUPPORTING when it is not checkable in code)
  repeated string inert_rule_ids = 8;       // rules citing it that the engine cannot evaluate
  // The requirement's coverage, STATED by the server from the same computation that fills `covered`
  // after the cap on a part of a requirement and the runtime reviewed-FULL cap. Clients show this and
  // never derive it from `rules`: an authored FULL that no review allows reads PARTLY_COVERED here
  // although its link says full.
  RequirementCoverageLevel level = 9;
}

// RequirementCoverageLevel is one requirement's level in the read. FULLY_COVERED and PARTLY_COVERED
// split `covered`; NOT_COVERED is a checkable requirement no evaluable rule cites; NOT_CHECKABLE cannot
// be checked in code (its rules, if any, are SUPPORTING links). An older client sees UNSPECIFIED for a
// value it does not know and must show "unknown", never covered.
enum RequirementCoverageLevel {
  REQUIREMENT_COVERAGE_LEVEL_UNSPECIFIED = 0;
  REQUIREMENT_COVERAGE_LEVEL_FULLY_COVERED = 1;
  REQUIREMENT_COVERAGE_LEVEL_PARTLY_COVERED = 2;
  REQUIREMENT_COVERAGE_LEVEL_NOT_COVERED = 3;
  REQUIREMENT_COVERAGE_LEVEL_NOT_CHECKABLE = 4;
}

message NotCheckableRequirement {
  string id = 1;
  string label = 2;
  RequirementNotCheckableReason reason = 3;
}

message RequirementRuleLink {
  string rule_id = 1;
  string rule_name = 2;
  string family = 3;                         // the constraint type
  ControlCoverageLevel coverage = 4;
  RuleBeforeMerge before_merge = 5;
  RuleAfterMerge after_merge = 6;
}

message UnresolvedRuleControl {
  string rule_id = 1;
  string framework_id = 2;
  string control_id = 3;
  UnresolvedControlReason reason = 4;
}
