  string format = 2;
}

// ── Control Mapping Report ──

message GenerateControlMappingRequest {
  string org_id = 1;
  string framework = 2;                 // optional — all frameworks if empty
  // Ignored. The server builds the active set from the org's adopted, compiled, evaluable rules and
  // matches shipped rules by blueprint id and rule id; a caller's list of constraint types credited every
  // shipped rule of a listed type whether or not the org runs it. Kept on the wire for old clients.
  repeated string active_constraints = 3 [deprecated = true];
}

message GenerateControlMappingResponse {
  string json_content = 1;              // JSON report (single or array of reports)
  string framework = 2;                 // framework name (empty if all)
}

// ── GDPR Right to Erasure (Art. 17) ──

message EraseDataSubjectRequest {
  string org_id = 1;
  // The data subject's GitHub login as recorded in `author` across the evidence
  // and PR-gate stores. There is no mapping from this login to a Toevan user
  // account — it is the only identifier held for the developer.
  string github_login = 2;
  // The person's numeric GitHub user id, when the operator knows it (0 = not given). A login GitHub
  // recycled maps to more than one person; the erasure refuses it (ERR_EVIDENCE_ERASURE_AMBIGUOUS_LOGIN)
  // until this id says which one. With an id, objects that carry the login AND an id match by that id, so a
  // login on another id is left alone and a rename is followed. Mentions that carry the login with no id
  // (a login with no id, a linked commit author's username, the pusher, a pre-2017 noreply address) go to
  // this id, except in a delivery that pairs the login with a different id: that was another holder.
  // Required (ERR_EVIDENCE_ERASURE_GITHUB_ID_REQUIRED) when the only source of the person's id is a sign-in
  // row: its username is written once, at sign-up, and may name someone who renamed.
  // Without it, the erasure goes on only when GitHub confirms (GET /users/{login}) that the login's current
  // holder is the id the organisation's data names; otherwise nothing is erased and the answer asks for this id.
  // INVALID_ARGUMENT with ERR_EVIDENCE_ERASURE_GITHUB_ID_REQUIRED in two cases: the organisation's data names no
  // id for the login, or GitHub cannot be asked at all (the organisation has no GitHub installation to ask with,
  // or the server has no GitHub client). INVALID_ARGUMENT with ERR_EVIDENCE_ERASURE_LOGIN_HOLDER_MISMATCH: GitHub's
  // holder is another account, or none. A lookup GitHub could not answer now is UNAVAILABLE with
  // ERR_EVIDENCE_ERASURE_LOGIN_LOOKUP_UNAVAILABLE: try again later, or give this id.
  int64 github_user_id = 3;
  // Emails of the person that Toevan does not know (an unlinked commit email, a Co-authored-by address),
  // given by the operator. Matched case-insensitively against the evidence inbox payloads, in commit author
  // and committer objects and in Co-authored-by trailers. At most 20, each a plain address. They are never
  // stored: the erasure audit row keeps only how many were given.
  repeated string additional_emails = 4;
}

message EraseDataSubjectResponse {
  string github_login = 1;
  int64 evidence_records_redacted = 2;  // evidence_records rows whose author was nulled
  int64 pr_checks_redacted = 3;         // pr_checks rows whose author was tombstoned
  int64 export_jobs_redacted = 4;       // evidence_export_jobs rows whose author filter was nulled
  int64 ledger_runs_redacted = 5;       // 0 today — the immutable ledger holds no PII
  int64 inbox_payloads_erased = 6;      // evidence inbox rows whose received bytes named the person and were dropped
  // Rows that name the login with NO numeric GitHub id and were KEPT, because another person held the same login
  // (GitHub recycles logins) and such a row cannot be told from that person's: evidence records, PR checks and
  // export jobs of the login, policy approvals and author rows of the login with no id, and inbox payloads whose
  // only mention of the person has no id (a login alone, a pusher, a pre-2017 noreply address). Server-filled;
  // 0 when nothing was kept. One holder of the login usually keeps nothing, but a former login of the person that
  // another person also held, and an ambiguous <digits> noreply address that may be another person's, are counted
  // even when the requested login had one holder. The operator can erase these by hand only after deciding whose
  // they are.
  int64 login_only_rows_kept = 7;
}

// ── Evidence retention ──

enum EvidenceRetentionMode {
  EVIDENCE_RETENTION_MODE_UNSPECIFIED = 0;
  // SUPERSEDED by the owner decision of 2026-10-19 (the landing model): the server
  // no longer returns this value and no client may claim evidence is kept
  // "indefinitely". Kept so the number is never reused.
  EVIDENCE_RETENTION_MODE_INDEFINITE = 1;
  reserved 2;
  reserved "EVIDENCE_RETENTION_MODE_LIMITED";
  // The org's evidence is kept AT LEAST retention_years (a floor). Nothing is
  // deleted at the end of the period yet (purge_enforced = false). The only mode
  // the server returns.
  EVIDENCE_RETENTION_MODE_MINIMUM_PERIOD = 3;
}

// The two cases in which the CONTENT of evidence changes although the policy is
// a minimum period (no purge yet). Hashes are kept in both. What each does and does not reach is in
// GetEvidenceRetentionResponse.statement.
enum EvidenceRetentionException {
  EVIDENCE_RETENTION_EXCEPTION_UNSPECIFIED = 0;
  // Personal-data erasure on request: the content of the affected runs is
  // emptied and the author is cleared on their records, in the database copy
  // only. A published transparency-log entry, the customer's git twin and any
  // export already taken are not reached. Each erased run is recorded.
  EVIDENCE_RETENTION_EXCEPTION_PERSONAL_DATA_ERASURE = 1;
  // Organisation deletion: on evidence records the author is blanked and the
  // repository and exception links are cleared. Runs, attestations and
  // canonical records are kept as they are.
  EVIDENCE_RETENTION_EXCEPTION_ORGANISATION_DELETION = 2;
}

message GetEvidenceRetentionRequest { string org_id = 1; }

// Where this deployment publishes attestations now. NONE is the default: publication is
// an operator choice (evidence.rekor_url), and nothing is published while it is empty.
enum EvidenceTransparencyLog {
  EVIDENCE_TRANSPARENCY_LOG_UNSPECIFIED = 0;
  EVIDENCE_TRANSPARENCY_LOG_NONE = 1;
  // The public Sigstore Rekor log: an entry there is permanent and public.
  EVIDENCE_TRANSPARENCY_LOG_PUBLIC = 2;
  // Any other log (self-hosted): whether an entry can be removed is that log's policy.
  EVIDENCE_TRANSPARENCY_LOG_SELF_HOSTED = 3;
}

message GetEvidenceRetentionResponse {
  EvidenceRetentionMode mode = 1;
  reserved 2;
  reserved "days";
  repeated EvidenceRetentionException exceptions = 3;
  // The policy in one English statement, for clients without their own copy. It is
  // built per request from the facts below and states only what is true of THIS
  // deployment and org: evidence is kept at least retention_years (purge_enforced says whether deletion happens); what erasure and
  // organisation deletion change; the transparency log claim ONLY for the state in
  // transparency_log / log_entries_published; the git twin only if enabled; and what
  // the audit-log sweep actually is here.
  string statement = 4;
  // The facts the statement is built from, so a client can render its own copy.
  EvidenceTransparencyLog transparency_log = 5;
  // This deployment signs attestations, or the org already holds some.
  bool attestations_signed = 6;
  // The org already has entries in a transparency log (published earlier, whatever the
  // log setting is now).
  bool log_entries_published = 7;
  // The git twin (toevan/evidence) is exported to the customer's repository. Toevan only
  // appends to it and never deletes or rewrites it.
  bool git_twin_enabled = 8;
  // Audit logs older than this many days are deleted by the optional sweep; 0 = no sweep
  // (the default). Audit logs are not evidence. A sweep that is on never reads 0: the age is
  // rounded up to whole days, with a minimum of 1.
  int32 audit_log_sweep_days = 9;
  // Private beta is on (or could not be read, which fails toward on): nothing is published to
  // a transparency log whatever the log setting is, and transparency_log is NONE.
  bool beta_suppresses_publication = 10;
  // OWNER DECISION 2026-10-19 (landing model), added in place with no version bump.
  // The org's configured evidence retention period in whole years: a FLOOR, not a
  // ceiling. Default 3 for an org that never set one; always one of allowed_years.
  // The client shows this value instead of any hard-coded period.
  int32 retention_years = 11;
  // The periods an admin may choose, ascending: 3, 5, 7, 10 (years). Never below 3.
  // Render these as the choices; do not hard-code them.
  repeated int32 allowed_years = 12;
  // True only when the CALLER is an Enterprise org admin, so SetEvidenceRetention
  // would be accepted now. Server-computed from role and plan entitlement; false
  // for members, support-access staff and non-Enterprise orgs. The client shows
  // the change control only when true and never decides this itself.
  bool can_change = 13;
  // Whether the server deletes evidence automatically when the period ends. FALSE
  // today (that job is not built); clients show the note "Evidence is kept at least
  // this long; automatic deletion at the end of the period is not yet enforced".
  // Turns true only when a purge that keeps the hash chain verifiable ships.
  bool purge_enforced = 14;
}

message SetEvidenceRetentionRequest {
  string org_id = 1;
  // The new period in years; must be one of allowed_years (3, 5, 7 or 10).
  int32 retention_years = 2;
}

message SetEvidenceRetentionResponse {
  // The policy as GetEvidenceRetention reads it after the change.
  GetEvidenceRetentionResponse retention = 1;
}

// ── Change evidence report (v1: code evidence) ──

enum ChangeEvidenceReportStatus {
  CHANGE_EVIDENCE_REPORT_STATUS_UNSPECIFIED = 0;
  CHANGE_EVIDENCE_REPORT_STATUS_PENDING = 1;
  CHANGE_EVIDENCE_REPORT_STATUS_RUNNING = 2;
  CHANGE_EVIDENCE_REPORT_STATUS_COMPLETED = 3;
  CHANGE_EVIDENCE_REPORT_STATUS_FAILED = 4;
}

enum ChangeEvidenceArtifactKind {
  CHANGE_EVIDENCE_ARTIFACT_KIND_UNSPECIFIED = 0;
  CHANGE_EVIDENCE_ARTIFACT_KIND_PDF = 1;
  // One row per sealed code-verdict record in scope and period.
  CHANGE_EVIDENCE_ARTIFACT_KIND_RECORDS_CSV = 2;
  // The canonical manifest the PDF and the viewer both render. Its SHA-256 is the report's
  // content digest printed on the cover.
  CHANGE_EVIDENCE_ARTIFACT_KIND_MANIFEST = 3;
  // One row per commit that reached a default branch in the period, with the sealed record it matched
  // (or the reason it matched none). Its SHA-256 is bound into the manifest's content digest.
  CHANGE_EVIDENCE_ARTIFACT_KIND_POPULATION_CSV = 4;
  // The page document (schema 3): the sections and blocks the viewer and the PDF both draw. Built
  // from the manifest's facts and stored beside it with its own SHA-256; never part of the content
  // digest.
  CHANGE_EVIDENCE_ARTIFACT_KIND_DOCUMENT = 5;
}

// Why a report is FAILED. A closed set so a client never shows a raw error.
enum ChangeEvidenceFailureReason {
  CHANGE_EVIDENCE_FAILURE_REASON_UNSPECIFIED = 0;
  CHANGE_EVIDENCE_FAILURE_REASON_BUILD = 1;     // the manifest could not be built
  CHANGE_EVIDENCE_FAILURE_REASON_RENDER = 2;    // the PDF or CSV could not be rendered
  CHANGE_EVIDENCE_FAILURE_REASON_STORE = 3;     // the artifacts could not be stored
  CHANGE_EVIDENCE_FAILURE_REASON_ABANDONED = 4; // the worker stopped and the row was never retried
}

message GenerateChangeEvidenceReportRequest {
  string org_id = 1;
  // The chosen repositories (1 to 50), all in org_id. Exactly one of repo_ids / project_id.
  repeated string repo_ids = 2;
  // A preset: every repository of this project in org_id.
  string project_id = 3;
  // The period, inclusive start and exclusive end, at most 12 months. Required.
  google.protobuf.Timestamp period_from = 4;
  google.protobuf.Timestamp period_to = 5;
  // Free text printed on the cover ("Prepared for"), at most 200 characters. Optional.
  string prepared_for = 6;
  // The contact for questions is no longer typed per report: every report prints the org's VERIFIED audit
  // contact (OrgService.SetOrgAuditContact), or states that none is set. A value an older client sends in
  // field 7 is ignored.
  reserved 7;
  reserved "contact";
}
message GenerateChangeEvidenceReportResponse {
  ChangeEvidenceReportRow report = 1;
}

message ListChangeEvidenceReportsRequest {
  string org_id = 1;
  int32 limit = 2;                       // default 50, max 200
}
message ListChangeEvidenceReportsResponse {
  repeated ChangeEvidenceReportRow reports = 1;
}

message GetChangeEvidenceReportRequest {
  string org_id = 1;
  string report_id = 2;
}
message GetChangeEvidenceReportResponse {
  ChangeEvidenceReportRow report = 1;
  // The canonical manifest JSON of a COMPLETED report, byte for byte what was digested. Empty
  // until completed. The client renders the viewer from it.
  bytes manifest_json = 2;
  // The page document JSON of a COMPLETED schema 3 report, byte for byte the stored document and
  // checked against its recorded SHA-256. The client draws the viewer from it. Empty until
  // completed, and for a report built before schema 3 (its manifest carries its own pages).
  bytes document_json = 3;
}

message BackfillProcessEvidenceRequest {
  string org_id = 1;
  string repo_id = 2;
  // The period, inclusive start and exclusive end, at most 366 days, not in the future. Required.
  google.protobuf.Timestamp period_from = 3;
  google.protobuf.Timestamp period_to = 4;
  // Empty starts; otherwise the next_cursor of the previous step.
  string cursor = 5;
  // How many changes (or commits) this step may take: default 10, at most 25.
  int32 max_changes = 6;
}
message BackfillCounts {
  // Records this step wrote.
  int32 sealed = 1;
  // Already had a record (live capture or an earlier backfill); left as it is.
  int32 already_sealed = 2;
  // GitHub did not give the item (deleted, or it changed under the read); nothing was sealed for it.
  int32 unreadable = 3;
}
message BackfillProcessEvidenceResponse {
  // The merged changes met in this step.
  BackfillCounts changes = 1;
  // The commits of the history walk met in this step (sealed: unreviewed changes written).
  BackfillCounts history = 2;
  // Commits of the walk that a merged pull request explains, so none was written for them.
  int32 linked_commits = 3;
  // Continue with this; empty when done.
  string next_cursor = 4;
  bool done = 5;
  // Set when the step stopped to wait for GitHub: call again with next_cursor after this time. deferred_reason
  // says why.
  google.protobuf.Timestamp deferred_until = 6;
  // The installation may not list what the step needed: a gap was sealed and the phase is over.
  bool permission_missing = 7;
  // GitHub requests this step made.
  int32 github_requests = 8;
  // Commits of the history walk that a sealed push record already lists: push capture sealed them, so the walk wrote
  // nothing for them. (The walk also never enters the period in which push capture was live.)
  int32 already_captured_commits = 9;
  // Why deferred_until is set; UNSPECIFIED when it is not.
  BackfillDeferReason deferred_reason = 10;
}

// Why a backfill step stopped to wait for GitHub.
enum BackfillDeferReason {
  BACKFILL_DEFER_REASON_UNSPECIFIED = 0;
  // GitHub's rate limit: a 429, or a 403 whose Retry-After or x-ratelimit-remaining: 0 headers say so.
  BACKFILL_DEFER_REASON_RATE_LIMITED = 1;
  // A 403 that no documented header explains (no rate-limit header, no X-Accepted-GitHub-Permissions the
  // installation lacks): GitHub's guidance is to wait at least a minute and back off exponentially. Repeated
  // past the backfill's bound, the step is refused with ERR_EVIDENCE_BACKFILL_GITHUB_REFUSED instead.
  BACKFILL_DEFER_REASON_GITHUB_FORBIDDEN = 2;
}

message DownloadChangeEvidenceReportRequest {
  string org_id = 1;
  string report_id = 2;
  ChangeEvidenceArtifactKind kind = 3;
}
message DownloadChangeEvidenceReportResponse {
  string download_url = 1;               // freshly presigned (60 minutes)
  string filename = 2;
  string sha256 = 3;                     // the file's SHA-256, "sha256:<hex>"
  int64 size_bytes = 4;
}

message GetChangeEvidenceReportPdfRequest {
  string org_id = 1;
  string report_id = 2;
}
message GetChangeEvidenceReportPdfResponse {
  // The PDF, byte for byte the stored file, already checked against sha256.
  bytes pdf = 1;
  // The PDF's SHA-256, "sha256:<hex>", the digest the report recorded for its PDF (the same as Download's sha256).
  string sha256 = 2;
}

message ChangeEvidenceArtifact {
  ChangeEvidenceArtifactKind kind = 1;
  string filename = 2;
  string sha256 = 3;                     // "sha256:<hex>"
  int64 size_bytes = 4;
}

message ChangeEvidenceReportRow {
  string id = 1;
  ChangeEvidenceReportStatus status = 2;
  ChangeEvidenceFailureReason failure_reason = 3;  // set only when FAILED
  repeated string repo_ids = 4;
  repeated string repo_names = 5;
  google.protobuf.Timestamp period_from = 6;
  google.protobuf.Timestamp period_to = 7;
  string prepared_for = 8;
  // Who generated the report: the user's full name as GitHub states it, or their GitHub login when GitHub states
  // none (see generated_by_basis). Never an email address on a report made after generated_by_basis existed; a
  // report made before it may hold the email the caller was signed in with.
  string generated_by = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp completed_at = 11;
  // The report id's content digest, "sha256:<hex>" of the canonical manifest. Empty until completed.
  string manifest_digest = 12;
  int32 record_count = 13;               // sealed code-verdict records in scope and period
  string engine_version = 14;            // the generating server's engine commit
  repeated ChangeEvidenceArtifact artifacts = 15;  // empty until completed
  // Pages in the PDF; 0 until completed, and for reports made before the page map existed.
  int32 pdf_page_count = 16;
  // Where each section starts in the PDF, in print order. Empty until completed, and for older reports.
  repeated ChangeEvidenceReportSection sections = 17;
  // What generated_by is, so a viewer can say "no name is set on GitHub" instead of presenting a login as a name.
  ChangeEvidenceGeneratedByBasis generated_by_basis = 18;
}

// What a report's generated_by names.
enum ChangeEvidenceGeneratedByBasis {
  // A report made before the basis was recorded: generated_by is whatever was snapshotted then (possibly an email).
  CHANGE_EVIDENCE_GENERATED_BY_BASIS_UNSPECIFIED = 0;
  // The full name GitHub states for the user.
  CHANGE_EVIDENCE_GENERATED_BY_BASIS_GITHUB_NAME = 1;
  // GitHub states no name for the user, so generated_by is their GitHub login.
  CHANGE_EVIDENCE_GENERATED_BY_BASIS_GITHUB_LOGIN = 2;
  // The user did not sign in with GitHub; generated_by is the name their sign-in provider states.
  CHANGE_EVIDENCE_GENERATED_BY_BASIS_ACCOUNT_NAME = 3;
  // No name is held for the caller (for example an API key whose creator is gone); generated_by is "unknown".
  CHANGE_EVIDENCE_GENERATED_BY_BASIS_NOT_STATED = 4;
}

// One section of the report and the pages it occupies in the PDF (the viewer's thumbnail rail and its
// "page N" links read this).
message ChangeEvidenceReportSection {
  string key = 1;          // stable key: "cover", "summary", "scope", ...
  string number = 2;       // "1", "2", ... ; empty for the cover and the appendix
  string title = 3;
  int32 first_page = 4;    // 1-based
  int32 page_count = 5;
}
