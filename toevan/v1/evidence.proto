syntax = "proto3";

package toevan.v1;

option go_package = "github.com/toevan/api-server/gen/toevan/v1;toevanv1";

import "google/protobuf/timestamp.proto";

// ============================================
// EvidenceService — Compliance Audit Trail
// ============================================

service EvidenceService {
  rpc ListEvidence(ListEvidenceRequest) returns (ListEvidenceResponse);
  rpc GetEvidenceRecord(GetEvidenceRecordRequest) returns (GetEvidenceRecordResponse);
  rpc ExportEvidence(ExportEvidenceRequest) returns (ExportEvidenceResponse);
  rpc GetEvidenceExportJob(GetEvidenceExportJobRequest) returns (GetEvidenceExportJobResponse);
  rpc GetEvidenceSummary(GetEvidenceSummaryRequest) returns (GetEvidenceSummaryResponse);
  // Distinct authors appearing in the org's evidence records — powers the
  // audit-trail author filter dropdown.
  rpc ListEvidenceAuthors(ListEvidenceAuthorsRequest) returns (ListEvidenceAuthorsResponse);
  rpc GenerateSBOM(GenerateSBOMRequest) returns (GenerateSBOMResponse);

  // Compliance report history: a generated report is an evidence export
  // (same filters, same store) plus a durable metadata row. Download URLs
  // are RE-SIGNED on every list — presigned links expire, the artifact
  // and its filename do not.
  rpc GenerateComplianceReport(GenerateComplianceReportRequest) returns (GenerateComplianceReportResponse);
  rpc ListComplianceReports(ListComplianceReportsRequest) returns (ListComplianceReportsResponse);

  // Compliance reports
  rpc GenerateDPIA(GenerateDPIARequest) returns (GenerateDPIAResponse);
  rpc GenerateControlMapping(GenerateControlMappingRequest) returns (GenerateControlMappingResponse);

  // GDPR Art. 17 right-to-erasure. Org-admin only. Redacts a data subject's
  // personal data (their recorded GitHub login) across the evidence + PR-gate
  // stores and writes an audit-log record. The immutable evidence ledger holds
  // no personal data and is not affected.
  rpc EraseDataSubject(EraseDataSubjectRequest) returns (EraseDataSubjectResponse);

  // Signed supply-chain attestations for one evaluated commit — the
  // distribution read behind "verify without Toevan". Envelopes are
  // returned VERBATIM (in-toto SLSA-VSA statement in a DSSE envelope);
  // verification runs against exactly these bytes with stock cosign and the
  // published public key. Authorization derives the owning org from the REPO
  // row (viewer floor), never from the request.
  rpc ListVerdictAttestations(ListVerdictAttestationsRequest) returns (ListVerdictAttestationsResponse);

  // Re-verify the org's whole evidence ledger from the stored records: the
  // hash chain of every repository, the attestation signatures under the
  // published key(s), and the Rekor inclusion proofs when the org's log
  // anchoring applies. Same permission as ListEvidence (org member, or platform
  // staff with a support-access grant), scoped by org_id. Bounded work: one run
  // per org at a time (a second caller joins it), a per-org minimum interval (a
  // repeat inside it returns the stored result with its time,
  // served_from_stored = true), a server deadline, and the caller's
  // cancellation stops the run. The result is persisted and also returned by
  // GetEvidenceSummary as last_verification.
  rpc VerifyEvidenceChain(VerifyEvidenceChainRequest) returns (VerifyEvidenceChainResponse);

  // The org's transparency-log setting: the public log (the default) or a
  // self-hosted log the org operates. Read: any org member (the setting is
  // not a secret; the log's PUBLIC key is shown). Write: org admin only, a
  // support-access grant never writes, Enterprise (the self_hosted feature)
  // for a self-hosted log, audited in the same transaction. Switching back
  // to the public log is always allowed.
  rpc GetOrgEvidenceLog(GetOrgEvidenceLogRequest) returns (GetOrgEvidenceLogResponse);
  rpc SetOrgEvidenceLog(SetOrgEvidenceLogRequest) returns (SetOrgEvidenceLogResponse);
  // Org admin only (a support grant never writes), audited, with a written reason: clear the records and
  // chain heads a transparency log refused for good, so the next sweep offers them to their log again. A
  // refusal is therefore never permanent. Their history (who, why, when) is kept.
  rpc RequeueOrgEvidenceRejections(RequeueOrgEvidenceRejectionsRequest) returns (RequeueOrgEvidenceRejectionsResponse);
}

// ── Transparency log setting ──

enum EvidenceLogKind {
  EVIDENCE_LOG_KIND_UNSPECIFIED = 0;
  // The platform's transparency log (Sigstore Rekor by default). No url or key.
  EVIDENCE_LOG_KIND_PUBLIC = 1;
  // A Rekor the organization operates. Anchoring there is third-party only in
  // the sense that the log is not Toevan's: its operator can rewrite it, so
  // render it as "anchored in a log operated by the organization".
  EVIDENCE_LOG_KIND_SELF_HOSTED = 2;
}

// What the anchoring sweeps are doing for ONE log an org's records are pinned to.
message EvidenceLogHealth {
  // Signed attestations pinned to this log that are not anchored yet and not refused.
  int64 pending = 1;
  google.protobuf.Timestamp oldest_pending_at = 2;  // unset when none pending
  google.protobuf.Timestamp last_attempt_at = 3;    // unset when never attempted
  google.protobuf.Timestamp last_success_at = 4;    // unset when never succeeded
  // "" when the last attempt succeeded. Otherwise one of: unreachable, slow, rejected_<status> (a
  // refusal, e.g. rejected_422), rejected_all, circuit_open, invalid_proof, no_proof, log_id_mismatch,
  // lookup_failed, egress_blocked, stamp_failed (our database refused the stamp), queue_failed (our
  // database could not read the work queue), pin_mismatch, key_not_held, config_missing. Never carries the
  // host or the response body.
  string last_error_kind = 5;
  int32 consecutive_failures = 6;
  // The log this entry is about: "" = the public log, otherwise the self-hosted log's id. Records stay
  // pinned to the log they were signed for, so an earlier log keeps its own entry and keeps draining.
  string log_id = 7;
  // Records this log refused for good (terminal until an org admin re-queues them). Not pending. Render
  // as "not anchored: rejected by the log".
  int64 rejected = 8;
  google.protobuf.Timestamp last_rejected_at = 9;  // unset when none
  // The org's repositories whose CURRENT chain head this log refused for good. A newer head supersedes
  // it and anchors normally. Render as "chain head not anchored: rejected by the log".
  int64 rejected_chain_heads = 10;
  string url = 11;         // the log's newest recorded locator; empty for the public log
  bool is_current = 12;    // the org's current setting names this log
}

message OrgEvidenceLog {
  EvidenceLogKind kind = 1;
  string url = 2;             // empty for the public log
  string log_id = 3;          // hex sha256 of the log key's SPKI; empty for the public log
  string public_key_pem = 4;  // the log's PUBLIC key; empty for the public log
  int32 version = 5;          // 0 = never configured (the public log by default)
  google.protobuf.Timestamp set_at = 6;
  string set_by_user_id = 7;
}

message GetOrgEvidenceLogRequest {
  string org_id = 1;
}

message GetOrgEvidenceLogResponse {
  OrgEvidenceLog log = 1;
  EvidenceLogHealth health = 2;
  // Whether the org's plan allows a self-hosted log (Enterprise; the beta
  // unlock applies through the same entitlement gate).
  bool self_hosted_allowed = 3;
  // EVERY log the org's records are pinned to (the current one, earlier ones, the public one), each with
  // its own health. `health` above is the current log's.
  repeated EvidenceLogHealth logs = 4;
}

message RequeueOrgEvidenceRejectionsRequest {
  string org_id = 1;
  string reason = 2;  // required, 1 to 500 characters; recorded with who and when
}

message RequeueOrgEvidenceRejectionsResponse {
  int64 attestations = 1;  // records cleared
  int64 chain_heads = 2;   // chain heads cleared
}

message SetOrgEvidenceLogRequest {
  string org_id = 1;
  EvidenceLogKind kind = 2;
  string url = 3;             // https URL of the Rekor; required when SELF_HOSTED
  string public_key_pem = 4;  // the log's PEM public key (ECDSA P-256); required when SELF_HOSTED
}

message SetOrgEvidenceLogResponse {
  OrgEvidenceLog log = 1;
}

// ── Chain verification ──

// How the first failed check failed. The first four are the hash-chain
// invariants (the same kinds `toevan audit verify` reports); the rest are the
// attestation legs.
enum EvidenceBreakageKind {
  EVIDENCE_BREAKAGE_KIND_UNSPECIFIED = 0;
  EVIDENCE_BREAKAGE_KIND_SEQ_CONTIGUITY = 1;   // chain_seq is not the gap-free 1-based sequence
  EVIDENCE_BREAKAGE_KIND_CONTENT_HASH = 2;     // record_hash != sha256(stored record): tampered content
  EVIDENCE_BREAKAGE_KIND_GENESIS_LINK = 3;     // first record does not link to the repository genesis
  EVIDENCE_BREAKAGE_KIND_PREV_LINK = 4;        // a record does not link to its predecessor
  EVIDENCE_BREAKAGE_KIND_SIGNATURE = 5;        // an attestation signature (or its envelope) does not verify
  EVIDENCE_BREAKAGE_KIND_ATTESTATION_BINDING = 6; // a signed statement disagrees with its ledger record
  EVIDENCE_BREAKAGE_KIND_INCLUSION_PROOF = 7;  // a Rekor inclusion proof does not verify
  EVIDENCE_BREAKAGE_KIND_ATTESTATION_MISSING = 8; // an attestable run inside the attested stretch has no signed attestation
  // Records or chain heads a transparency log refused for good, or that an org's own log has not taken
  // for longer than the grace. The chain and the signatures hold; the anchoring does not, so the result
  // is not green. The counts (rejected_by_log, rejected_chain_heads, anchoring_overdue) say how many.
  EVIDENCE_BREAKAGE_KIND_NOT_ANCHORED = 9;
  // A refusal in force with no matching history: something other than the sweep stopped a record from
  // being anchored.
  EVIDENCE_BREAKAGE_KIND_REJECTION_UNRECORDED = 10;
}

// What the Rekor leg did for this org.
enum EvidenceRekorStatus {
  EVIDENCE_REKOR_STATUS_UNSPECIFIED = 0;
  // The org has no stored Rekor proof bundle: nothing to check, proof counts are 0.
  EVIDENCE_REKOR_STATUS_NOT_ANCHORED = 1;
  // The org has bundles but this deployment lacks the pinned log key for at least one of
  // them, so they cannot be checked here. Proof counts are 0; this is not a pass of the proofs.
  EVIDENCE_REKOR_STATUS_NOT_CHECKABLE = 2;
  // The org has bundles and every one was checked under its pinned log key; the
  // proof counts say how many held.
  EVIDENCE_REKOR_STATUS_VERIFIED_ANCHORED = 3;
}

// The first point verification failed. Never carries hashes: an auditor who
// wants them runs the CLI; the page links to the record.
message EvidenceBreakage {
  string repo_id = 1;
  string repo_name = 2;                  // display name; empty when the repository row is gone
  int64 chain_seq = 3;                   // position in that repository's chain
  EvidenceBreakageKind kind = 4;
  string record_id = 5;                  // the ledger run's id; empty when no row sits at that position (a gap)
}

// One verification result. Counts are real: a leg that did not run is reported through
// rekor_status (NOT_ANCHORED or NOT_CHECKABLE), never as "0 ok".
message EvidenceVerification {
  google.protobuf.Timestamp verified_at = 1;
  int64 records_checked = 2;             // ledger records whose chain position was verified
  int32 repos_checked = 3;
  bool chain_intact = 4;                 // the hash chain of every repository holds
  int64 signatures_checked = 5;
  int64 signatures_valid = 6;
  EvidenceRekorStatus rekor_status = 7;
  int64 inclusion_proofs_checked = 8;    // 0 unless rekor_status is VERIFIED_ANCHORED
  int64 inclusion_proofs_ok = 9;         // 0 unless rekor_status is VERIFIED_ANCHORED
  // True only when there is something to verify, the chain is intact, every stored
  // signature and binding verified, no attestation inside the attested stretch is missing,
  // and no inclusion proof that was checked failed.
  //
  // WHAT IT DOES NOT MEAN (do not render it as "untampered"): it proves the stored ledger is
  // internally consistent and that every stored attestation verifies. It cannot detect a
  // rewrite of a repository's records from some point to its head whose attestations were
  // also removed: the chain link is inside every hashed record, so a rewrite always runs to
  // the head, and the unattested stretch reads as the signing sweep's backlog (or as runs
  // from before attestation, when the removal includes the org's earliest attestations); the
  // sweep would sign it afresh. Only the external anchors (Rekor log, git twin, Kosli)
  // defend against that, and this verification does not consult them (its Rekor leg checks
  // only the proof bundles stored with the attestations that remain). Never show a pass as
  // "verified" when signatures_checked is 0.
  bool all_checks_passed = 10;
  EvidenceBreakage first_breakage = 11;  // unset when all_checks_passed, or when nothing_to_verify
  // Attestable runs that have no attestation although a LATER run of the same repository
  // has one. Not counted: runs before the repository's first attested run that are ALSO older
  // than the org's first attestation (legacy, see attestations_before_attestation), and the
  // unattested tail after the repository's newest attested run (the signing sweep's backlog).
  // A run before its repository's first attested run but NOT older than the org's first
  // attestation is counted here. Any is a failure. Facts are signed values (the record's
  // timestamp and decision, the attestation's own time), not table columns. A run the signing
  // sweep failed to sign reads as missing until it is signed.
  int64 attestations_missing = 12;
  // Attestable runs recorded before attestation began for the org: counted, never a failure.
  int64 attestations_before_attestation = 13;
  // The org has no ledger records. all_checks_passed is false and no breakage is named:
  // render "nothing to verify yet", never a green pass.
  bool nothing_to_verify = 14;
  // Of inclusion_proofs_checked, the proofs checked under a log the ORGANIZATION
  // operates (a self-hosted log). Those prove what the org's log says, not what a
  // third party witnessed: render them as such. Always 0 unless rekor_status is
  // VERIFIED_ANCHORED.
  int64 self_hosted_proofs_checked = 15;
  // Signed attestations pinned to a self-hosted log that are not anchored yet.
  // Reported, never counted as a failure (anchoring is asynchronous), never
  // dropped: a log that stays unreachable shows here until it is reachable.
  int64 self_hosted_awaiting = 16;
  // Signed attestations a transparency log (any) REFUSED for good: never anchored, terminal, reported
  // here as "not anchored: rejected by the log". Not a failure of the chain or the signatures.
  int64 rejected_by_log = 17;
  // Repositories whose current chain head a log refused for good: "chain head not anchored: rejected
  // by the log". Terminal; a newer head supersedes it. Not a failure of the chain or the signatures.
  int64 rejected_chain_heads = 18;
  // Of self_hosted_awaiting, the records that have waited longer than the grace (1 hour): an org that
  // runs a log with records the log has not taken for that long is not green.
  int64 anchoring_overdue = 19;
  // Refusals in force with no matching history (something other than the sweep marked them).
  int64 unrecorded_rejections = 20;
}

message VerifyEvidenceChainRequest {
  string org_id = 1;
}

message VerifyEvidenceChainResponse {
  EvidenceVerification verification = 1;
  // true: the org verified inside the minimum interval, so this is the stored
  // result (verification.verified_at says when it ran), not a new run.
  bool served_from_stored = 2;
}

// ── Verdict attestations ──

message ListVerdictAttestationsRequest {
  string repo_id = 1;
  string head_sha = 2;  // the evaluated commit
}

// VerdictAttestation is one signed verdict envelope plus its distribution
// facts. Numeric zero / empty string mean "not (yet) there": rekor fields are
// empty until the transparency-log sweep lands the entry, twin_commit_sha is
// empty until the git-twin mirror carries the file.
message VerdictAttestation {
  string run_id = 1;            // evidence_runs.id the envelope attests
  int64  chain_seq = 2;         // position in the repo's tamper-evident chain
  string blueprint_id = 3;
  string decision = 4;          // pass | blocked | exception (gap is unattestable)
  bytes  envelope = 5;          // DSSE envelope JSON, VERBATIM
  string payload_hash = 6;      // "sha256:<hex>" of the signed payload bytes
  string key_id = 7;            // SPKI fingerprint of the signing key
  int64  rekor_log_index = 8;   // transparency-log inclusion; 0 = not logged yet
  string rekor_log_url = 9;     // WHICH log holds the proof; "" = not logged yet
  string twin_commit_sha = 10;  // evidence-branch commit carrying the file; "" = not mirrored yet
  // Display name of the blueprint at read time (joined, not stored in the
  // immutable record). Empty when the blueprint row is gone; the id above
  // remains the stable key. Clients render THIS, never the UUID.
  string blueprint_name = 11;
}

message ListVerdictAttestationsResponse {
  repeated VerdictAttestation attestations = 1;
}

// ── Core Types ──

message EvidenceRecord {
  string id = 1;
  string org_id = 2;
  google.protobuf.Timestamp timestamp = 3;

  // What was checked
  string blueprint_id = 4;
  string blueprint_name = 5;
  string blueprint_version = 6;
  string rule_id = 7;
  string rule_name = 8;

  // Result
  EvidenceResult result = 9;

  // Context
  string repo_id = 10;
  string repo_name = 11;
  string file_path = 12;
  int32 line = 13;
  string pr_number = 14;
  string author = 15;
  string commit_sha = 16;

  // Exception reference (if result = EVIDENCE_RESULT_EXCEPTION)
  string exception_id = 17;
}

enum EvidenceResult {
  EVIDENCE_RESULT_UNSPECIFIED = 0;
  EVIDENCE_RESULT_PASSED = 1;
  EVIDENCE_RESULT_VIOLATION = 2;
  EVIDENCE_RESULT_WARNING = 3;
  EVIDENCE_RESULT_EXCEPTION = 4;        // violation waived by approved exception
}

message EvidenceSummary {
  string org_id = 1;
  int32 total_checks = 2;
  int32 passed = 3;
  int32 violations = 4;
  int32 warnings = 5;
  int32 exceptions = 6;
  float compliance_rate = 7;             // passed / total
  google.protobuf.Timestamp period_start = 8;
  google.protobuf.Timestamp period_end = 9;

  // Per-blueprint breakdown
  repeated BlueprintComplianceRate per_blueprint = 10;

  // The org's last chain verification (VerifyEvidenceChain); unset when the
  // org has never been verified.
  EvidenceVerification last_verification = 11;
}

message BlueprintComplianceRate {
  string blueprint_id = 1;
  string blueprint_name = 2;
  int32 checks = 3;
  int32 passed = 4;
  float rate = 5;
}

// ── Requests/Responses ──

message ListEvidenceRequest {
  string org_id = 1;
  string repo_id = 2;                    // optional
  string blueprint_id = 3;              // optional
  string author = 4;                     // optional
  EvidenceResult result_filter = 5;     // optional
  google.protobuf.Timestamp from = 6;   // optional date range
  google.protobuf.Timestamp to = 7;
  int32 limit = 8;
  int32 offset = 9;
}
message ListEvidenceAuthorsRequest { string org_id = 1; }
message ListEvidenceAuthorsResponse { repeated string authors = 1; }

message ListEvidenceResponse {
  repeated EvidenceRecord records = 1;
  int32 total = 2;
}

message GetEvidenceRecordRequest { string record_id = 1; }
message GetEvidenceRecordResponse { EvidenceRecord record = 1; }

message ExportEvidenceRequest {
  string org_id = 1;
  string format = 2;                     // "csv" or "pdf"
  // Same filters as ListEvidenceRequest
  string repo_id = 3;
  string blueprint_id = 4;
  string author = 5;
  EvidenceResult result_filter = 6;
  google.protobuf.Timestamp from = 7;
  google.protobuf.Timestamp to = 8;
}
message ExportEvidenceResponse {
  string download_url = 1;              // pre-signed URL to download the export
  string filename = 2;
  int32 record_count = 3;
  string job_id = 4;                    // set for async exports
  EvidenceExportJobStatus status = 5;   // completed for sync path
}

message GenerateComplianceReportRequest {
  string org_id = 1;
  string name = 2;                      // display name, e.g. "GDPR baseline — July"
  string format = 3;                    // "csv" or "pdf"
  string blueprint_id = 4;              // optional filter (empty = all)
  string repo_id = 5;                   // optional filter (empty = all)
  google.protobuf.Timestamp from = 6;   // optional
  google.protobuf.Timestamp to = 7;     // optional
}
message GenerateComplianceReportResponse {
  ComplianceReportRow report = 1;
}
message ListComplianceReportsRequest {
  string org_id = 1;
  int32 limit = 2;                      // default 50
}
message ListComplianceReportsResponse {
  repeated ComplianceReportRow reports = 1;
}
message ComplianceReportRow {
  string id = 1;
  string name = 2;
  string format = 3;                    // "csv" or "pdf"
  string status = 4;                    // completed | pending | failed
  string blueprint_name = 5;            // empty = all blueprints
  string repo_name = 6;                 // empty = all repos
  google.protobuf.Timestamp period_from = 7;
  google.protobuf.Timestamp period_to = 8;
  int32 record_count = 9;
  string generated_by = 10;
  google.protobuf.Timestamp created_at = 11;
  string download_url = 12;             // freshly presigned; empty while pending/failed
}

enum EvidenceExportJobStatus {
  EVIDENCE_EXPORT_JOB_STATUS_UNSPECIFIED = 0;
  EVIDENCE_EXPORT_JOB_STATUS_PENDING = 1;
  EVIDENCE_EXPORT_JOB_STATUS_RUNNING = 2;
  EVIDENCE_EXPORT_JOB_STATUS_COMPLETED = 3;
  EVIDENCE_EXPORT_JOB_STATUS_FAILED = 4;
}

message EvidenceExportJob {
  string id = 1;
  string org_id = 2;
  string format = 3;
  EvidenceExportJobStatus status = 4;
  string filename = 5;
  string download_url = 6;
  int32 record_count = 7;
  string error_message = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp completed_at = 11;
}

message GetEvidenceExportJobRequest {
  string org_id = 1;
  string job_id = 2;
}

message GetEvidenceExportJobResponse {
  EvidenceExportJob job = 1;
}

message GetEvidenceSummaryRequest {
  string org_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}
message GetEvidenceSummaryResponse { EvidenceSummary summary = 1; }

// ── SBOM Generation ──

message GenerateSBOMRequest {
  string org_id = 1;
  string repo_id = 2;                   // repository to generate SBOM for
  string format = 3;                    // "cyclonedx" or "spdx"
  string commit_sha = 4;               // optional: specific commit (defaults to HEAD)
  int64 github_installation_id = 5;    // GitHub app installation for file fetch
  string github_owner = 6;             // GitHub repo owner
  string github_repo = 7;              // GitHub repo name
}

message GenerateSBOMResponse {
  string download_url = 1;             // pre-signed URL to download SBOM
  string filename = 2;
  string format = 3;                    // "cyclonedx" or "spdx"
  EvidenceExportJobStatus status = 4;  // always COMPLETED for sync
}

// ── DPIA Generation (GDPR Art 35) ──

message GenerateDPIARequest {
  string org_id = 1;
  string repo_id = 2;                   // Neo4j project ID for data flow query
  string format = 3;                    // "dpia" or "processing_inventory"
  string commit_sha = 4;               // optional
}

message GenerateDPIAResponse {
  string json_content = 1;              // full DPIA or processing inventory JSON
  string format = 2;
}

// ── Control Mapping Report ──

message GenerateControlMappingRequest {
  string org_id = 1;
  string framework = 2;                 // optional — all frameworks if empty
  repeated string active_constraints = 3; // constraint types currently active
}

message GenerateControlMappingResponse {
  string json_content = 1;              // JSON report (single or array of reports)
  string framework = 2;                 // framework name (empty if all)
}

// ── GDPR Right to Erasure (Art. 17) ──

message EraseDataSubjectRequest {
  string org_id = 1;
  // The data subject's GitHub login as recorded in `author` across the evidence
  // and PR-gate stores. There is no mapping from this login to a Toevan user
  // account — it is the only identifier held for the developer.
  string github_login = 2;
}

message EraseDataSubjectResponse {
  string github_login = 1;
  int64 evidence_records_redacted = 2;  // evidence_records rows whose author was nulled
  int64 pr_checks_redacted = 3;         // pr_checks rows whose author was tombstoned
  int64 export_jobs_redacted = 4;       // evidence_export_jobs rows whose author filter was nulled
  int64 ledger_runs_redacted = 5;       // 0 today — the immutable ledger holds no PII
}
