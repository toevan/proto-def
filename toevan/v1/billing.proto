syntax = "proto3";

package toevan.v1;

import "google/protobuf/timestamp.proto";
import "toevan/v1/auth.proto";
import "toevan/v1/org.proto";

option go_package = "github.com/toevan/api-server/gen/toevan/v1;toevanv1";

// ===================================================================
// BillingService — self-serve subscription lifecycle for an organisation
// ===================================================================
//
// The paid self-serve path: an org admin subscribes to a plan, changes it
// (prorated), cancels, or resumes. DISTINCT from OrgService.AssignOrgPlan, which
// is the admin/provisioning path (an operator or a support grant moving a tier
// WITHOUT a self-serve purchase). Both ultimately write the same entitlement
// plan; this service moves money through the payment gateway first and records
// the subscription / invoice / payment that paid for it.
//
// Every RPC is gated on RequireOrgAdmin — a subscription is the customer's
// commercial decision, not something platform staff make on their behalf outside
// an audited grant. Money moves through billing.PaymentGateway: the in-process
// SimulatedGateway in dev (no real money), a real gateway plugged in later. See
// docs/architecture/PRD_BILLING.md.
service BillingService {
  // Subscribe creates and activates a paid subscription for an org currently on
  // the free plan. The first period is charged immediately; on a decline the org
  // stays free and nothing is granted.
  rpc Subscribe(SubscribeRequest) returns (SubscriptionResponse);

  // ChangePlan changes an active subscription's plan / interval / seats. Upgrades
  // and interval switches charge a proration immediately; downgrades and seat
  // reductions are deferred to the period roll. A declined upgrade is a no-op —
  // the current plan is kept, never downgraded.
  rpc ChangePlan(ChangePlanRequest) returns (SubscriptionResponse);

  // CancelSubscription cancels the org's subscription: at the period end
  // (graceful — keeps access until the roll) or immediately (drops to free now,
  // with no refund of the unused period).
  rpc CancelSubscription(CancelSubscriptionRequest) returns (SubscriptionResponse);

  // ResumeSubscription clears a scheduled at-period-end cancellation so the
  // subscription keeps renewing.
  rpc ResumeSubscription(ResumeSubscriptionRequest) returns (SubscriptionResponse);

  // GetSubscription returns the org's current subscription, or has_subscription
  // = false when it is on the free plan with none.
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);

  // ── personal axis (PR-5c) ─────────────────────────────────────────────────
  //
  // The personal RPCs are a PARALLEL, UserPlan-typed set rather than an axis
  // flag on the org messages, for two wire-level guarantees: a cross-axis plan
  // request is UNREPRESENTABLE (UserPlan cannot name an org tier and vice
  // versa), and the personal requests carry NO owner field at all — the owner
  // is the AUTHENTICATED user, always, so acting on someone else's personal
  // subscription cannot be expressed. Seats never appear: a personal
  // subscription is single-seat by definition.

  // SubscribePersonal starts a paid personal subscription (pro/max) for the
  // calling user. The first period is charged immediately; on a decline the
  // user stays free and nothing is granted.
  rpc SubscribePersonal(SubscribePersonalRequest) returns (PersonalSubscriptionResponse);

  // ChangePersonalPlan changes the calling user's plan / interval. Upgrades and
  // interval switches charge a proration immediately; downgrades defer to the
  // period roll. A declined upgrade is a no-op.
  rpc ChangePersonalPlan(ChangePersonalPlanRequest) returns (PersonalSubscriptionResponse);

  // CancelPersonalSubscription cancels the calling user's subscription: at the
  // period end (graceful) or immediately (drops to free now, no refund of the
  // unused period).
  rpc CancelPersonalSubscription(CancelPersonalSubscriptionRequest) returns (PersonalSubscriptionResponse);

  // ResumePersonalSubscription clears a scheduled at-period-end cancellation.
  rpc ResumePersonalSubscription(ResumePersonalSubscriptionRequest) returns (PersonalSubscriptionResponse);

  // GetPersonalSubscription returns the calling user's current subscription, or
  // has_subscription = false when they are on the free plan with none.
  rpc GetPersonalSubscription(GetPersonalSubscriptionRequest) returns (GetPersonalSubscriptionResponse);

  // ── billing records ───────────────────────────────────────────────────────

  // ListInvoices returns the org's invoices, newest first, with their line
  // items — the /billing "Billing records" surface. Org-admin gated like every
  // other billing read; amounts are integer minor units, same discipline as
  // the biller (money that is summed must not accumulate float error).
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);

  // ListPersonalInvoices is the personal-axis twin: the calling user's own
  // invoices, no owner on the wire.
  rpc ListPersonalInvoices(ListPersonalInvoicesRequest) returns (ListInvoicesResponse);
}

// BillingInterval is the billing period a subscription is charged on.
enum BillingInterval {
  BILLING_INTERVAL_UNSPECIFIED = 0;
  BILLING_INTERVAL_MONTH = 1;
  BILLING_INTERVAL_YEAR = 2; // billed at the annual multiplier (default 10 months).
}

// SubscriptionStatus is the lifecycle state of a subscription.
enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  SUBSCRIPTION_STATUS_INCOMPLETE = 1; // created, awaiting the first payment.
  SUBSCRIPTION_STATUS_ACTIVE = 2;     // paid and live.
  SUBSCRIPTION_STATUS_PAST_DUE = 3;   // a renewal failed; in dunning, still entitled.
  SUBSCRIPTION_STATUS_CANCELED = 4;   // terminal.
}

message SubscribeRequest {
  string org_id = 1;
  OrgPlan plan = 2;
  BillingInterval interval = 3;
  int32 seats = 4;
}

message ChangePlanRequest {
  string org_id = 1;
  OrgPlan plan = 2;
  BillingInterval interval = 3;
  int32 seats = 4;
}

message CancelSubscriptionRequest {
  string org_id = 1;
  // immediate=false (default) cancels gracefully at the period end; true cancels
  // now and drops the org to free.
  bool immediate = 2;
}

message ResumeSubscriptionRequest {
  string org_id = 1;
}

message GetSubscriptionRequest {
  string org_id = 1;
}

// Subscription is the wire view of an org's subscription.
message Subscription {
  string id = 1;
  OrgPlan plan = 2;
  BillingInterval interval = 3;
  SubscriptionStatus status = 4;
  int32 seats = 5;
  google.protobuf.Timestamp current_period_start = 6;
  google.protobuf.Timestamp current_period_end = 7;
  bool cancel_at_period_end = 8;
  // pending_change is a scheduled deferred change (a downgrade / seat reduction)
  // to apply at the period roll; unset when none is scheduled.
  PendingChange pending_change = 9;
}

// PendingChange is a deferred plan change awaiting the period roll.
message PendingChange {
  OrgPlan plan = 1;
  BillingInterval interval = 2;
  int32 seats = 3;
  google.protobuf.Timestamp change_at = 4;
}

message SubscriptionResponse {
  Subscription subscription = 1;
}

message GetSubscriptionResponse {
  bool has_subscription = 1;
  Subscription subscription = 2;
}

// ── personal axis (PR-5c) ───────────────────────────────────────────────────

message SubscribePersonalRequest {
  UserPlan plan = 1;             // pro or max; UNSPECIFIED/FREE are rejected
  BillingInterval interval = 2;
}

message ChangePersonalPlanRequest {
  UserPlan plan = 1;
  BillingInterval interval = 2;
}

message CancelPersonalSubscriptionRequest {
  // immediate=false (default) cancels gracefully at the period end; true cancels
  // now and drops the user to free.
  bool immediate = 1;
}

message ResumePersonalSubscriptionRequest {}

message GetPersonalSubscriptionRequest {}

// PersonalSubscription is the wire view of the calling user's subscription.
message PersonalSubscription {
  string id = 1;
  UserPlan plan = 2;
  BillingInterval interval = 3;
  SubscriptionStatus status = 4;
  google.protobuf.Timestamp current_period_start = 5;
  google.protobuf.Timestamp current_period_end = 6;
  bool cancel_at_period_end = 7;
  // pending_change is a scheduled deferred change (a downgrade) to apply at the
  // period roll; unset when none is scheduled.
  PendingPersonalChange pending_change = 8;
}

// PendingPersonalChange is a deferred personal plan change awaiting the roll.
message PendingPersonalChange {
  UserPlan plan = 1;
  BillingInterval interval = 2;
  google.protobuf.Timestamp change_at = 3;
}

message PersonalSubscriptionResponse {
  PersonalSubscription subscription = 1;
}

message GetPersonalSubscriptionResponse {
  bool has_subscription = 1;
  PersonalSubscription subscription = 2;
}

// Invoice is one billing document, exactly as the biller recorded it.
//
// `status` uses the biller's states verbatim: draft | open | paid | void |
// uncollectible. Timestamps are unix seconds; 0 means "has not happened"
// (issued_at 0 = never issued, paid_at 0 = unpaid).
message Invoice {
  string id = 1;
  string number = 2;
  string status = 3;
  BillingInterval interval = 4;
  int64 period_start_unix = 5;
  int64 period_end_unix = 6;
  int64 subtotal_minor = 7;
  int64 credit_minor = 8;
  int64 tax_minor = 9;
  int64 total_minor = 10;
  string currency = 11;
  int64 paid_at_unix = 12;
  int64 created_at_unix = 13;
  repeated InvoiceLine lines = 14;
}

// InvoiceLine is one line item on an invoice — the human-readable breakdown
// ("Team plan · 3 seats · monthly", proration credits, etc.).
message InvoiceLine {
  string description = 1;
  int32 quantity = 2;
  int64 unit_minor = 3;
  int64 amount_minor = 4;
}

message ListInvoicesRequest {
  string org_id = 1;
  // Newest-first cap; the server clamps (default 24, max 100).
  int32 limit = 2;
}

message ListPersonalInvoicesRequest {
  int32 limit = 1;
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
}
