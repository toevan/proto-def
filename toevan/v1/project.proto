syntax = "proto3";

package toevan.v1;

option go_package = "github.com/toevan/api-server/gen/toevan/v1;toevanv1";

import "google/protobuf/timestamp.proto";
import "toevan/v1/org.proto";
import "toevan/v1/blueprint.proto";

// ============================================
// ProjectService — Project CRUD, Members, Blueprints, Repos
// ============================================

service ProjectService {
  // Project CRUD
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  // UpdateProject edits a project's name and description. Org admin or project
  // owner/maintainer only; audit-logged in the same transaction.
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  // ArchiveProject archives a project and, in the same transaction, PAUSES its project-scoped
  // blueprint adoptions. While archived, no blueprint gates pull requests or is evaluated on the
  // project's repositories, repository-scoped ones included (those are not paused and gate again
  // on restore). Nothing can be turned on while archived; turning one off is allowed and stays off
  // after restore. RestoreProject resumes only the adoptions archive paused; one a person paused
  // stays paused. Evidence is kept.
  // Dialog wording (client i18n owns the string): "Archiving pauses this project's blueprints, so
  // nothing in it gates pull requests, and makes the project read-only. Restoring it resumes the
  // blueprints archiving paused; any you paused yourself stay paused."
  rpc ArchiveProject(ArchiveProjectRequest) returns (ArchiveProjectResponse);
  rpc RestoreProject(RestoreProjectRequest) returns (RestoreProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  // Project member management — separate from org membership
  // OrgRole (org.proto) governs feature access (what pages/capabilities).
  // ProjectPermission governs data access (what you can do within THIS project).
  rpc AddProjectMember(AddProjectMemberRequest) returns (AddProjectMemberResponse);
  rpc RemoveProjectMember(RemoveProjectMemberRequest) returns (RemoveProjectMemberResponse);
  rpc UpdateProjectMemberPermission(UpdateProjectMemberPermissionRequest) returns (UpdateProjectMemberPermissionResponse);
  rpc ListProjectMembers(ListProjectMembersRequest) returns (ListProjectMembersResponse);

  // NEW: Blueprint assignment (project-scoped)
  rpc AssignBlueprintToProject(AssignBlueprintToProjectRequest) returns (AssignBlueprintToProjectResponse);
  rpc RemoveBlueprintFromProject(RemoveBlueprintFromProjectRequest) returns (RemoveBlueprintFromProjectResponse);

  // NEW: Link repos
  rpc AddRepoToProject(AddRepoToProjectRequest) returns (AddRepoToProjectResponse);
  rpc RemoveRepoFromProject(RemoveRepoFromProjectRequest) returns (RemoveRepoFromProjectResponse);
}

// ── Project ──

enum ProjectContext {
  PROJECT_CONTEXT_UNSPECIFIED = 0;
  PROJECT_CONTEXT_ORG = 1;                    // project is owned by an org
  PROJECT_CONTEXT_USER = 2;                // project is owned by a user
}

message Project {
  string id = 1;
  string name = 2;
  string description = 3;                         // [NEW] UI renders project descriptions

  // [NEW] project context
  ProjectContext context = 4;
  string context_id = 5;                               // [NEW] which org or user owns this project

  // status
  ProjectStatus status = 6;

  // timestamps
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;

  // Linked repos — embedded objects, 
  repeated ProjectRepo repositories = 9;

  // Project-scoped blueprints [NEW]
  repeated BlueprintRef blueprints = 10;   // both ID and name for UI rendering

  // Team [audit fix #5: split role from permission]
  repeated ProjectMember members = 11;

  // Aggregated metrics
  int32 violation_count = 12;
  // Share of the governing rules, summed over the project's evaluated repos,
  // that have no open finding (api view repo_blueprint_compliance). Meaningful
  // only when evaluated is true; otherwise 0.0 means "not evaluated yet".
  float compliance_rate = 13;            // 0.0–1.0 (UI multiplies by 100)
  int32 pull_request_count = 14;        // [NEW — audit fix: UI shows PR count per project]
  google.protobuf.Timestamp last_activity_at = 15;            // timestamp should be used to show human-readable: "2h ago"

  // Agents [NEW — UI displays agents per project]
  repeated string agents = 16;

  // Scalar counts for list endpoints (avoids hydrating nested objects).
  // Detail endpoint (GetProject) populates the repeated fields above instead.
  int32 repo_count = 17;
  int32 blueprint_count = 18;
  int32 member_count = 19;

  // True when at least one repo of the project has a default-branch evaluation
  // of its governing rules, so compliance_rate is a real number. False means
  // "not evaluated yet" (compliance_rate is then 0.0, not 0%).
  bool evaluated = 20;
  // Governed rules of (repo, blueprint) pairs not evaluated yet, summed over the
  // project's repos. compliance_rate covers evaluated rules only.
  int32 rules_pending = 21;

  // The EVALUATED governing rules on the default branch, summed per repository over the
  // project's repos: the SAME counts compliance_rate is taken from
  // (rate.Of(rules_total, rules_failing) is compliance_rate). Governed rules of a
  // (repo, blueprint) pair nothing has evaluated yet are NOT in it (rules_pending).
  // rules_total 0 means not evaluated yet.
  int32 rules_total = 22;
  int32 rules_failing = 23;
  // Open findings (the violation_count set) whose file is NOT production code by
  // the attention scope's path classification. violation_count - this is the
  // production share.
  int32 non_production_violation_count = 24;
  // Pull requests the PR gate evaluated in the last 30 days (a rolling window).
  // pull_request_count stays the all-time count.
  int32 pull_requests_gated_30d = 25;
}

enum ProjectStatus {
  PROJECT_STATUS_UNSPECIFIED = 0;
  PROJECT_STATUS_ACTIVE = 1;                       // [NEW] most common UI state
  PROJECT_STATUS_CREATED = 2;                      // just created, no repos onboarded yet
  PROJECT_STATUS_INDEXING = 3;
  PROJECT_STATUS_INDEXED = 4;
  PROJECT_STATUS_ERROR = 5;
  PROJECT_STATUS_ARCHIVED = 6;
}

// Embedded repo summary in project [NEW — replaces bare repo_ids]
message ProjectRepo {
  string repo_id = 1;
  string name = 2;                       // "payment-service"
  string language = 3;                   // "Go"
  repeated BlueprintRef blueprints = 4;   // repo-scoped blueprints
  string status = 5;                     // repo_status verbatim (pending/indexing/indexed/error/...)
  int32 open_violations = 6;             // open findings on current evidence
  // Of open_violations, the findings in files that are NOT production code by the same path
  // classification as Project.non_production_violation_count: tests, docs, fixtures, examples,
  // generated, vendored and blueprint assets. Scripts and build files are production (source).
  // The client labels it "Non-production". The project total is the sum of its repositories'
  // values, never a second derivation. Absent when the repository has never been scanned
  // (unknown), never 0 for unknown.
  optional int32 non_production_violation_count = 7;
  // The newest evidence-ledger row of the repository (the same definition as
  // Repo.last_scan_at). Absent when it has never been scanned.
  optional google.protobuf.Timestamp last_scan_at = 8;
}

// ── Project-level access control ──
// Distinct from OrgRole (org.proto) which governs feature access.
// ProjectPermission governs what a member can do WITHIN a specific project.

enum ProjectPermission {
  PROJECT_PERMISSION_UNSPECIFIED = 0;
  PROJECT_PERMISSION_ADMIN = 1;                    // manage project settings, blueprints, members
  PROJECT_PERMISSION_WRITE = 2;                    // create PRs, fix violations, request exceptions
  PROJECT_PERMISSION_READ = 3;                     // view only
}

// A member's access within a specific project.
// Maps to UI member sub-object: {n, r, p, bg, ii}
//   n → name, r → org role (from OrgMember), p → permission (this field),
//   bg → color (from OrgMember), ii → initials (from OrgMember)
message ProjectMember {
  string user_id = 1;
  string project_id = 2;
  string name = 3;
  string email = 4;
  string avatar_url = 5;
  OrgRole org_role = 6;                            // organizational role: ADMIN, DEVELOPER, TEAM_LEAD, COMPLIANCE, CISO, VIEWER, PLATFORM
  ProjectPermission permission = 7;                // what they can do in THIS project
  google.protobuf.Timestamp created_at = 8;
  // The name GitHub states for this person; empty when it states none (`name` falls back to
  // the login): the name the person or GitHub stated; empty when none; never the login.
  string stated_name = 9;
}

// ── Request/Response ──

message CreateProjectRequest {
  string account_id = 1;
  string name = 2;
  string description = 3;
}
message CreateProjectResponse { Project project = 1; }

message GetProjectRequest { string project_id = 1; }
message GetProjectResponse { Project project = 1; }

message ListProjectsRequest {
  string org_id = 1;    // when set: list org-owned projects the caller has access to; when absent: list caller's personal projects
  int32 limit = 2;
  int32 offset = 3;
}
message ListProjectsResponse {
  repeated Project projects = 1;
  int32 total = 2;
  // Org listing only (org_id set), else 0. Archived projects among ALL the
  // projects the caller can see (across pages, not just this page); they are
  // inside total and the page rows like any other non-deleted project.
  int32 archived_count = 3;
  // Org listing only. Distinct CURRENT org members, unioned: the org admins (who see
  // every project implicitly, always included) and the users with an explicit project
  // membership in a project THE CALLER CAN SEE (every project for an org admin; the
  // caller's own projects otherwise), so the number reconciles with the page. One person
  // counted once.
  int32 members_with_access = 4;
  // Org admins among the current members. They are inside members_with_access
  // (includes_org_admins), so a caption can say "org admins see every project".
  int32 org_admin_count = 5;
  bool includes_org_admins = 6;
}

// UpdateProjectRequest edits by PRESENCE: a field that is not sent is left as it is (a
// name-only request does not erase the description). At least one of name and description
// must be sent; a sent name must not be empty. An archived project cannot be edited
// (ERR_PROJECT_ARCHIVED, FAILED_PRECONDITION).
message UpdateProjectRequest {
  string project_id = 1;
  optional string name = 2;
  optional string description = 3;
}
message UpdateProjectResponse {
  Project project = 1;
  // True when project is the fully hydrated detail (the same as GetProject). False when the edit
  // COMMITTED but the detail could not be re-read: project then carries only the committed row
  // (id, name, description, status, timestamps) and every count in it is UNKNOWN, not 0. Refetch
  // GetProject before showing counts.
  bool hydrated = 2;
}

message ArchiveProjectRequest {
  string project_id = 1;
  string reason = 2;                 // optional reason for archiving
}
message ArchiveProjectResponse {
  bool   success = 1;
  string error = 2;
  // Project-scoped blueprint adoptions this archive paused. Absent when unknown.
  optional int32 paused_adoption_count = 3;
}

message RestoreProjectRequest {
  string project_id = 1;
}
message RestoreProjectResponse {
  bool   success = 1;
  string error = 2;
  // Adoptions this restore resumed: only those archive paused. A manually paused adoption stays
  // paused. Absent when unknown.
  optional int32 resumed_adoption_count = 3;
}

message DeleteProjectRequest {
  string project_id = 1;
}
message DeleteProjectResponse {
  bool   success = 1;
  string error = 2;
}

// ── Project Member Management ──
// These are SEPARATE from org invitations. A user must be an org member first,
// then they can be added to specific projects with a ProjectPermission.

message AddProjectMemberRequest {
  string project_id = 1;
  string user_id = 2;
  ProjectPermission permission = 3;
}
message AddProjectMemberResponse {
  bool success = 1;
  string error = 2;
  ProjectMember member = 3;
}

message RemoveProjectMemberRequest {
  string project_id = 1;
  string user_id = 2;
}
message RemoveProjectMemberResponse {
  bool success = 1;
  string error = 2;
}

message UpdateProjectMemberPermissionRequest {
  string project_id = 1;
  string user_id = 2;
  ProjectPermission permission = 3;
}
message UpdateProjectMemberPermissionResponse {
  bool success = 1;
  string error = 2;
}

message ListProjectMembersRequest {
  string project_id = 1;
  ProjectPermission permission_filter = 2;         // optional filter
  int32 limit = 3;
  int32 offset = 4;
}
message ListProjectMembersResponse {
  repeated ProjectMember members = 1;
  int32 total = 2;
}

// ── Blueprint Assignment ──

message AssignBlueprintToProjectRequest {
  string project_id = 1;
  string blueprint_id = 2;
  // Start-as mode (PJ-C2): what the new adoption's findings may do at the PR gate, applied in the
  // same transaction that creates it, so no window gates under the default. UNSPECIFIED = the
  // default (ENFORCE). Security Essentials is always ENFORCE: ANNOTATE for it is refused with
  // ERR_SE_ALWAYS_ENFORCED and nothing is created. Starting as ANNOTATE needs org admin
  // (ERR_ANNOTATE_START_REQUIRES_ADMIN, PermissionDenied).
  AdoptionEnforcementMode enforcement_mode = 3;
}
message AssignBlueprintToProjectResponse {
  bool success = 1;
  string error = 2;
  BlueprintRef blueprint = 3;
}

message RemoveBlueprintFromProjectRequest { 
  string project_id = 1; 
  string blueprint_id = 2; 
}
message RemoveBlueprintFromProjectResponse { 
  bool success = 1; 
  string error = 2; 
}

// ── Link Repos ──

message AddRepoToProjectRequest {
  string project_id = 1;
  string repo_id = 2;
}
message AddRepoToProjectResponse {
  bool success = 1;
  string error = 2;
  ProjectRepo repo = 3;
}

message RemoveRepoFromProjectRequest {
  string project_id = 1;
  string repo_id = 2;
}
message RemoveRepoFromProjectResponse {
  bool success = 1;
  string error = 2;
}