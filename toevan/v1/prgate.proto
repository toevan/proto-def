syntax = "proto3";

package toevan.v1;

option go_package = "github.com/toevan/api-server/gen/toevan/v1;toevanv1";

import "google/protobuf/timestamp.proto";
import "toevan/v1/types.proto";
import "toevan/v1/repo.proto"; // DeepCheckRequest (per-PR deep-check summary)

// ============================================
// PRGateService — PR Enforcement & Violations
// ============================================

service PRGateService {
  rpc ListPullRequests(ListPullRequestsRequest) returns (ListPullRequestsResponse);

  // PR HISTORY — the read-only historical index over pr_checks (the persisted
  // check record), DISTINCT from ListPullRequests which sources LIVE open PRs
  // from GitHub for the active PR Gate. ListPrHistory returns ALL checked PRs
  // including merged/closed ones, each carrying its lifecycle_state, so the
  // history view can label merged/closed PRs and gate re-check to OPEN only.
  rpc ListPrHistory(ListPrHistoryRequest) returns (ListPrHistoryResponse);

  // ALL run instances for a PR — the append-only pr_check_runs event log,
  // newest first. Distinct from ListPrHistory, which is deliberately collapsed
  // to ONE (latest) row per PR: an in-app re-check EVOLVES its pr_checks row in
  // place, so that row is CURRENT STATE while this log is the per-run record.
  // Consequence: a PR with N commits + M in-app re-checks has N pr_checks rows
  // but N+M+ run entries — any "runs" count must come from here, not pr_checks.
  // Terminal runs only (a queued/in-progress check has not been logged yet).
  rpc ListPrCheckRuns(ListPrCheckRunsRequest) returns (ListPrCheckRunsResponse);

  rpc GetPullRequest(GetPullRequestRequest) returns (GetPullRequestResponse);
  rpc RecheckPullRequest(RecheckRequest) returns (RecheckResponse);
  rpc StreamCheckProgress(StreamCheckProgressRequest) returns (stream PRCheckProgressUpdate);
  // Stream progress for MULTIPLE PR checks over a single connection — the batch
  // twin of StreamCheckProgress, mirroring RepoService.StreamBatchIndexProgress.
  // Fans in the per-check Redis progress channels (prgate:check_progress:<id>)
  // so a client can track a whole "Re-run checks" batch in ONE subscription and
  // compute an aggregate "N of M checks" view client-side (no server counter).
  // Cross-process safe: checks run in worker-prgate, this stream is served by
  // api-server, and the two are bridged by the check-progress Redis bus (unlike
  // the in-process single StreamCheckProgress, which is dead in multi-binary prod).
  rpc StreamBatchCheckProgress(StreamBatchCheckProgressRequest) returns (stream PRCheckProgressUpdate);
  // Stream ONE deep-check's LIVE progress + log timeline, keyed by its own identity
  // (repo, pr, head) — a deep-check has no pr_checks row, so it cannot ride the
  // StreamBatchCheckProgress keyspace. Mirrors that RPC's shape (subscribe + DB-seed +
  // reconcile) over the deep-check progress bus, org-scoped via the deep-check store.
  // The terminal frame carries the verdict in `state`.
  rpc StreamDeepCheckProgress(StreamDeepCheckProgressRequest) returns (stream DeepCheckProgressEvent);
  // The DURABLE progress + log timeline for a deep-check, read back for a completed or
  // merged PR (click the badge -> see the logs). Paginated by seq.
  rpc ListDeepCheckProgress(ListDeepCheckProgressRequest) returns (ListDeepCheckProgressResponse);
  rpc ListViolations(ListViolationsRequest) returns (ListViolationsResponse);
  rpc GetViolation(GetViolationRequest) returns (GetViolationResponse);
  rpc GetPRGateConfig(GetPRGateConfigRequest) returns (GetPRGateConfigResponse);
  rpc UpdatePRGateConfig(UpdatePRGateConfigRequest) returns (UpdatePRGateConfigResponse);

  // Per-REPO overrides of the Apply Fix keys (auto_fix_enabled,
  // auto_merge_on_convergence, build_validate_policy) — Apply Fix config
  // phase 2. Overrides are TRI-STATE per key: an absent field means
  // "inherit the org value" and the resolver merges key-by-key
  // (repo > project > org), so an override row carrying one key never
  // resets the others. Storage: repo-scoped agent_configs rows under
  // agent_type='canvas_detail' — the same rows the dispatch-path
  // resolver reads. List is org-member read; Set is org-admin write,
  // audited; setting every field to inherit clears the override.
  rpc ListRepoAutoFixOverrides(ListRepoAutoFixOverridesRequest) returns (ListRepoAutoFixOverridesResponse);
  rpc SetRepoAutoFixOverride(SetRepoAutoFixOverrideRequest) returns (SetRepoAutoFixOverrideResponse);

  // Re-evaluate (re-gate) a repo's OPEN PRs — used after a blueprint
  // adoption/unadoption changes the constraint set. Enqueues a fresh
  // deferred-full PR check per selected PR; empty pr_numbers = ALL open PRs.
  // No base-advance dedup is applied (the constraint set changed, so an
  // unchanged head/base can still flip the verdict). Auth: org member — the
  // repo's org is resolved server-side from repo_id (no org_id on the wire).
  rpc RegatePullRequests(RegatePullRequestsRequest) returns (RegatePullRequestsResponse);

  rpc GetPRCheckSummary(GetPRCheckSummaryRequest) returns (GetPRCheckSummaryResponse);

  // Premium pre-merge deep-check per-repo opt-in (T5/Phase 5b). The deep-check
  // indexes a PR's merged state into an isolated graph and blocks on the
  // base-graph-only compliance families the cheap PR-head gate cannot soundly
  // check pre-merge ("Toevan Deep Check" check-run). The toggle is PER-REPO
  // (the index cost is per-repo) and gated to Enterprise/Platform plans.
  //
  // Auth: Get is org-member (read); Set is admin/owner (it turns on an
  // expensive enforcement feature). The repo's org is resolved server-side
  // from repo_id and the membership/role check is scoped to it.
  rpc GetRepoDeepCheckEnabled(GetRepoDeepCheckEnabledRequest) returns (GetRepoDeepCheckEnabledResponse);
  rpc SetRepoDeepCheckEnabled(SetRepoDeepCheckEnabledRequest) returns (SetRepoDeepCheckEnabledResponse);
  // Triggers an on-demand PR-branch CANVAS index (index-only: no verdict, no
  // check-run, no plan gate) so any member can view a PR's branch graph.
  // Idempotent: already-serving or already-building returns that state without
  // enqueueing. FailedPrecondition when PR-branch canvas serving is disabled
  // platform-wide (deep_check.persist_scopes off).
  rpc TriggerPRCanvasIndex(TriggerPRCanvasIndexRequest) returns (TriggerPRCanvasIndexResponse);

  // Read-only discovery for the PR-branch canvas — the companion to
  // TriggerPRCanvasIndex: what state is the PR's canvas in, and can a build
  // be started? Lets the client indicate "resolve merge conflicts first"
  // BEFORE a doomed build attempt (instead of after one), flip straight to
  // the building surface when a run is already in flight, or reload when the
  // graph became available. Member-level, read-only, no side effects.
  rpc GetPRCanvasState(GetPRCanvasStateRequest) returns (GetPRCanvasStateResponse);

  // KA-244 step 4 — admin operator-unblock for the auto-fix
  // convergence loop. Clears
  // pr_violation_fix_branch.loop_capped_at, allowing fix_apply
  // to resume dispatches against the violation. Operators
  // invoke this after manually inspecting the PR + confirming
  // the loop should resume (e.g. they hand-resolved an
  // ambiguous review comment that was causing oscillation).
  //
  // Authorization: admin role required. Without role checks,
  // any user could clear the cap on any violation, defeating
  // the safety floor.
  rpc ClearAutoFixLoopCap(ClearAutoFixLoopCapRequest) returns (ClearAutoFixLoopCapResponse);

  // KA-244 step 4 — operator dashboard query for
  // "violations whose loop hit the cap." Surfaces the
  // queue of operator-action items so triage can route
  // through ClearAutoFixLoopCap or hand-resolve.
  rpc ListAutoFixLoopCappedViolations(ListAutoFixLoopCappedViolationsRequest)
      returns (ListAutoFixLoopCappedViolationsResponse);

  // §3.C streaming surface — server-side fanout from the
  // convergence comment-lifecycle write path so canvas clients
  // see per-violation state transitions in real time without
  // polling. The pull-only refresh policy (GetViolation /
  // ListViolations) remains as the cold-load + reconciliation
  // path; this stream is purely additive for live updates.
  //
  // Scope: keyed on (org_id, pr_number). The canvas typically
  // views one PR at a time, so per-PR is the natural unit —
  // per-violation would fan out N subscriptions for one canvas
  // open and per-org would surface unrelated traffic.
  //
  // Auth: org member (same as the read RPCs). PR existence is
  // verified before subscription so cross-tenant probes get
  // NotFound rather than a side-channel that confirms the PR
  // is being processed somewhere.
  //
  // Lifecycle: stream stays open until the client disconnects;
  // there is no terminal frame (lifecycle events are open-ended
  // — the convergence loop fires on every push). Clients
  // typically open a stream when entering the canvas detail
  // sheet + close it on navigation away.
  //
  // Coexistence with EnrichedViolation lifecycle fields: the
  // event mirrors the same five fields the read RPC surfaces
  // (auto_fix_state, attempt_count, loop_capped_at,
  // last_commit_sha, pr_url) so clients can apply each event
  // verbatim onto their cached EnrichedViolation without a
  // re-fetch.
  rpc StreamViolationLifecycle(StreamViolationLifecycleRequest)
      returns (stream ViolationLifecycleEvent);

  // StreamPrChanges streams one ORG's pull-request state changes.
  //
  // This is the RPC that makes an OBSERVER converge, and it exists because the
  // two check-progress streams above cannot do it: both are addressed by a check
  // JOB ID, so only the client that dispatched a check can watch it. A second
  // device on the same account, a re-run started by a teammate, a check triggered
  // by a push webhook — none of them hold a job id, and no client change can fix
  // that. It is a server-side addressing problem, the same one StreamRepoChanges
  // solved for indexing.
  //
  // ONE channel carries the PR-gate check lifecycle, the PR-branch canvas build
  // lifecycle, exception decisions and GDPR erasures, rather than a stream per
  // subsystem. They are different server domains but the same client question —
  // "something about this PR changed, re-read what you render" — and the surfaces
  // that consume them all sit in PR context. Separate streams would mean separate
  // subscriptions and separate reconnect ladders for one concern.
  //
  // Contract notes that matter to every consumer:
  //
  //   - Frames are INVALIDATION SIGNALS, not snapshots. Verdicts, violation sets
  //     and scope payloads are derived and MUST be re-fetched.
  //   - Delivery is best-effort and unreplayed, and a broker outage manifests as
  //     SILENCE rather than an error. Clients keep a slow reconciliation read;
  //     this stream makes convergence fast, not guaranteed.
  //   - The stream is long-lived and has no terminal frame.
  rpc StreamPrChanges(StreamPrChangesRequest) returns (stream PrChangeFrame);
}

// ── Core Types ──

message PullRequest {
  string id = 1;
  string org_id = 2;
  string repo_id = 3;
  string repo_name = 4;
  string repo_description = 25;          // repo's GitHub "About" text (empty when none)
  int32 pr_number = 5;
  string title = 6;
  string author = 7;
  string author_avatar = 8;
  string head_branch = 9;
  string base_branch = 10;
  string head_commit = 11;
  PRStatus status = 12;
  int32 violation_count = 13;
  int32 critical_count = 14;
  int32 error_count = 15;
  int32 warning_count = 16;
  int32 info_count = 17;
  int32 files_changed = 18;
  repeated string blueprints_checked = 19;  // blueprint names that were evaluated
  google.protobuf.Timestamp checked_at = 20;
  google.protobuf.Timestamp created_at = 21;
  int32 check_duration_ms = 22;
  bool from_cache = 23;                  // true if results came from cache
  string github_check_run_id = 24;
  // GitHub lifecycle of the PR itself (open/merged/closed) — DISTINCT from the
  // check verdict in `status`. Populated from pull_request webhook events and
  // persisted on pr_checks. Lets PR History surface merged/closed PRs and gate
  // actions (re-check only for OPEN). UNSPECIFIED on legacy rows pre-backfill.
  PRLifecycleState lifecycle_state = 26;
  google.protobuf.Timestamp merged_at = 27;  // set when lifecycle_state = MERGED
  google.protobuf.Timestamp closed_at = 28;  // set when MERGED or CLOSED

  // Per-PR premium deep-check summary (state, reason, evaluated head) for the
  // PR-history deep-check badge and the PR-gate detail's deep-check section. It is
  // backed by the DURABLE deep-check verdict-of-record, which survives PR close and
  // merge (so it shows on the merged/closed PRs that dominate history), with the live
  // serving state overlaid while a check is in flight on an open PR. UNSET only when a
  // PR has no verdict and none in flight: deep-check not enabled for the repo, or no
  // blocking base-graph-only family applied. The client shows no badge then. Reuses the
  // repo.proto DeepCheckRequest shape so a PR's deep-check state has one representation.
  DeepCheckRequest deep_check = 29;
}

enum PRStatus {
  PR_STATUS_UNSPECIFIED = 0;
  PR_STATUS_PENDING = 1;                 // awaiting first evaluation (no verdict yet)
  PR_STATUS_PASSED = 2;                  // all blueprints pass
  PR_STATUS_WARNING = 3;                 // only WARNING-severity violations
  PR_STATUS_BLOCKED = 4;                 // ERROR or CRITICAL violations
  PR_STATUS_ERROR = 5;                   // check failed (infra error, not violation)
  PR_STATUS_QUEUED = 6;                  // a (re-)check has been enqueued, worker not yet started
  PR_STATUS_IN_PROGRESS = 7;             // the check worker is actively evaluating the PR
}

// The pull request's GitHub LIFECYCLE state — whether the PR is still open,
// merged, or closed-without-merge. This is orthogonal to PRStatus (the check
// VERDICT): a merged PR can have passed, and an open PR can be blocked.
// Populated from GitHub `pull_request` webhook events (opened / closed /
// merged / reopened). PR History uses it to include + label merged/closed PRs
// and to hide re-check on anything that is no longer OPEN.
enum PRLifecycleState {
  PR_LIFECYCLE_STATE_UNSPECIFIED = 0;    // unknown — legacy pr_checks rows before backfill
  PR_LIFECYCLE_STATE_OPEN = 1;
  PR_LIFECYCLE_STATE_MERGED = 2;
  PR_LIFECYCLE_STATE_CLOSED = 3;         // closed without merging
}

message EnrichedViolation {
  string id = 1;
  string pr_id = 2;
  string repo_id = 3;

  // Rule identification
  string rule_id = 4;                    // constraint ID (e.g., "gdpr-no-pii-in-logs")
  string rule_name = 5;                  // human-readable name
  string blueprint_id = 6;
  string blueprint_name = 7;

  // Location
  string file_path = 8;
  int32 line = 9;
  int32 end_line = 10;

  // Severity & description
  ViolationSeverity severity = 11;
  string description = 12;              // human-readable explanation
  string cite = 13;                      // regulatory reference (e.g., "GDPR Art.32")

  // Code diff
  string current_code = 14;             // the violating code ("del" line)
  string suggested_fix = 15;            // the fixed code ("add" line)
  string expanded_fix = 16;             // AI-enhanced fix with more context

  // Metadata
  int32 estimated_fix_minutes = 17;
  string fix_pattern = 18;              // "pii-field-replacement", "tokenisation-wrap"
  float confidence = 19;                 // 0.0–1.0 for data-flow-derived violations
  bool is_new_in_pr = 20;              // true = introduced by this PR, false = pre-existing

  // Exception status
  string exception_id = 21;             // non-empty if an active exception covers this
  ExceptionBrief exception = 22;

  google.protobuf.Timestamp detected_at = 23;

  // KA-244 — convergence-loop state surfaced from
  // pr_violation_fix_branch + the convergence comment
  // lifecycle. Empty / unspecified when this violation
  // has never been auto-dispatched (no row in
  // pr_violation_fix_branch). Client UIs render a state
  // badge per violation row + a status block in the
  // detail sheet (see canvas-fix-application-client-spec
  // scenario C).
  AutoFixLifecycleState auto_fix_state = 24;

  // Iteration counter from pr_violation_fix_branch.attempt_count.
  // Zero when no row exists; positive once fix_apply has
  // recorded at least one commit. Surfaced as
  // "iteration N of M" in the detail sheet.
  int32 auto_fix_attempt_count = 25;

  // Set when pr_violation_fix_branch.loop_capped_at is non-NULL.
  // Drives the operator-action affordance in the detail
  // sheet (admin-gated Unblock button).
  google.protobuf.Timestamp auto_fix_loop_capped_at = 26;

  // Most recent commit SHA pushed by fix_apply for this
  // violation. Empty until the first successful push.
  string auto_fix_last_commit_sha = 27;

  // GitHub PR URL the fix-branch is opened against. Empty
  // until the first dispatch resolved a PR. Drives the
  // "View PR" affordance in the detail sheet.
  string auto_fix_pr_url = 28;

  // The owning rule's GENERIC explanation (the blueprint rule's
  // description, e.g. "Enforces that UI layers depend only on
  // permitted layers…"). Distinct from `description` (the
  // per-occurrence message): this is the same text the canvas
  // violation-detail panel's EXPLANATION section shows, so the
  // PR-Gate card can render real "what's wrong" detail in its
  // collapsed view. Resolved read-time from blueprint metadata;
  // empty when the rule/blueprint can't be resolved.
  string explanation = 29;

  // Gate outcome axis (block vs advisory), ORTHOGONAL to severity. Records what
  // the gate DID with this violation this run — computed once at verdict time
  // from the single blocking-truth source (internal/prgate
  // enforcementPolicy.blocks) and PERSISTED per PR-scoped violation, so the
  // client renders the same block/advisory verdict the GitHub check-run shows
  // without re-deriving policy. UNSPECIFIED in non-gate contexts (canvas /
  // repo-scoped reuse) and for legacy rows written before this field existed;
  // the "pre-existing" vs "introduced" reason for an advisory is composed
  // client-side from is_new_in_pr (field 20), which is already carried here.
  GateEffect gate_effect = 30;
}

// GateEffect is the block-vs-advisory axis of a SURFACED violation's gate
// outcome, orthogonal to severity. One source of blocking truth
// (enforcementPolicy.blocks, stamped once at verdict time) feeds persistence,
// the check-run annotation, and this wire field, so they can never disagree.
// Append new values; never rename.
enum GateEffect {
  GATE_EFFECT_UNSPECIFIED = 0;  // not evaluated in a gate context / legacy row
  GATE_EFFECT_BLOCK = 1;        // fails the gate: net-new AND block-eligible
  GATE_EFFECT_ADVISORY = 2;     // surfaced but does not block the merge
}

// AutoFixLifecycleState mirrors
// [internal/agent/convergence.State] (KA-244 step 1) for
// per-violation state surfacing. Stable wire labels —
// dashboard event pipelines may pattern-match these.
// Append new values; never rename.
enum AutoFixLifecycleState {
  AUTO_FIX_LIFECYCLE_STATE_UNSPECIFIED = 0;
  // No pr_violation_fix_branch row yet — violation has
  // never been auto-dispatched. Distinguished from
  // DISABLED (org didn't opt into auto-fix) by inspecting
  // PRGateConfig.auto_fix_enabled.
  AUTO_FIX_LIFECYCLE_STATE_NEVER_DISPATCHED = 1;
  // First dispatch fired; agent run started.
  AUTO_FIX_LIFECYCLE_STATE_DISPATCHED = 2;
  // Re-dispatch after pr_review found further findings.
  // Visually distinct from DISPATCHED so operators see
  // "iteration N of M" progress.
  AUTO_FIX_LIFECYCLE_STATE_IN_PROGRESS = 3;
  // Auto-merged + zero remaining findings. Terminal.
  AUTO_FIX_LIFECYCLE_STATE_CONVERGED = 4;
  // pr_violation_fix_branch.loop_capped_at set. Operator
  // unblock required (ClearAutoFixLoopCap admin RPC).
  AUTO_FIX_LIFECYCLE_STATE_CAP_HIT = 5;
  // Per-org rate-limit window exhausted. Auto-retry on
  // next push event.
  AUTO_FIX_LIFECYCLE_STATE_RATE_LIMITED = 6;
  // Global kill switch active. Operator unblock required
  // (clear the Redis flag).
  AUTO_FIX_LIFECYCLE_STATE_KILL_SWITCH = 7;
  // Org has not opted into auto_fix_enabled. Manual
  // Apply Fix still available via the canvas detail sheet.
  AUTO_FIX_LIFECYCLE_STATE_DISABLED = 8;
  // Infra error in the dispatcher (TriggerRun failed,
  // marshal failed, etc.). Will retry on next push.
  AUTO_FIX_LIFECYCLE_STATE_FAILED = 9;
}

enum ExceptionBriefStatus {
  EXCEPTION_BRIEF_STATUS_UNSPECIFIED = 0;
  EXCEPTION_BRIEF_STATUS_PENDING = 1;
  EXCEPTION_BRIEF_STATUS_APPROVED = 2;
  EXCEPTION_BRIEF_STATUS_REJECTED = 3;
}

message ExceptionBrief {
  string id = 1;
  ExceptionBriefStatus status = 2;
  int32 days_remaining = 3;
}

// BuildValidatePolicy selects how the Apply Fix agent's Phase B
// (build/lint validator) judges an applied fix before it is pushed.
// Mirrors the server's buildvalidate.BuildValidatePolicy string enum;
// storage is the same agent_configs.settings JSON blob as
// auto_fix_enabled (the fixapply dispatcher path reads it from there
// with repo > project > org scope inheritance).
enum BuildValidatePolicy {
  BUILD_VALIDATE_POLICY_UNSPECIFIED = 0;  // treated as DIFF (the default)
  BUILD_VALIDATE_POLICY_DIFF = 1;         // block only errors the fix introduced (baseline-compared)
  BUILD_VALIDATE_POLICY_STRICT = 2;       // block on ANY analyzer error in the post-fix tree
  BUILD_VALIDATE_POLICY_OFF = 3;          // skip Phase B entirely (org's CI owns validation)
}

// ReevaluatePRsMode controls whether/how a repo's OPEN PRs are re-evaluated
// after a blueprint adoption/unadoption changes its constraint set. (The gate
// always reads the CURRENT adopted blueprints live on each run; this only
// governs WHEN open PRs get re-checked — adoption itself does not re-gate them.)
enum ReevaluatePRsMode {
  REEVALUATE_PRS_MODE_UNSPECIFIED = 0;  // treated as ASK (the default)
  REEVALUATE_PRS_MODE_OFF = 1;          // never auto re-evaluate open PRs
  REEVALUATE_PRS_MODE_ASK = 2;          // prompt the adopter to pick PRs (default)
  REEVALUATE_PRS_MODE_AUTO = 3;         // silently re-gate all open PRs
}

message RegatePullRequestsRequest {
  string repo_id = 1;             // required — the repo whose open PRs to re-gate
  repeated int32 pr_numbers = 2;  // empty = ALL open PRs for the repo
}

message RegatePullRequestsResponse {
  int32 dispatched_count = 1;  // number of PR checks enqueued
}

message PRGateConfig {
  string org_id = 1;
  bool block_on_error = 2;                       // default: true
  bool block_on_warning = 3;                      // default: false
  bool auto_dismiss_on_fix = 4;                   // default: true
  bool post_pr_comment = 5;                       // default: true
  int32 max_violations_in_comment = 6;            // default: 25
  bool skip_info_violations = 7;                  // default: false

  // AI Auto-Fix settings.
  //
  // Two parallel boolean toggles, two parallel surfaces:
  //
  //   - auto_fix_post_suggestions (field 15): server posts
  //     AI-suggested fixes as inline GitHub review comments
  //     on PR pushes (review-and-click flow). Replaces the
  //     legacy `auto_fix_policy = "suggest"` enum value.
  //
  //   - auto_fix_enabled (field 13): agentloop-backed
  //     dispatcher opens fix PRs autonomously (full lifecycle
  //     — branch + splice + tool-driven validators + push +
  //     PR open + convergence loop).
  //
  // Both can be true; they post on different surfaces.
  //
  // field 8 (auto_fix_policy) — RETIRED. The legacy 3-value
  // enum collapsed to a single live value ("suggest") after
  // §3.F removed "auto_apply"; that single value is now the
  // bool auto_fix_post_suggestions. Reserved so old clients
  // sending the string field get an unknown-field signal.
  reserved 8;
  reserved "auto_fix_policy";
  float suggestion_confidence_threshold = 9;      // 0.0-1.0 (default: 0.8) — gates BOTH suggestion-posting AND new dispatcher
  // field 10 (auto_fix_batch_limit) — RETIRED with the
  // legacy auto_apply direct-commit path (§3.F).
  reserved 10;
  reserved "auto_fix_batch_limit";
  bool remediation_on_index = 11;                 // auto-open PR after initial index
  int32 remediation_max_fixes = 12;               // max fixes per remediation PR (default: 20)

  // KA-245 step 4.a — opt-in for the agentloop-backed
  // dispatcher (workflow doc §9). The CANONICAL auto-commit
  // surface (full lifecycle — branch + splice + tool-driven
  // validators + push + PR open + convergence loop).
  // Coexists with auto_fix_post_suggestions (field 15) —
  // both can fire on the same PR; they post on different
  // surfaces.
  //
  // Server-side storage: agent_configs.settings JSON under
  // agent_type='canvas_detail'.
  bool auto_fix_enabled = 13;

  // KA-244 step 5 — opt-in for auto-merge when the
  // convergence loop terminates cleanly (workflow doc §6).
  // Stricter opt-in than auto_fix_enabled because falsely
  // merging is unrecoverable; orgs MUST explicitly enable
  // even if auto_fix_enabled is true.
  //
  // Same agent_configs.settings JSON storage as
  // auto_fix_enabled.
  bool auto_merge_on_convergence = 14;

  // Replaces the retired auto_fix_policy="suggest" enum value.
  // When true, the server posts AI-suggested fixes as inline
  // GitHub review comments on every PR push (CreatePRReview
  // with embedded suggestion blocks). The user reviews each
  // suggestion in the PR UI and clicks GitHub's native "Apply
  // suggestion" button.
  //
  // Independent of auto_fix_enabled — both can be on. A PR
  // viewing this combo sees BOTH the agent-opened fix PR AND
  // inline review-comment suggestions on the user's PR. Two
  // surfaces, two distinct user flows.
  //
  // Storage: pr_gate_configs.auto_fix_post_suggestions
  // (boolean column added in migration 000064 alongside the
  // auto_fix_policy column drop).
  bool auto_fix_post_suggestions = 15;

  // Per-rule-FAMILY enforcement override (Phase 4b): rule family
  // (constraint type, e.g. "layer_dependency_policy") → action
  // ("block" | "warn" | "off"). This is the ORG/gate axis layered
  // ON TOP of the blueprint's per-constraint enforcement (severity +
  // required/recommended/optional, already applied during constraint
  // evaluation) — NOT a replacement for it. It is further clamped by
  // the gate's soundness floor: a family the gate cannot detect in
  // PR-head code is never allowed to block, regardless of this map.
  //
  // Empty = no override (every family defaults to block, then floored).
  // Unrecognized actions are ignored server-side (treated as default).
  // Storage: pr_gate_configs.family_enforcement (JSONB).
  map<string, string> family_enforcement = 16;

  // When to re-evaluate a repo's OPEN PRs after a blueprint adoption/unadoption
  // changes the constraint set (OFF/ASK/AUTO — see ReevaluatePRsMode). The
  // client reads this after a successful adopt/unadopt: OFF = do nothing,
  // ASK = show the re-evaluate dialog, AUTO = call RegatePullRequests for all
  // open PRs. Default ASK (UNSPECIFIED is treated as ASK).
  ReevaluatePRsMode reevaluate_prs_on_blueprint_change = 17;

  // How the Apply Fix agent's Phase B build validator judges an applied
  // fix (see BuildValidatePolicy). Federated like auto_fix_enabled /
  // auto_merge_on_convergence: served and updated through this config
  // message, stored in agent_configs.settings JSON under
  // agent_type='canvas_detail' where fixapply.OrgConfigResolver reads
  // it. UNSPECIFIED is treated as DIFF on write and never served (the
  // server always answers a concrete policy).
  BuildValidatePolicy build_validate_policy = 18;
}

message PRCheckSummary {
  string org_id = 1;
  int32 prs_checked_today = 2;
  int32 prs_passed = 3;
  int32 prs_blocked = 4;
  int32 prs_warning = 5;
  float pass_rate_7d = 6;               // 7-day rolling pass rate
  float pass_rate_30d = 7;              // 30-day rolling pass rate
  int32 open_violations = 8;
}

// ── Requests/Responses ──

message ListPullRequestsRequest {
  string org_id = 1;
  string repo_id = 2;                    // optional filter
  PRStatus status_filter = 3;            // optional filter
  int32 limit = 4;
  int32 offset = 5;
  string order_by = 6;                   // "checked_at", "violation_count"
}
message ListPullRequestsResponse {
  repeated PullRequest pull_requests = 1;
  int32 total = 2;
}

message ListPrHistoryRequest {
  string org_id = 1;
  string repo_id = 2;                    // optional filter
  int32 limit = 3;
  int32 offset = 4;
}
message ListPrHistoryResponse {
  repeated PullRequest pull_requests = 1;  // each carries lifecycle_state
  int32 total = 2;
}

message GetPullRequestRequest { string pr_id = 1; }
message GetPullRequestResponse { PullRequest pull_request = 1; }

// PrCheckRun is ONE completed gate run — an entry in the append-only
// pr_check_runs event log. The gate PR comment's "Run history" table is built
// from the same rows.
message PrCheckRun {
  string id = 1;
  // Soft reference to the pr_checks row this run finalized. Deliberately NOT a
  // foreign key server-side — the log outlives its check row — so this may
  // point at a row that no longer exists.
  string check_id = 2;
  string repo_id = 3;
  int32 pr_number = 4;
  string head_commit = 5;
  PRStatus status = 6;                   // terminal only: passed/warning/blocked/error
  int32 violation_count = 7;
  int32 critical_count = 8;
  int32 error_count = 9;
  int32 warning_count = 10;
  int32 info_count = 11;
  int32 suppressed_count = 12;
  int32 check_duration_ms = 13;          // 0 on runs recorded before this was captured
  bool from_cache = 14;
  // Set on status=error — distinguishes a run swept by the stale-check reaper
  // from one that genuinely failed. Empty otherwise.
  string error_message = 15;
  google.protobuf.Timestamp finished_at = 16;
  google.protobuf.Timestamp created_at = 17;
}

message ListPrCheckRunsRequest {
  // Any pr_checks id belonging to the PR — a check id addresses the PR, not one
  // scan. The owning org is resolved from it for authorization.
  string pr_id = 1;
  int32 limit = 2;                       // default 20, capped 100
  int32 offset = 3;
}
message ListPrCheckRunsResponse {
  repeated PrCheckRun runs = 1;
  int32 total = 2;                       // total entries for the PR (for paging)
}

message RecheckRequest { string pr_id = 1; }
message RecheckResponse {
  bool accepted = 1;
  string error = 2;
  string check_job_id = 3;
}

message StreamCheckProgressRequest {
  string check_job_id = 1;
}

message StreamBatchCheckProgressRequest {
  repeated string check_job_ids = 1;    // track multiple PR checks over a single stream
}

message PRCheckProgressUpdate {
  string check_job_id = 1;
  int32 step = 2;        // 1..10
  string status = 3;     // queued|in_progress|completed|failed
  string message = 4;
  string error = 5;
  bool completed = 6;
  string error_code = 7;
}

// Fine-grained deep-check run phase. Finer than the DeepCheckState lifecycle: it breaks the
// RUNNING state into clone/index/enrich and adds evaluate/publish, so the client can render a
// live progress bar and phase label. The terminal verdict itself stays in DeepCheckState.
enum DeepCheckProgressPhase {
  DEEP_CHECK_PROGRESS_PHASE_UNSPECIFIED = 0;
  DEEP_CHECK_PROGRESS_PHASE_QUEUED = 1;         // enqueued / waiting (capacity or merge-ref)
  DEEP_CHECK_PROGRESS_PHASE_CLONING = 2;        // preparing the merge ref (worktree)
  DEEP_CHECK_PROGRESS_PHASE_INDEXING = 3;       // structural parse of the merged tree
  DEEP_CHECK_PROGRESS_PHASE_LSP_ENRICHING = 4;  // LSP semantic enrichment (the long phase)
  DEEP_CHECK_PROGRESS_PHASE_EVALUATING = 5;     // evaluating base-graph-only families
  DEEP_CHECK_PROGRESS_PHASE_PUBLISHING = 6;     // posting the verdict check-run
  DEEP_CHECK_PROGRESS_PHASE_DONE = 7;           // terminal; verdict in `state`
  DEEP_CHECK_PROGRESS_PHASE_FAILED = 8;         // terminal failure
}

// One durable event in a deep-check's progress + log timeline. The SAME row is streamed live
// (StreamDeepCheckProgress) and read back historically (ListDeepCheckProgress). Bounded per run
// (structured phase + notable log lines, not per-file spam).
message DeepCheckProgressEvent {
  int64 seq = 1;                          // monotonic per (repo, pr, head): ordering + list cursor
  DeepCheckProgressPhase phase = 2;
  DeepCheckState state = 3;               // lifecycle state at this point (terminal verdict on DONE)
  string message = 4;                     // human-readable log line
  string log_level = 5;                   // info | warn | error (console styling)
  int32 files_processed = 6;              // index metrics; 0 when N/A for the phase
  int32 files_total = 7;
  int32 symbols_found = 8;
  int32 edges_found = 9;
  string current_file = 10;
  google.protobuf.Timestamp occurred_at = 11;
  bool completed = 12;                    // terminal frame (phase DONE or FAILED)
  string error = 13;
  string error_code = 14;
}

message StreamDeepCheckProgressRequest {
  string repo_id = 1;
  int32 pr_number = 2;
  string head_sha = 3;
}

message ListDeepCheckProgressRequest {
  string repo_id = 1;
  int32 pr_number = 2;
  string head_sha = 3;
  int64 after_seq = 4;   // 0 = from the start; else only events with seq > after_seq
  int32 limit = 5;       // 0 = server default
}

message ListDeepCheckProgressResponse {
  repeated DeepCheckProgressEvent events = 1;
  bool has_more = 2;
}

message ListViolationsRequest {
  string org_id = 1;
  string repo_id = 2;                    // optional
  string pr_id = 3;                      // optional
  string blueprint_id = 4;              // optional
  ViolationSeverity min_severity = 5;   // optional — filter >= this severity
  int32 limit = 6;
  int32 offset = 7;
}
message ListViolationsResponse {
  repeated EnrichedViolation violations = 1;
  int32 total = 2;
}

message GetViolationRequest { string violation_id = 1; }
message GetViolationResponse { EnrichedViolation violation = 1; }

message GetPRGateConfigRequest { string org_id = 1; }
message GetPRGateConfigResponse { PRGateConfig config = 1; }

// One repo's Apply Fix override state. Field presence IS the tri-state:
// an absent optional bool / an UNSPECIFIED policy means "inherit the org
// value". repo_name is display-joined server-side from repositories.
message RepoAutoFixOverride {
  string repo_id = 1;
  string repo_name = 2;
  optional bool auto_fix_enabled = 3;
  optional bool auto_merge_on_convergence = 4;
  BuildValidatePolicy build_validate_policy = 5;  // UNSPECIFIED = inherit
}

message ListRepoAutoFixOverridesRequest { string org_id = 1; }
message ListRepoAutoFixOverridesResponse {
  // Only repos with at least one overridden key appear here.
  repeated RepoAutoFixOverride overrides = 1;
}

message SetRepoAutoFixOverrideRequest {
  string org_id = 1;
  string repo_id = 2;
  optional bool auto_fix_enabled = 3;
  optional bool auto_merge_on_convergence = 4;
  BuildValidatePolicy build_validate_policy = 5;  // UNSPECIFIED = inherit
}
message SetRepoAutoFixOverrideResponse {
  // The persisted override; unset when the write cleared the override
  // (every field was inherit).
  RepoAutoFixOverride override = 1;
}

message UpdatePRGateConfigRequest {
  string org_id = 1;
  PRGateConfig config = 2;
}
message UpdatePRGateConfigResponse { PRGateConfig config = 1; }

message GetPRCheckSummaryRequest { string org_id = 1; }
message GetPRCheckSummaryResponse { PRCheckSummary summary = 1; }

// ── Premium deep-check per-repo opt-in (T5/Phase 5b) ──

message GetRepoDeepCheckEnabledRequest { string repo_id = 1; }
message GetRepoDeepCheckEnabledResponse {
  bool enabled = 1; // the per-repo opt-in
  // plan_entitled reports whether the repo's org plan (or a beta:deepcheck tag)
  // ENTITLES the deep-check — the pure entitlement, used ONLY to drive the
  // upgrade hint. It does NOT decide whether the control is interactive.
  bool plan_entitled = 2;
  // available reports whether the deep-check is actually usable by the org right
  // now: the release-flag-gated final answer (see deepCheckAvailable). This is
  // what drives interactivity + whether a run would enqueue. It can be false
  // while plan_entitled is true (entitled but outside the current rollout / the
  // flag is dark), and true while plan_entitled is false (a non-entitled org in
  // the beta tag cohort). The UI shows the interactive toggle only when
  // available; a not-available-but-entitled org sees "rolling out", and a
  // not-available-not-entitled org sees the upgrade hint.
  bool available = 3;
}

message SetRepoDeepCheckEnabledRequest {
  string repo_id = 1;
  bool enabled = 2;
}
// SetRepoDeepCheckEnabledResponse echoes the persisted toggle. Enabling on a
// non-entitled plan fails with FailedPrecondition (the org must upgrade);
// disabling is always allowed.
message SetRepoDeepCheckEnabledResponse { bool enabled = 1; }

// ── Auto-fix Loop Cap (KA-244 step 4) ──

// AutoFixLoopCappedViolation represents one
// pr_violation_fix_branch row whose loop_capped_at is set —
// the queue of operator-action items the convergence loop
// surfaced through StateCapHit comments.
message AutoFixLoopCappedViolation {
  string violation_id = 1;
  int32 pr_number = 2;
  string branch_name = 3;
  string pr_url = 4;
  string last_commit_sha = 5;
  int32 attempt_count = 6;
  google.protobuf.Timestamp last_applied_at = 7;
  google.protobuf.Timestamp loop_capped_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message ClearAutoFixLoopCapRequest {
  // ViolationID is the canonical evidence_records.id used by
  // the auto-fix dispatcher. Operators copy this from the
  // cap-hit PR comment OR from the
  // ListAutoFixLoopCappedViolations dashboard query.
  string violation_id = 1;

  // Reason is the operator's free-form note explaining why
  // the cap is being cleared (e.g. "hand-resolved review
  // comment ambiguity"). Audit-logged but does not affect
  // the clear semantics.
  string reason = 2;
}

message ClearAutoFixLoopCapResponse {
  // Cleared echoes the post-clear row state so the operator
  // sees confirmation in the gRPC reply (rather than a
  // separate Get round-trip).
  AutoFixLoopCappedViolation cleared = 1;
}

message ListAutoFixLoopCappedViolationsRequest {
  string org_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListAutoFixLoopCappedViolationsResponse {
  repeated AutoFixLoopCappedViolation violations = 1;
  int32 total = 2;
}

// StreamViolationLifecycleRequest opens a server-stream of
// per-violation lifecycle events for one PR. Auth: org member
// (same as ListViolations).
message StreamViolationLifecycleRequest {
  string org_id = 1;
  int64 pr_number = 2;
  // repo_id disambiguates when an org has multiple repos with
  // the same pr_number. Required — the convergence broker
  // partitions on (org_id, repo_id, pr_number) so the
  // subscriber sees only events for the specific PR.
  string repo_id = 3;
}

// ViolationLifecycleEvent fans out from the convergence
// comment-lifecycle write path. Mirrors the five lifecycle
// fields on EnrichedViolation so clients can apply each event
// verbatim onto their cached row.
message ViolationLifecycleEvent {
  string violation_id = 1;
  AutoFixLifecycleState state = 2;
  int32 attempt_count = 3;
  google.protobuf.Timestamp loop_capped_at = 4;
  string last_commit_sha = 5;
  string pr_url = 6;
  // emitted_at is the server-side wall-clock when the
  // convergence write fired; useful for client-side dedup
  // when re-opening a stream after a disconnect (apply only
  // events strictly newer than the last-seen).
  google.protobuf.Timestamp emitted_at = 7;

  // heartbeat marks a keepalive frame carrying NO state. A client
  // MUST drop it — and specifically must not let it advance the
  // dedup watermark or reset a reconnect ladder, since neither
  // says anything about whether the stream is delivering events.
  //
  // An ADDITIVE field rather than the oneof wrapper its siblings
  // use (PrChangeFrame, RepoChangeFrame, NotificationStreamFrame).
  // Those were designed with one; this message ships in a released
  // client, and wrapping it would change the type on the wire —
  // every deployed build would fail to decode every frame. A new
  // field is invisible to old clients, which is exactly the
  // property needed here.
  //
  // The cost is that the message is now a tagged union enforced by
  // convention rather than by the type system: when heartbeat is
  // true every other field is unset. The handler is the only
  // producer, and the client drops these before mapping, so the
  // invariant has exactly two enforcement points.
  bool heartbeat = 8;
}
message TriggerPRCanvasIndexRequest {
  string repo_id = 1;
  int64 pr_number = 2;
}

message TriggerPRCanvasIndexResponse {
  // accepted: a new canvas index run was enqueued by THIS call.
  bool accepted = 1;
  // state after the call: "serving" (graph already available — reload it),
  // "building" (a run is in flight — poll the graph until it serves).
  string state = 2;
}

message GetPRCanvasStateRequest {
  string repo_id = 1;
  int64 pr_number = 2;
}

message GetPRCanvasStateResponse {
  // "serving"     — graph available: load it.
  // "building"    — a run is in flight: poll the graph until it serves.
  // "buildable"   — no graph and no run in flight; nothing blocks a build.
  // "conflicted"  — the PR has merge conflicts: a build is impossible until
  //                 they are resolved (message says so).
  // "unavailable" — a build cannot be started (canvas serving disabled
  //                 platform-wide, no PR-Gate check for the PR yet, …);
  //                 message carries the server-authored reason.
  string state = 1;
  // Human-readable reason for conflicted/unavailable — rendered verbatim.
  string message = 2;
}

// ── PR change stream ──

message StreamPrChangesRequest {
  string org_id = 1;
}

// PrChangeFrame is one frame on the StreamPrChanges wire: either a real change or
// a droppable heartbeat. Mirrors RepoChangeFrame — an idle stream MUST still put a
// byte on the wire inside the smallest reverse-proxy idle window or the connection
// is dropped, and a PR channel is idle most of the time.
message PrChangeFrame {
  oneof payload {
    PrChange change = 1;
    PrChangeHeartbeat heartbeat = 2;
  }
}

// PrChangeHeartbeat is a keepalive frame the client drops on receipt.
message PrChangeHeartbeat {
  google.protobuf.Timestamp sent_at = 1;
}

// PrChangeReason says WHAT about the pull request moved, so a client can decide
// how much work to do.
enum PrChangeReason {
  PR_CHANGE_REASON_UNSPECIFIED = 0;
  // A pr_checks row's status moved: created, queued, in progress, finalized, or
  // reaped to error.
  PR_CHANGE_REASON_CHECK_STATUS_CHANGED = 1;
  // A check rewrote the PR's violation set, or an exception decision changed how
  // one renders. Distinct from a status move: the verdict can stay identical
  // while the findings under it change.
  PR_CHANGE_REASON_VIOLATIONS_UPDATED = 2;
  // GitHub reported the PR opened, merged or closed.
  PR_CHANGE_REASON_LIFECYCLE_CHANGED = 3;
  // The PR-branch canvas build advanced (pending → indexing → indexed →
  // evaluating → evaluated), or was reaped.
  PR_CHANGE_REASON_CANVAS_SCOPE_CHANGED = 4;
  // A GDPR erasure rewrote author identity across this org's checks. Carries no
  // repo and no PR number — see PrChange.
  PR_CHANGE_REASON_REDACTED = 5;
}

message PrChange {
  // Empty — with pr_number 0 — when the change is not scoped to a single pull
  // request. Today that is the erasure sweep, which acts on an org by AUTHOR and
  // so has no one PR or repo to name. A consumer MUST treat such a frame as
  // "re-read everything" rather than dropping it for failing an id filter.
  string repo_id = 1;
  int32 pr_number = 2;

  PrChangeReason reason = 3;

  // The new check or scope status where the publishing seam knew it, and empty
  // otherwise.
  //
  // Deliberately a string rather than an enum, which is the one place this wire
  // departs from RepoChange. The field carries EITHER a pr_checks status or a
  // deep-check scope status depending on `reason` — two disjoint value sets on one
  // field — so a single enum would have to merge two lifecycles that are unrelated
  // except in being carried here. Interpret it per `reason`, trust it only when
  // non-empty, and re-fetch anything derived regardless. That last rule is what
  // the invalidation-signal design requires anyway, so an unset status costs a
  // client nothing.
  string status = 4;

  google.protobuf.Timestamp occurred_at = 5;
}
