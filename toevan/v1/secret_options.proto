syntax = "proto3";

package toevan.v1;

option go_package = "github.com/toevan/api-server/gen/toevan/v1;toevanv1";

import "google/protobuf/descriptor.proto";

// Owner decision 62: a detected secret is masked wherever the app shows it.
//
// flagged_text marks a field that can carry a finding's flagged text: a line or snippet of a file, a diff or fix
// built from it, the AI's words about it, or a file's content. The server masks every message that reaches a
// client (internal/secretmask), and its ratchet reads THIS option: a message that has a marked field must be
// accounted for with the RPCs that return it and the handler that masks them, however the field is assigned.
// Mark every new field that can hold such text; the ratchet fails on a marked field nobody accounted for and
// on a field of a known flagged name that is not marked.
extend google.protobuf.FieldOptions {
  bool flagged_text = 52100;
}
