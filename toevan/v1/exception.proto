syntax = "proto3";

package toevan.v1;

option go_package = "github.com/toevan/api-server/gen/toevan/v1;toevanv1";

import "google/protobuf/timestamp.proto";

// ============================================
// ExceptionService — Exception Requests & Approval Chain
// ============================================

service ExceptionService {
  rpc CreateException(CreateExceptionRequest) returns (CreateExceptionResponse);
  rpc GetException(GetExceptionRequest) returns (GetExceptionResponse);
  rpc ListExceptions(ListExceptionsRequest) returns (ListExceptionsResponse);
  rpc GetExceptionMetrics(GetExceptionMetricsRequest) returns (GetExceptionMetricsResponse); // org-wide metric-strip aggregates
  // Reviewer-facing scope disclosure: which current findings (files +
  // per-file violation counts) this exception's coverage predicate spans.
  // Computed live from current evidence at call time — the same three
  // lineages the suppression views honor (anchored / path-subtree /
  // rule-scope) — so an approver weighs the ACTUAL blast radius, not the
  // creation-time snapshot.
  rpc GetExceptionImpact(GetExceptionImpactRequest) returns (GetExceptionImpactResponse);
  rpc ApproveException(ApproveExceptionRequest) returns (ApproveExceptionResponse);
  rpc RejectException(RejectExceptionRequest) returns (RejectExceptionResponse);
  rpc EscalateException(EscalateExceptionRequest) returns (EscalateExceptionResponse); // [NEW — audit fix]
  rpc RevokeException(RevokeExceptionRequest) returns (RevokeExceptionResponse);
}

// ── Core Types ──

message ExceptionRequest {
  string id = 1;
  string org_id = 2;
  string repo_id = 3;
  string repo_name = 4;
  string pr_id = 5;
  int32 pr_number = 6;

  // What rule is being waived
  string rule_id = 7;
  string rule_name = 8;
  string blueprint_id = 9;
  string blueprint_name = 10;

  // Who and why
  string requested_by_id = 11;
  string requested_by_name = 12;
  string justification = 13;            // business reason (min 20 chars)

  // Status
  ExceptionStatus status = 14;
  RiskLevel risk_level = 15;

  // Duration
  int32 duration_days = 16;             // total duration requested (30, 60, 90)
  int32 days_remaining = 17;            // computed: days until expiry
  google.protobuf.Timestamp expires_at = 18;

  // Approval chain
  repeated ApprovalStep approval_chain = 19;

  // Audit
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp resolved_at = 21;  // when fully approved or rejected

  // Path-scoped rows only: the repo-relative file/directory this exception
  // covers (subtree-prefix suppression). Empty for every other lineage.
  // rule_id is '*' on an all-rules path waiver.
  string path_pattern = 22;

  // True when the exception does not cover Security Essentials rules: a path exception for every rule
  // ('*') covers every rule except those, which are excepted for an exact rule on exact files only
  // (with an org admin's approval). The client shows scope_note beside it.
  bool excludes_security_essentials = 23;
  // Plain-language note on what the exception does not cover; empty when there is nothing to say.
  string scope_note = 24;
  // What the CALLING user may do with this exception now, decided by the server (the client shows an action only
  // when its flag is set; the server refuses it regardless). Approve and reject are the pending step's flag:
  // ApprovalStep.actionable_by_viewer. Set on reads (GetException, ListExceptions); false on a mutation's response,
  // after which the client re-reads. Additive.
  bool viewer_can_revoke = 25;
  bool viewer_can_escalate = 26;
  // What the exception covers NOW, decided by the server from the same facts the PR gate's coverage predicate reads
  // (status, expiry, the Security Essentials rule scope, and whether an org admin has approved). The client shows
  // this and never derives "covers nothing" itself. An unknown value reads as COVERS_NOTHING_YET. Additive.
  ExceptionCoverageState coverage_state = 27;
  // What the exception is scoped to, decided by the server from the facts of the row (where it was requested from, the
  // identity of that finding, the path it carries). The client states the scope in its own words and never derives it from
  // path_pattern alone. An unknown value says nothing about the scope. Additive.
  ExceptionScopeKind scope_kind = 28;
  // Where the finding an exception was requested from was flagged: its file and line, as the finding's row records them.
  // Empty and 0 for a path or a rule scope (no finding). For scope kind FINDING the exception covers that finding by its
  // identity, which stays covered when its line moves: the line is where it was flagged when it was requested. Additive.
  string finding_file = 29;
  int32 finding_line = 30;
}

// What an exception covers, by where it was requested from.
enum ExceptionScopeKind {
  EXCEPTION_SCOPE_KIND_UNSPECIFIED = 0;
  // Requested from a flagged finding: THAT FINDING, by its stable identity (rule, file, the finding itself). It stays
  // covered when the finding's line moves, and nothing else flagged in the file is waived (owner decision 52).
  EXCEPTION_SCOPE_KIND_FINDING = 1;
  // Requested from a flagged finding before finding identities existed, or for a finding with no identity: that rule at the
  // file and line the finding was flagged on, and nothing else. Such a row keeps what it was approved for.
  EXCEPTION_SCOPE_KIND_FINDING_AT_LINE = 2;
  // A path waiver (the guided flow or the canvas "exempt"): a file or a directory (path_pattern), one rule or every rule.
  EXCEPTION_SCOPE_KIND_PATH = 3;
  // A waiver of the rule across the repository (the guided flow).
  EXCEPTION_SCOPE_KIND_RULE_REPOSITORY = 4;
}

// Whether an exception is waiving findings now.
enum ExceptionCoverageState {
  EXCEPTION_COVERAGE_STATE_UNSPECIFIED = 0;
  // Waiting for its decision: nothing is waived yet.
  EXCEPTION_COVERAGE_STATE_AWAITING_DECISION = 1;
  // Approved and in force: it waives what it names.
  EXCEPTION_COVERAGE_STATE_COVERING = 2;
  // Approved, but a Security Essentials exception covers its finding only once an org admin has approved: nothing is
  // waived until then.
  EXCEPTION_COVERAGE_STATE_AWAITING_ADMIN = 3;
  // Approved, but by its scope it can never waive anything (a whole-repository waiver of a Security Essentials rule).
  EXCEPTION_COVERAGE_STATE_COVERS_NOTHING = 4;
  // Rejected, revoked, expired, or past its expiry: nothing is waived.
  EXCEPTION_COVERAGE_STATE_ENDED = 5;
}

enum ExceptionStatus {
  EXCEPTION_STATUS_UNSPECIFIED = 0;
  EXCEPTION_STATUS_PENDING = 1;
  EXCEPTION_STATUS_APPROVED = 2;
  EXCEPTION_STATUS_REJECTED = 3;
  EXCEPTION_STATUS_EXPIRED = 4;
  EXCEPTION_STATUS_REVOKED = 5;         // manually revoked before expiry
}

enum RiskLevel {
  RISK_LEVEL_UNSPECIFIED = 0;
  RISK_LEVEL_LOW = 1;
  RISK_LEVEL_MEDIUM = 2;
  RISK_LEVEL_HIGH = 3;
}

message ApprovalStep {
  string role = 1;                       // "Team Lead", "Compliance Officer", "CISO"
  string reviewer_id = 2;
  string reviewer_name = 3;
  ApprovalStepStatus status = 4;
  string comment = 5;                    // reviewer's comment (optional)
  google.protobuf.Timestamp reviewed_at = 6;
  // True on an org-admin step of a Security Essentials exception that distinct people could not fill: its
  // reviewer is the requester (no other admin exists) or already reviewed an earlier step. Recorded and
  // disclosed, and decided again at approval time. sod_reason says which.
  bool sod_not_met = 7;
  ExceptionSodReason sod_reason = 8;
  // True when the CALLING user can approve or reject this step now: it is the pending step they are assigned,
  // on a pending exception or the pending org admin step of an approved Security Essentials exception (the
  // re-approval that restores its coverage), whatever the exception's status. Set on reads (GetException,
  // ListExceptions); false on a mutation's response. Additive.
  bool actionable_by_viewer = 9;
}

// Why a separation-of-duties rule could not be met on an exception step (the names follow the policy side's
// PolicySodReason: no other non-author becomes no other non-requester).
enum ExceptionSodReason {
  EXCEPTION_SOD_REASON_UNSPECIFIED = 0;
  EXCEPTION_SOD_REASON_NO_OTHER_NON_REQUESTER = 1;
  EXCEPTION_SOD_REASON_NO_OTHER_DISTINCT_PERSON = 2;
}

enum ApprovalStepStatus {
  APPROVAL_STEP_UNSPECIFIED = 0;
  APPROVAL_STEP_WAITING = 1;            // previous step not yet approved
  APPROVAL_STEP_PENDING = 2;            // ready for this reviewer
  APPROVAL_STEP_APPROVED = 3;
  APPROVAL_STEP_REJECTED = 4;
  // A step an approval left behind when it completed the chain (an escalation's pending step): the
  // waiver was approved without it, and nobody can act on it. Additive, no version bump.
  APPROVAL_STEP_SUPERSEDED = 5;
}

// ── Requests/Responses ──

message CreateExceptionRequest {
  string org_id = 1;
  // ID of the `pr_violations` row this exception covers. Use for
  // PR Gate-rooted exception requests. Exactly one of
  // [violation_id] / [evidence_id] MUST be set; the server rejects
  // requests that set both or neither.
  string violation_id = 2;
  string justification = 3;
  int32 duration_days = 4;              // 30, 60, or 90

  // ID of the `evidence_records` row this exception covers. Use for
  // canvas-rooted exception requests (the canvas "Add to exceptions"
  // cart). The server resolves org / repo / rule / blueprint /
  // severity from the evidence row, so callers don't need to thread
  // those independently. Mutually exclusive with [violation_id] —
  // exactly one of the two MUST be set.
  //
  // Canvas-rooted exceptions land in the same `exceptions` table
  // with `pr_number` left NULL (the violation isn't PR-scoped). The
  // approval chain is computed from `risk_level` exactly the same
  // way as PR-rooted exceptions, so the downstream workflow is
  // unified.
  string evidence_id = 5;

  // Path-scoped root [NEW]: a waiver for one file or a whole directory
  // subtree on ONE repo — the canvas "exempt this file/directory"
  // false-positive mitigation. Mutually exclusive with the other roots:
  // exactly one of the four must be set. The server normalizes the path
  // (repo-relative, no trailing slash, no traversal), refuses the repository
  // root, and stores rule_id '*' when [PathScope.rule_id] is empty (every
  // rule under the path). Suppression is subtree-prefix: the path itself and
  // everything under it. Same risk/approval/audit pipeline as the other
  // roots; all-rules waivers enter at HIGH risk (strictest approval chain).
  PathScope path_scope = 7;

  // Rule-scoped root [NEW]: a PREEMPTIVE exception for one blueprint rule
  // across chosen repos — no originating violation or evidence row. Mutually
  // exclusive with [violation_id]/[evidence_id]: exactly one of the three
  // roots must be set. The server validates that the rule belongs to the
  // blueprint and that EVERY named repo is actively covered by it (repo-scope
  // adoption, or project-scope adoption on the repo's project), resolves the
  // rule's name and severity from the blueprint definition, and creates ONE
  // exception per repo through the same risk/approval pipeline as the other
  // roots. Repos that already carry a pending/approved exception for the rule
  // are skipped rather than duplicated.
  RuleScope rule_scope = 6;
}

message PathScope {
  string repo_id = 1;
  // Repo-relative file or directory path (no leading/trailing slash). A
  // directory covers its whole subtree.
  string path = 2;
  // Empty = every rule under the path (stored as the '*' sentinel).
  string rule_id = 3;
}

message RuleScope {
  string blueprint_id = 1;
  // Single-rule form, kept for wire compatibility. Servers union this with
  // [rule_ids]; new clients should send [rule_ids].
  string rule_id = 2;
  repeated string repo_ids = 3;
  // Rules to waive — the request fans out one exception per (rule, repo)
  // pair, minus skipped duplicates.
  repeated string rule_ids = 4;
}

message CreateExceptionResponse {
  ExceptionRequest exception = 1;
  // Every row a rule-scoped request created (one per repo, minus skipped
  // duplicates); [exception] carries the first for compatibility.
  repeated ExceptionRequest created = 2;
}

message GetExceptionRequest { string exception_id = 1; }
message GetExceptionResponse { ExceptionRequest exception = 1; }

message ListExceptionsRequest {
  string org_id = 1;
  string repo_id = 2;                    // optional
  ExceptionStatus status_filter = 3;     // optional
  string reviewer_id = 4;               // optional — show only exceptions awaiting this reviewer
  int32 limit = 5;
  int32 offset = 6;
}
message ListExceptionsResponse {
  repeated ExceptionRequest exceptions = 1;
  int32 total = 2;
  // Whose exceptions the list holds: every exception of the org (an org admin, compliance, the CISO), or only
  // those that concern the caller (a developer or team lead: ones they requested, were assigned or decided, or
  // await a step they are eligible for). total counts the same set. Additive.
  ExceptionListScope scope = 3;
}

// The set of exceptions a read covers for the calling user. Unknown values read as the narrow set.
enum ExceptionListScope {
  EXCEPTION_LIST_SCOPE_UNSPECIFIED = 0;
  EXCEPTION_LIST_SCOPE_ALL = 1;
  EXCEPTION_LIST_SCOPE_MINE = 2;
}

// Org-wide aggregate counts for the exceptions metric strip. Computed
// server-side over ALL of an org's exceptions (not the paginated list page), so
// the headline numbers are true totals rather than a per-page approximation.
message GetExceptionMetricsRequest { string org_id = 1; }
message ExceptionMetrics {
  int32 total = 1;
  int32 pending = 2;
  int32 approved = 3;
  int32 rejected = 4;
  // Denominator for the average: exceptions with a resolved_at and an
  // approved/rejected status. Zero means the average is not yet meaningful.
  int32 resolved_count = 5;
  // Mean review time (resolved_at - created_at) over the resolved exceptions,
  // in whole seconds. Zero when resolved_count is zero.
  int64 avg_review_seconds = 6;
}
message GetExceptionMetricsResponse {
  ExceptionMetrics metrics = 1;
  // Whose exceptions the numbers count (see ListExceptionsResponse.scope). Additive.
  ExceptionListScope scope = 2;
}

message ApproveExceptionRequest {
  string exception_id = 1;
  string reviewer_id = 2;
  string comment = 3;                    // optional
}
message ApproveExceptionResponse {
  bool success = 1;
  string error = 2;
  ExceptionRequest exception = 3;       // updated state
}

message RejectExceptionRequest {
  string exception_id = 1;
  string reviewer_id = 2;
  string reason = 3;                     // required
}
message RejectExceptionResponse {
  bool success = 1;
  string error = 2;
  ExceptionRequest exception = 3;
}

message RevokeExceptionRequest {
  string exception_id = 1;
  string revoked_by_id = 2;
  string reason = 3;
}
message RevokeExceptionResponse {
  bool success = 1;
  string error = 2;
}

// [NEW — audit fix: UI has escalateException() with no backing RPC]
enum EscalationRole {
  ESCALATION_ROLE_UNSPECIFIED = 0;
  ESCALATION_ROLE_COMPLIANCE_OFFICER = 1;
  ESCALATION_ROLE_CISO = 2;
}

message EscalateExceptionRequest {
  string exception_id = 1;
  string escalated_by_id = 2;
  string reason = 3;                     // why escalation is needed
  EscalationRole escalate_to_role = 4;
}
message EscalateExceptionResponse {
  bool success = 1;
  string error = 2;
  ExceptionRequest exception = 3;       // updated with new approval step
}
// ── Impact (reviewer-facing scope disclosure) ──

message GetExceptionImpactRequest {
  string exception_id = 1;
}

// One file the exception's coverage predicate currently spans.
message ExceptionImpactFile {
  string file_path = 1;
  int32 violation_count = 2;
}

message GetExceptionImpactResponse {
  // Total CURRENT violations covered by this exception's predicate
  // (open or already excepted — "what does this waiver span right now").
  int32 total_violations = 1;
  // Total distinct files spanned — the full count even when [files] is
  // capped, so the client can render "…and N more".
  int32 total_files = 2;
  // Path-sorted, capped server-side; [truncated] says the cap bit.
  repeated ExceptionImpactFile files = 3;
  bool truncated = 4;
}
