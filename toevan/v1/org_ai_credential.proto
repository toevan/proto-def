syntax = "proto3";

package toevan.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/toevan/api-server/gen/toevan/v1;toevanv1";

// OrgAICredentialService is the org-admin surface for bring-your-own-key AI
// (PRD_ORG_BYOK_MULTIPROVIDER_AI v2 §8): store a provider API key + endpoint,
// choose models, and control the BYOK config. Every RPC is gated org-admin +
// the FeatureBYOK entitlement. Credentials are envelope-encrypted at rest and
// NEVER echoed — responses carry key_last4 only, even to platform admins.
service OrgAICredentialService {
  // --- Credentials ---

  // SetCredential validates (egress policy + a live provider check) and
  // upserts the org's credential for one provider. Upsert semantics make
  // this the rotation RPC too: setting a new key for an existing provider
  // replaces it atomically.
  rpc SetCredential(SetOrgAICredentialRequest) returns (SetOrgAICredentialResponse);
  // ListCredentials returns metadata for every stored credential.
  rpc ListCredentials(ListOrgAICredentialsRequest) returns (ListOrgAICredentialsResponse);
  // DeleteCredential removes the credential (soft delete; the provider slot
  // becomes free immediately).
  rpc DeleteCredential(DeleteOrgAICredentialRequest) returns (DeleteOrgAICredentialResponse);
  // TestConnection re-validates the STORED credential against its endpoint
  // now — "is my URL / key / model still right" without rotating anything.
  rpc TestConnection(TestOrgAIConnectionRequest) returns (TestOrgAIConnectionResponse);

  // --- Config ---

  // GetAIConfig returns the org's BYOK configuration (defaults when never
  // configured).
  rpc GetAIConfig(GetOrgAIConfigRequest) returns (GetOrgAIConfigResponse);
  // UpdateAIConfig stores the org's BYOK configuration. Enabling requires a
  // stored credential for the preferred provider and an explicit standard
  // model id.
  rpc UpdateAIConfig(UpdateOrgAIConfigRequest) returns (UpdateOrgAIConfigResponse);
}

// OrgAICredential is the metadata view of a stored credential. The API key
// itself never appears in any response.
message OrgAICredential {
  // Provider id: openrouter | openai | openai_compatible | anthropic
  // (anthropic runs on the native Messages-API adapter with full prompt
  // caching).
  string provider = 1;
  // The effective endpoint this credential targets: the pinned preset URL,
  // or the admin-supplied base URL for openai_compatible.
  string base_url = 2;
  // Last 4 characters of the stored key, or "none" for keyless endpoints
  // (local model servers). Display only.
  string key_last4 = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message SetOrgAICredentialRequest {
  string org_id = 1;
  string provider = 2;
  // May be empty ONLY for openai_compatible (keyless local model servers).
  string api_key = 3;
  // REQUIRED for openai_compatible (egress-validated: SaaS deployments
  // reject private/loopback targets); must be empty for preset providers.
  string base_url = 4;
}

message SetOrgAICredentialResponse {
  OrgAICredential credential = 1;
  // True when the live provider check proved the key. False means the key
  // was stored unverified — see warning.
  bool validated = 2;
  // Human-readable caveat when validation was indeterminate (provider
  // rate-limited/5xx, endpoint without /models). Empty when validated.
  string warning = 3;
}

message ListOrgAICredentialsRequest {
  string org_id = 1;
}

message ListOrgAICredentialsResponse {
  repeated OrgAICredential credentials = 1;
}

message DeleteOrgAICredentialRequest {
  string org_id = 1;
  string provider = 2;
}

message DeleteOrgAICredentialResponse {}

message TestOrgAIConnectionRequest {
  string org_id = 1;
  string provider = 2;
}

message TestOrgAIConnectionResponse {
  bool ok = 1;
  // Caveat when the check was indeterminate; empty on a clean pass.
  string warning = 2;
  // Round-trip latency of the probe.
  int64 latency_ms = 3;
}

// OrgAIConfig is the org's BYOK configuration.
message OrgAIConfig {
  // Master switch: when true, this org's AI runs use its own credential and
  // bypass the plan's AI-operations metering (usage is still recorded).
  bool byok_enabled = 1;
  string preferred_provider = 2;
  // The org's model id, applied to EVERY BYOK use case (plan pass, fast
  // path, apply). One model, one knob. Required when enabling.
  string model = 3;
  reserved 4;
  reserved "model_fast";
  // Capability overrides for openai_compatible endpoints whose real support
  // the platform cannot know. Unset = conservative provider defaults.
  optional bool cap_content_blocks = 5;
  optional bool cap_response_format = 6;
  optional bool cap_json_schema = 7;
  // fallback_to_default | fail_closed — what happens when the org's key
  // fails auth mid-run.
  string fallback_policy = 8;
}

message GetOrgAIConfigRequest {
  string org_id = 1;
}

message GetOrgAIConfigResponse {
  OrgAIConfig config = 1;
}

message UpdateOrgAIConfigRequest {
  string org_id = 1;
  OrgAIConfig config = 2;
}

message UpdateOrgAIConfigResponse {
  OrgAIConfig config = 1;
}
