syntax = "proto3";

package korelink.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/kore-services/api-server/gen/korelink/v1;korelinkv1";

// ===================================================================
// ModerationService — the RESTRICTIVE axis of the account-attribute layer
// ===================================================================
//
// Moderation status is the opposite of an attribute tag: where a tag ADDS
// exposure/access, a moderation status RESTRICTS. It is a single lifecycle
// state per subject (not a set), and it OVERRIDES everything — tags, grants,
// and membership alike (PRD docs/architecture/PRD_ACCOUNT_TAGS.md §8: moderation
// deny is precedence rule #1).
//
// Two axes, enforced at two choke points:
//   - USER moderation follows the PERSON. A banned/suspended user is denied on
//     every authenticated RPC (except an appeal allowlist) at a central
//     interceptor — they cannot evade by switching or creating accounts.
//   - ACCOUNT moderation follows an ORG/account. A suspended/banned account is
//     unreachable, enforced in the orgauth resolver as precedence rule #1
//     (before grant/membership/tag).
//
// Only SUSPENDED and BANNED enforce (deny); FLAGGED is a non-enforcing internal
// watch marker; ACTIVE is the default. Every status change is platform-admin
// gated and written to the audit log in the same transaction — a moderation
// action carries legal/ToS weight and must be attributable.
service ModerationService {
  // SetUserModeration sets a user's moderation status with a reason. Upserts the
  // single row for the user; ACTIVE clears an existing restriction. Platform-admin
  // only; the change is audited in-transaction.
  rpc SetUserModeration(SetUserModerationRequest) returns (SetUserModerationResponse);

  // GetUserModeration reads a user's current status (ACTIVE when no row exists).
  rpc GetUserModeration(GetUserModerationRequest) returns (GetUserModerationResponse);

  // ListModeratedUsers enumerates users in a given status — the "who is banned"
  // operator query. Newest change first.
  rpc ListModeratedUsers(ListModeratedUsersRequest) returns (ListModeratedUsersResponse);

  // SetAccountModeration sets an account's moderation status with a reason.
  // Upserts; ACTIVE clears a restriction. Platform-admin only; audited in-tx.
  rpc SetAccountModeration(SetAccountModerationRequest) returns (SetAccountModerationResponse);

  // GetAccountModeration reads an account's current status (ACTIVE when no row).
  rpc GetAccountModeration(GetAccountModerationRequest) returns (GetAccountModerationResponse);

  // ListModeratedAccounts enumerates accounts in a given status. Newest first.
  rpc ListModeratedAccounts(ListModeratedAccountsRequest) returns (ListModeratedAccountsResponse);

  // SubmitModerationAppeal lets a RESTRICTED user appeal their OWN suspension or
  // ban. Unlike every other RPC here, it is NOT platform-admin gated — it is on
  // the moderation appeal allowlist (handlers.ModerationAppealRPCs) so the very
  // user the interceptor otherwise denies can still reach it. Strictly
  // own-account: the subject is the authenticated caller, never a request field,
  // so a caller can only ever appeal for themselves. Only a currently-restricted
  // user may appeal, and only ONE appeal may be open at a time; an operator
  // changing the user's status resolves the open appeal so the loop can repeat.
  rpc SubmitModerationAppeal(SubmitModerationAppealRequest) returns (SubmitModerationAppealResponse);

  // ListModerationAppeals is the OPERATOR queue: appeals currently awaiting
  // review, newest first, joined to the appellant's identity and the status
  // they are appealing so a reviewer needs no second lookup. Platform-admin
  // gated (unlike SubmitModerationAppeal above).
  //
  // Read-only by design: a reviewer ACTS through SetUserModeration, which
  // resolves the open appeal in the same transaction. There is deliberately no
  // "dismiss appeal" RPC — dismissing without a decision would leave the user
  // restricted with nothing recorded, and re-affirming the SAME status already
  // resolves the appeal.
  rpc ListModerationAppeals(ListModerationAppealsRequest) returns (ListModerationAppealsResponse);

  // SubmitAccountModerationAppeal lets an ORG ADMIN of a RESTRICTED account
  // appeal its suspension or ban — the ACCOUNT axis' twin of
  // SubmitModerationAppeal above, with one structural difference: the subject
  // (the account) is never the caller's own identity, so the request DOES
  // carry an account_id, and the server authorizes the caller as that
  // account's admin before accepting it. Unlike the user-axis appeal, this is
  // NOT on the moderation-interceptor's allowlist — a caller whose OWN user
  // account is separately restricted should resolve that first. Only a
  // currently-restricted account may appeal, and only ONE appeal may be open
  // at a time; an operator changing the account's status resolves the open
  // appeal so the loop can repeat.
  rpc SubmitAccountModerationAppeal(SubmitAccountModerationAppealRequest) returns (SubmitAccountModerationAppealResponse);

  // ListAccountModerationAppeals is the OPERATOR queue for account-axis
  // appeals — the twin of ListModerationAppeals. Platform-admin gated.
  // Read-only for the same reason: a reviewer acts through
  // SetAccountModeration, which resolves the open appeal in the same
  // transaction.
  rpc ListAccountModerationAppeals(ListAccountModerationAppealsRequest) returns (ListAccountModerationAppealsResponse);
}

// ModerationStatus is a single lifecycle state per subject.
//   ACTIVE    — default; no restriction.
//   FLAGGED   — internal watch marker; recorded, visible to staff, does NOT deny.
//   SUSPENDED — temporary deny (enforced).
//   BANNED    — permanent deny (enforced).
enum ModerationStatus {
  MODERATION_STATUS_UNSPECIFIED = 0;
  MODERATION_STATUS_ACTIVE = 1;
  MODERATION_STATUS_FLAGGED = 2;
  MODERATION_STATUS_SUSPENDED = 3;
  MODERATION_STATUS_BANNED = 4;
}

// UserModeration is the current moderation row for one user.
message UserModeration {
  string user_id = 1;
  ModerationStatus status = 2;
  // Required for a non-ACTIVE status; the operator's justification, audited.
  string reason = 3;
  // The platform staffer who set the current status.
  string moderated_by = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // When a SUSPENSION lapses. Only ever set alongside SUSPENDED — a ban is
  // permanent and ACTIVE/FLAGGED carry no window. Unset means an open-ended
  // suspension the operator must clear by hand.
  //
  // Expiry is COMPUTED AT READ, never reaped: once this instant passes, every
  // enforcement read reports the user ACTIVE while this row is retained as the
  // record of what happened. So a row may still read SUSPENDED here with a
  // suspended_until in the past — that is a LAPSED suspension, not a live one,
  // and operator surfaces should render it as such.
  google.protobuf.Timestamp suspended_until = 7;
}

// AccountModeration is the current moderation row for one account.
message AccountModeration {
  string account_id = 1;
  ModerationStatus status = 2;
  string reason = 3;
  string moderated_by = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // When a SUSPENSION lapses — the account-axis twin of
  // UserModeration.suspended_until, with identical semantics: only ever set
  // alongside SUSPENDED, computed at read and never reaped, so a row may still
  // read SUSPENDED with this in the past (a LAPSED suspension, not a live one).
  google.protobuf.Timestamp suspended_until = 7;
}

message SetUserModerationRequest {
  string user_id = 1;
  ModerationStatus status = 2;
  // Required (non-empty after trimming) for any non-ACTIVE status; lands verbatim
  // in the audit row. ACTIVE (clearing a restriction) may omit it.
  string reason = 3;
  // Optional, and ONLY meaningful with SUSPENDED: when the suspension lapses on
  // its own. Must be in the future. Rejected with any other status (a ban is
  // permanent; active/flagged have nothing to time-box), and omitting it means
  // an open-ended suspension the operator clears by hand.
  google.protobuf.Timestamp suspended_until = 4;
}

message SetUserModerationResponse {
  UserModeration moderation = 1;
}

message GetUserModerationRequest {
  string user_id = 1;
}

message GetUserModerationResponse {
  UserModeration moderation = 1;
}

message ListModeratedUsersRequest {
  // Filter to this status. UNSPECIFIED ⇒ every non-ACTIVE row.
  ModerationStatus status = 1;
  // Page size; <= 0 or > 200 ⇒ 50.
  int32 limit = 2;
}

message ListModeratedUsersResponse {
  repeated UserModeration users = 1;
}

message SetAccountModerationRequest {
  string account_id = 1;
  ModerationStatus status = 2;
  string reason = 3;
  // Optional, and ONLY meaningful with SUSPENDED: when the suspension lapses on
  // its own. Must be in the future. Same rules as the user axis.
  google.protobuf.Timestamp suspended_until = 4;
}

message SetAccountModerationResponse {
  AccountModeration moderation = 1;
}

message GetAccountModerationRequest {
  string account_id = 1;
}

message GetAccountModerationResponse {
  AccountModeration moderation = 1;
}

message ListModeratedAccountsRequest {
  ModerationStatus status = 1;
  int32 limit = 2;
}

message ListModeratedAccountsResponse {
  repeated AccountModeration accounts = 1;
}

// ModerationAppeal is a user's own appeal against their restriction — the lean
// shape the appealing user's client needs back. Carries no reviewer/operator
// fields: a self-submission needs none, and the appeal's disposition surfaces
// through the user's moderation status changing, not a field here.
message ModerationAppeal {
  string id = 1;
  // The user's appeal text, echoed back so the client can confirm what was sent.
  string message = 2;
  google.protobuf.Timestamp created_at = 3;
}

message SubmitModerationAppealRequest {
  // The appeal text. Required, non-empty after trimming. The subject is the
  // authenticated caller — there is deliberately NO user id field to spoof.
  string message = 1;
}

message SubmitModerationAppealResponse {
  ModerationAppeal appeal = 1;
}

// ModerationAppealSummary is one row of the operator review queue: the appeal
// plus everything a reviewer needs to decide without a second lookup — who is
// appealing, and the restriction they are appealing against.
message ModerationAppealSummary {
  string id = 1;
  string user_id = 2;
  // Appellant identity, joined from users.
  string user_email = 3;
  string user_name = 4;
  // The appeal text, verbatim.
  string message = 5;
  // The restriction being appealed, as it stands NOW (a reviewer must decide
  // against the current state, not the state at submission time).
  ModerationStatus current_status = 6;
  string current_reason = 7;
  // Set when the current status is a time-boxed suspension; see UserModeration.
  google.protobuf.Timestamp current_suspended_until = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ListModerationAppealsRequest {
  // Page size; <= 0 or > 200 ⇒ 50.
  int32 limit = 1;
}

message ListModerationAppealsResponse {
  repeated ModerationAppealSummary appeals = 1;
}

// AccountModerationAppeal is the lean shape returned to the submitting admin —
// the account axis' twin of ModerationAppeal.
message AccountModerationAppeal {
  string id = 1;
  string account_id = 2;
  // The submitted appeal text, echoed back so the client can confirm what was
  // sent.
  string message = 3;
  google.protobuf.Timestamp created_at = 4;
}

message SubmitAccountModerationAppealRequest {
  // Which account this appeal is for. Required — unlike the user-axis appeal,
  // the subject is never the caller's own identity, so it cannot be inferred
  // from auth claims.
  string account_id = 1;
  // The appeal text. Required, non-empty after trimming.
  string message = 2;
}

message SubmitAccountModerationAppealResponse {
  AccountModerationAppeal appeal = 1;
}

// AccountModerationAppealSummary is one row of the operator review queue for
// account-axis appeals — the twin of ModerationAppealSummary, extended with
// the SUBMITTING ADMIN's identity (subject and submitter are different
// people on this axis, unlike the user-axis appeal).
message AccountModerationAppealSummary {
  string id = 1;
  string account_id = 2;
  // The restricted account's own identity, joined from accounts.
  string account_name = 3;
  string account_handle = 4;
  // The admin who submitted the appeal on the account's behalf.
  string submitted_by_user_id = 5;
  string submitted_by_name = 6;
  string submitted_by_email = 7;
  // The appeal text, verbatim.
  string message = 8;
  // The restriction being appealed, as it stands NOW (a reviewer must decide
  // against the current state, not the state at submission time).
  ModerationStatus current_status = 9;
  string current_reason = 10;
  // Set when the current status is a time-boxed suspension; see AccountModeration.
  google.protobuf.Timestamp current_suspended_until = 11;
  google.protobuf.Timestamp created_at = 12;
}

message ListAccountModerationAppealsRequest {
  // Page size; <= 0 or > 200 ⇒ 50.
  int32 limit = 1;
}

message ListAccountModerationAppealsResponse {
  repeated AccountModerationAppealSummary appeals = 1;
}
