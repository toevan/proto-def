syntax = "proto3";

package korelink.v1;

option go_package = "github.com/kore-services/api-server/gen/korelink/v1;korelinkv1";

import "google/protobuf/timestamp.proto";

// ============================================
// DashboardService — Aggregated Metrics for UI
// ============================================

service DashboardService {
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);
  rpc GetAttentionItems(GetAttentionItemsRequest) returns (AttentionItemsResponse);
  rpc GetCompliancePosture(GetCompliancePostureRequest) returns (GetCompliancePostureResponse);

  // Compliance checklist CRUD (HIPAA §164.308 administrative safeguards)
  rpc UpsertChecklistItem(UpsertChecklistItemRequest) returns (ChecklistItem);
  rpc CompleteChecklistItem(CompleteChecklistItemRequest) returns (ChecklistItem);
  rpc ListChecklist(ListChecklistRequest) returns (ListChecklistResponse);
  rpc ListChecklistByFramework(ListChecklistByFrameworkRequest) returns (ListChecklistResponse);
}

// ── Response Types ──

message GetDashboardResponse {
  string org_id = 1;

  // Metric cards
  int32 repos_governed = 2;
  int32 prs_checked_today = 3;
  int32 prs_passed_today = 4;
  int32 prs_blocked_today = 5;
  float compliance_rate = 6;             // 0.0–1.0
  // DEPRECATED — always 0. Was "change vs last week", computed from a 7-day
  // evidence window whose denominator counted gap rows and whose previous
  // window was empty for young orgs: a delta the org's own pages could not
  // reproduce. No history table exists to compute an honest one; a metric
  // that cannot be recomputed from visible data does not ship.
  float compliance_rate_delta = 7 [deprecated = true];
  int32 open_violations = 8;
  // DEPRECATED — always 0. Was "change vs yesterday" over all-time
  // pr_violations, a different id space than open_violations now reports.
  int32 open_violations_delta = 9 [deprecated = true];

  // Recent PRs (last 5)
  repeated RecentPR recent_prs = 10;

  // Onboarding progress
  OnboardingProgress onboarding = 11;

  // ── Truthful-metrics companions (2026-07-30) ──
  //
  // Every dashboard number must be reconcilable against the page that owns
  // it. open_violations is SUM(repositories.violation_count) under the SAME
  // predicate the Repositories page sums — the two surfaces cannot disagree.
  // compliance_rate is passed/(passed+violation) over evidence_records,
  // org-wide, the same formula the per-repo cards use — never a windowed
  // variant those cards cannot reproduce.

  // Repos with violation_count > 0, same predicate as open_violations —
  // equals the Repositories page's warning + critical counts.
  int32 repos_with_violations = 12;
  // The numerator and denominator behind compliance_rate, so the client can
  // say "X of Y checks passing" instead of a bare percentage.
  int32 compliance_passed = 13;
  int32 compliance_evaluated = 14;
}

message RecentPR {
  string pr_id = 1;
  string repo_name = 2;
  int32 pr_number = 3;
  string title = 4;
  RecentPRStatus status = 5;
  int32 violation_count = 6;
  google.protobuf.Timestamp checked_at = 7;
}

enum RecentPRStatus {
  RECENT_PR_STATUS_UNSPECIFIED = 0;
  RECENT_PR_STATUS_PASSED = 1;
  RECENT_PR_STATUS_BLOCKED = 2;
  RECENT_PR_STATUS_WARNING = 3;
  RECENT_PR_STATUS_ERROR = 4;
}

message OnboardingProgress {
  bool github_connected = 1;
  bool project_created = 2;
  bool repo_added = 3;
  bool blueprint_configured = 4;
  bool first_scan_completed = 5;
  bool dismissed = 6;
}

message AttentionItemsResponse {
  repeated AttentionItem items = 1;
}

message AttentionItem {
  AttentionItemType type = 1;
  string title = 2;
  string description = 3;
  AttentionSeverity severity = 4;
  string action_url = 5;                 // deep link in the UI
  string entity_id = 6;                  // ID of the related entity
  google.protobuf.Timestamp created_at = 7;
}

enum AttentionItemType {
  ATTENTION_ITEM_TYPE_UNSPECIFIED = 0;
  ATTENTION_ITEM_TYPE_VIOLATION = 1;
  ATTENTION_ITEM_TYPE_EXCEPTION_PENDING = 2;
  ATTENTION_ITEM_TYPE_INDEX_FAILED = 3;
  ATTENTION_ITEM_TYPE_BLUEPRINT_UPDATE = 4;
  ATTENTION_ITEM_TYPE_COVERAGE_DROP = 5;
  ATTENTION_ITEM_TYPE_VULNERABILITY = 6;
  ATTENTION_ITEM_TYPE_IAC_VIOLATION = 7;
}

enum AttentionSeverity {
  ATTENTION_SEVERITY_UNSPECIFIED = 0;
  ATTENTION_SEVERITY_CRITICAL = 1;
  ATTENTION_SEVERITY_HIGH = 2;
  ATTENTION_SEVERITY_MEDIUM = 3;
  ATTENTION_SEVERITY_LOW = 4;
}

// ── Compliance Posture ──

message CompliancePosture {
  string framework = 1;
  int32 total = 2;
  int32 completed = 3;
  int32 pending = 4;
  int32 overdue = 5;
  double coverage_percent = 6;
}

message GetCompliancePostureResponse {
  repeated CompliancePosture postures = 1;
}

// ── Compliance Checklist ──

message ChecklistItem {
  string id = 1;
  string org_id = 2;
  string framework = 3;
  string control_id = 4;
  string title = 5;
  string description = 6;
  string status = 7;                     // pending, completed
  google.protobuf.Timestamp completed_at = 8;
  string completed_by = 9;
  string due_date = 10;                  // ISO date string
  string notes = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

// ── Requests ──

message GetDashboardRequest { string org_id = 1; }
message GetAttentionItemsRequest {
  string org_id = 1;
  int32 limit = 2;
}
message GetCompliancePostureRequest { string org_id = 1; }

message UpsertChecklistItemRequest {
  string org_id = 1;
  string framework = 2;
  string control_id = 3;
  string title = 4;
  string description = 5;
  string status = 6;
  string due_date = 7;                   // ISO date string
  string notes = 8;
}

message CompleteChecklistItemRequest {
  string id = 1;
}

message ListChecklistRequest { string org_id = 1; }
message ListChecklistByFrameworkRequest {
  string org_id = 1;
  string framework = 2;
}

message ListChecklistResponse {
  repeated ChecklistItem items = 1;
}
