syntax = "proto3";

package korelink.v1;

option go_package = "github.com/kore-services/api-server/gen/korelink/v1;korelinkv1";

import "google/protobuf/timestamp.proto";
import "korelink/v1/types.proto";
import "korelink/v1/agent.proto";

// ============================================
// BuildService — Code Generation, Build Orchestration, Previews
// ============================================

service BuildService {
  // AI Code Generation
  rpc GenerateCode(GenerateCodeRequest) returns (GenerateCodeResult);

  // Build orchestration
  rpc StartBuild(StartBuildRequest) returns (StartBuildReply);
  rpc ApproveBuildPlan(ApprovePlanRequest) returns (ApprovePlanReply);
  rpc RejectBuildPlan(RejectPlanRequest) returns (RejectPlanReply);
  rpc GetBuildPlan(GetBuildPlanRequest) returns (BuildPlanReply);
  rpc GetBuildStepStatus(GetStepRequest) returns (BuildStepReply);
  rpc StreamBuildProgress(BuildProgressRequest) returns (stream BuildProgressUpdate);

  // Previews & Testing
  rpc GetPagePreview(GetPreviewRequest) returns (GetPreviewReply);
  rpc RebuildPagePreview(RebuildPreviewRequest) returns (RebuildPreviewReply);
  rpc RunE2ETest(E2ETestRequest) returns (E2ETestReply);
  rpc GetFullAppPreview(GetFullAppRequest) returns (GetFullAppReply);

  // Canvas streaming (Digital Twin)
  rpc StreamCanvasUpdates(StreamCanvasRequest) returns (stream CanvasUpdate);

  // Canvas graph snapshot (static load for existing repos)
  rpc GetRepositoryGraph(GetRepositoryGraphRequest) returns (GetRepositoryGraphReply);

  // Source code viewer — serves file content for selected canvas nodes
  rpc GetFileContent(GetFileContentRequest) returns (GetFileContentReply);

  // Violation detail — lazy-loaded "Learn more" payload for a single
  // violation. Returns the offending code snippet, an AI-generated fix
  // suggestion, and effort/confidence metadata. Called by the client when
  // the violation detail sheet opens — NOT eagerly on canvas load, because
  // AI fix generation is too expensive to fan out across every open
  // violation on every snapshot request. Result is cached per violation_id
  // so repeat opens of the same sheet are free.
  rpc GetViolationDetail(GetViolationDetailRequest) returns (GetViolationDetailReply);

  // StreamViolationDetail is the progressive-render variant of
  // GetViolationDetail. The server emits a sequence of partial
  // updates as Stage 3 plans the fix: header (cheap identity
  // fields, ~150ms), per-rule validation results as they resolve,
  // the typed Fix ChangeSet, then the footer
  // (confidence/scope/effort estimate/resolves[]). Lets the client
  // render the sheet container immediately and reveal the plan
  // preview the moment Stage 3 lands — perceived latency drops
  // from 30s → ~3s to first visible header.
  //
  // Cache-hit short-circuit: when the violation_id (or signature)
  // is in Redis, the server emits HEADER + VALIDATION + CHANGE_SET
  // + FOOTER as a single non-streaming burst. Client renders
  // identically; the streaming RPC is correct for both paths.
  //
  // The unary GetViolationDetail RPC remains supported for
  // clients that haven't adopted streaming yet — both RPCs share
  // the same Service.GetDetail / Service.computeDetailFromRow
  // backend, so behavior is identical apart from the wire shape.
  rpc StreamViolationDetail(StreamViolationDetailRequest) returns (stream ViolationDetailUpdate);

  // WarmViolationDetail is a fire-and-forget pre-compute trigger.
  // Returns immediately after either confirming the result is
  // already in Redis (cache_hit=true) OR launching a background
  // goroutine to compute it (cache_hit=false). Designed to be
  // called speculatively from client UX events (hover dwell,
  // scroll-into-viewport dwell) so by the time the user clicks a
  // violation card, the result is already in the cache.
  //
  // Bounds AI cost by user attention rather than violation count
  // — eager pre-compute on every indexed violation would be
  // prohibitive at $0.13/fix × hundreds of violations per repo.
  //
  // Hardening: same auth as GetViolationDetail (capability via
  // violation_id); per-user rate limit on the gRPC interceptor;
  // single-flight via Redis SETNX so concurrent warms for the
  // same violation_id trigger ONE compute, not N.
  rpc WarmViolationDetail(WarmViolationDetailRequest) returns (WarmViolationDetailReply);

  // ApplyFixViaAgent dispatches the canvas-detail Apply Fix action
  // through the agentloop fix_apply agent (KA-242) and streams the
  // agent's progress back to the caller. The agent owns the full
  // lifecycle: branch off origin/main, execute the planned ops,
  // re-run validators via tools, push, open the PR, and emit an
  // [AgentProgressUpdate] per step. The agent uses the
  // [change_set] field as a hint and is free to adapt if the
  // workspace has drifted since the plan was generated.
  //
  // The stream emits [AgentProgressUpdate] frames as the agent
  // transitions phases (op-apply start/end, run_validators result,
  // branch pushed, PR opened). The terminal frame carries
  // `completed = true` along with `status = AGENT_RUN_STATUS_COMPLETED`
  // (success — PR URL and metadata available via [GetAgentRun] or
  // [ListAgentRuns]) or `status = AGENT_RUN_STATUS_FAILED` (failure
  // — `message` carries the operator-visible reason).
  //
  // Idempotency: if the agent has already opened a PR for the
  // (violation_id, change_set signature) within the dedup window,
  // the existing run's progress replays through this stream and no
  // duplicate PR is opened.
  rpc ApplyFixViaAgent(ApplyFixViaAgentRequest) returns (stream AgentProgressUpdate);

  // DispatchApplyFix is the unary counterpart to
  // [ApplyFixViaAgent]. Splits dispatch from observation:
  // returns immediately with the agent run_id, and the
  // caller subscribes to lifecycle events via
  // [AgentService.StreamAgentRunProgress] (multiplexed with
  // any other in-flight runs the panel is tracking).
  //
  // Request shape mirrors [ApplyFixViaAgentRequest] verbatim
  // (same violation_id + optional change_set + optional
  // branch_name); the agent's dispatch path is identical —
  // only the observation path differs. Existing
  // [ApplyFixViaAgent] callers keep streaming; new clients
  // (canvas panel BLoC) prefer this + multiplexed observe.
  //
  // Idempotency: the runner's branch-name dedup
  // (pr_violation_fix_branches.violation_id unique) still
  // applies — two concurrent DispatchApplyFix calls on the
  // same violation produce two agent_runs rows, but the
  // second's runner observes the first's branch and short-
  // circuits without opening a duplicate PR.
  rpc DispatchApplyFix(DispatchApplyFixRequest) returns (DispatchApplyFixResponse);

  // What-If simulation — evaluate impact of hypothetical architectural changes
  rpc EvaluateWhatIf(EvaluateWhatIfRequest) returns (EvaluateWhatIfReply);

  // AI node analysis — contextual AI analysis for a selected canvas node
  rpc AnalyzeNode(AnalyzeNodeRequest) returns (AnalyzeNodeResponse);

  // Canvas chat history — persisted AI conversations per repository
  rpc GetCanvasChatHistory(GetCanvasChatHistoryRequest) returns (GetCanvasChatHistoryReply);
  rpc ClearCanvasChatHistory(ClearCanvasChatHistoryRequest) returns (ClearCanvasChatHistoryReply);
}

// ── AI Code Generation ──

message GenerateCodeRequest {
  string project_id = 1;
  string prompt = 2;
  string target_file_path = 3;
  string language = 4;
  string blueprint_id = 5;
  repeated Symbol context_symbols = 6;
}

message GenerateCodeResult {
  string request_id = 1;
  string generated_code = 2;
  bool passed_validation = 3;
  repeated Violation violations = 4;
  int32 attempt_number = 5;
  int32 max_attempts = 6;
}

// ── Canvas Sync (Digital Twin) ──

message CanvasNode {
  string id = 1;
  string symbol_id = 2;
  string label = 3;
  string kind = 4;
  string layer = 5;
  double x = 6;
  double y = 7;
  map<string, string> style = 8;
  string file_path = 9;                   // source file path for click-to-navigate
  NodeMetrics metrics = 10;               // computed metrics for the detail panel
}

// NodeMetrics carries structured detail data for the node info panel.
message NodeMetrics {
  int32 line_count = 1;
  repeated string method_names = 2;       // methods/functions in this symbol's file
  repeated NodeDependency dependencies = 3; // outgoing: this node depends on these
  repeated NodeDependency dependents = 4;   // incoming: these nodes depend on this
  repeated NodeDataFlow data_flows = 5;     // data flow connections (PII/PHI/PAN)
}

// NodeDependency describes a single dependency relationship for the detail panel.
message NodeDependency {
  string node_id = 1;         // target/source canvas node ID
  string label = 2;           // display name (e.g., "PaymentService")
  string kind = 3;            // "imports", "extends", "implements", "calls"
}

// NodeDataFlow describes a data flow connection for the detail panel.
message NodeDataFlow {
  string node_id = 1;         // connected node ID
  string label = 2;           // display name (e.g., "Payment")
  string tag = 3;             // data flow tag (e.g., "PAN", "PII")
  string direction = 4;       // "inbound" or "outbound"
}

message CanvasEdge {
  string id = 1;
  string source_node_id = 2;
  string target_node_id = 3;
  string kind = 4;
  bool   is_violation = 5;
  // Optional short label (e.g., "GDPR Art.32") rendered near the edge.
  // Used by synthetic violation-flow edges to cite the breaching rule.
  string label = 6;
  // Rule ID backing a synthetic violation edge (kind = "violation_flow").
  // Empty for structural dependency edges.
  string rule_id = 7;
}

message CanvasUpdate {
  string project_id = 1;
  repeated CanvasNode nodes = 2;
  repeated CanvasEdge edges = 3;
  google.protobuf.Timestamp timestamp = 4;

  // Extensions for richer real-time updates
  repeated ViolationSummary violation_updates = 5;
  repeated FileTreeNode file_tree_updates = 6;
  GraphMetrics metrics = 7;
  CanvasUpdateType update_type = 8;

  // Source context — which entry point produced this update
  string repo_id = 9;
  string pr_number = 10;
}

enum CanvasUpdateType {
  CANVAS_UPDATE_FULL = 0;
  CANVAS_UPDATE_INCREMENTAL = 1;
  CANVAS_UPDATE_LAYOUT = 2;
}

enum CanvasView {
  CANVAS_VIEW_ARCHITECTURE = 0;    // full graph — all nodes, all edges (default)
  CANVAS_VIEW_DEPENDENCIES = 1;    // structural edges only, no violation highlighting
  CANVAS_VIEW_DATA_FLOW = 2;       // nodes with data-flow tags (PII/PAN/PHI/CDE) and their connections
  CANVAS_VIEW_VIOLATIONS = 3;      // violation edges and the nodes they connect
  CANVAS_VIEW_DIFF = 4;            // changed files only (requires base_ref/head_ref)
}

message StreamCanvasRequest {
  string repo_id = 1;          // open canvas from a repo
  string pr_number = 2;        // open canvas from a PR (diff view)
  CanvasView view = 3;
}

// ── GetRepositoryGraph ──

message GetRepositoryGraphRequest {
  string repo_id = 1;
  CanvasView view = 2;
  string pr_number = 3;     // optional: for diff view
  string base_ref = 4;      // optional: for diff view
  string head_ref = 5;      // optional: for diff view
  bool include_tests = 6;   // include test file symbols (default false)
}

message GetRepositoryGraphReply {
  repeated CanvasNode nodes = 1;
  repeated CanvasEdge edges = 2;
  repeated FileTreeNode file_tree = 3;
  repeated ViolationSummary violations = 4;
  GraphMetrics metrics = 5;
  repeated CanvasCluster clusters = 6;     // layer groupings for visual clustering
  repeated SuggestedAction suggested_actions = 7; // contextual quick actions for the chat panel
  repeated FileViolation file_violations = 8;     // file-level violations not attached to any node
}

// SuggestedAction is a contextual quick action derived from the repo's
// violations and architecture. The client renders these as tappable chips
// that trigger an AnalyzeNode call with the pre-filled question.
message SuggestedAction {
  string label = 1;          // display text (e.g., "Fix PII violation")
  string question = 2;       // pre-filled question for AnalyzeNode RPC
  string node_id = 3;        // optional: target node (empty = repo-level)
  string category = 4;       // "fix", "analyze", "refactor"
  ViolationSeverity severity = 5; // visual priority indicator
}

// CanvasCluster represents a visual grouping of nodes by architectural layer.
// The client renders a labeled bounding box around each cluster.
message CanvasCluster {
  string layer = 1;           // layer ID (e.g., "presentation", "domain")
  string label = 2;           // display label (e.g., "Presentation")
  double x = 3;               // top-left X of bounding box
  double y = 4;               // top-left Y of bounding box
  double width = 5;           // bounding box width
  double height = 6;          // bounding box height
  int32 count = 7;            // number of nodes in this cluster
}

message FileTreeNode {
  string name = 1;
  string path = 2;
  bool is_directory = 3;
  int32 line_count = 4;
  int32 violation_count = 5;
  string linked_node_id = 6;
  repeated FileTreeNode children = 7;
  repeated string linked_node_ids = 8; // all canvas node IDs in this file
}

enum ViolationCategory {
  VIOLATION_CATEGORY_STRUCTURAL = 0;   // layer boundary violations
  VIOLATION_CATEGORY_SECURITY = 1;     // secrets, weak crypto, encryption
  VIOLATION_CATEGORY_COMPLIANCE = 2;   // data flow, deletion, breach notification
  VIOLATION_CATEGORY_DATA_FLOW = 3;    // PII/PHI/PAN data propagation
}

message ViolationSummary {
  string node_id = 1;
  int32 violation_count = 2;
  ViolationSeverity most_severe = 3;   // reused from types.proto
  repeated string violation_ids = 4;
  repeated NodeViolation details = 5;
}

// NodeViolation represents a single violation attached to a canvas node.
//
// Fields 1-10 are the compact card shape. Fields 11+ power the violation
// detail sheet — see FileViolation for the identical shape used when a
// violation has no architectural node.
message NodeViolation {
  string rule_id = 1;
  string message = 2;                  // short card text; today mirrors rule_name for backward compat
  ViolationSeverity severity = 3;      // reused from types.proto
  ViolationCategory category = 4;
  string file_path = 5;
  int32 line = 6;
  // Optional target endpoint — the other side of a relationship violation
  // (e.g., the service an unauthorized caller invokes). Clients use these
  // to draw dashed violation-flow edges between source and target nodes.
  string target_file = 7;
  int32 target_line = 8;
  string target_symbol = 9;
  // Short citation label (e.g., "GDPR Art.32"). Rendered near the edge/badge.
  string label = 10;

  // Human-readable rule title, e.g. "GDPR breach-notification handler required".
  // Distinct from rule_id ("breach-notification-gdpr"). Falls back to rule_id
  // on the client when empty.
  string rule_name = 11;

  // Long-form explanation — the "why this fails" paragraph. Sourced from the
  // blueprint rule's description. `message` remains the short card form;
  // `explanation` is rendered in the violation detail sheet.
  string explanation = 12;

  // Inclusive end line for multi-line violations. Zero/unset means single
  // line (the UI renders only `line`). Populated for detectors that can
  // emit a span (AST-backed rules covering a function/class body, etc.);
  // left zero for detectors that only have point data (secrets, IaC).
  int32 end_line = 13;

  // Deep link to the rule's documentation (blueprint rule page, compliance
  // spec anchor, regulation text). Opened by the client's "Learn more"
  // action. Empty when the blueprint author did not supply one.
  string docs_url = 18;

  // Stable violation ID for cross-surface linking (e.g. PR Gate ↔ Canvas).
  // Server populates with the evidence-row UUID; clients treat as opaque.
  string violation_id = 19;

  // Phase 2b fields — reserved to lock the wire layout. Do not reuse these
  // numbers; they map 1:1 to the client's violation detail sheet:
  //   14 string current_code          — extracted offending snippet
  //   15 string suggested_fix         — AI-generated replacement
  //   16 int32  estimated_fix_minutes — AI fix effort estimate
  //   17 float  confidence            — AI fix confidence 0.0–1.0
  // These ride on a future lazy GetViolationDetail(violation_id) RPC rather
  // than this list response, so a canvas load does not trigger per-violation
  // AI fix generation.
  reserved 14, 15, 16, 17;
}

// FileViolation represents a violation on a file with no architectural node.
// Rendered separately from the graph (e.g., in a violations list panel).
// Field numbers and semantics mirror NodeViolation — see above for field docs.
message FileViolation {
  string rule_id = 1;
  string message = 2;
  ViolationSeverity severity = 3;
  ViolationCategory category = 4;
  string file_path = 5;
  int32 line = 6;
  string target_file = 7;
  int32 target_line = 8;
  string target_symbol = 9;
  string label = 10;

  string rule_name = 11;
  string explanation = 12;
  int32 end_line = 13;
  string docs_url = 18;
  string violation_id = 19;

  reserved 14, 15, 16, 17;
}

message GraphMetrics {
  int32 total_symbols = 1;
  int32 total_edges = 2;
  int32 total_layers = 3;
  int32 total_violations = 4;
  repeated ActiveBlueprint active_blueprints = 5;
}

message ActiveBlueprint {
  string id = 1;
  string name = 2;
  bool is_active = 3;
}

// ── Build Orchestration ──

message StartBuildRequest {
  string project_id = 1;
  string project_name = 2;
  string user_message = 3;
  string blueprint_name = 4;
  string blueprint_rules = 5;
  repeated string languages = 6;
  bool tdd_enabled = 7;
  string framework_version = 8; // optional: target framework version (e.g. "3.41.4" for Flutter)
}

message StartBuildReply {
  string plan_id = 1;
  int32 total_steps = 2;
  string error = 3;
  repeated BuildStepProto steps = 4;
  string status = 5;
}

message ApprovePlanRequest {
  string plan_id = 1;
  string project_id = 2;
  repeated PlanStepUpdate updated_steps = 3;
}

message PlanStepUpdate {
  int32  step          = 1;
  string id            = 2;
  string label         = 3;
  string description   = 4;
  repeated string files       = 5;
  repeated string depends_on  = 6;
  bool   is_previewable       = 7;
}

message ApprovePlanReply {
  bool accepted = 1;
  string error = 2;
  int32 total_steps = 3;
  repeated BuildStepProto steps = 4;
}

message RejectPlanRequest {
  string plan_id = 1;
  string project_id = 2;
  string reason = 3;
}

message RejectPlanReply {
  bool accepted = 1;
  string error = 2;
}

message GetBuildPlanRequest {
  string plan_id = 1;
}

message BuildPlanReply {
  string id = 1;
  string project_id = 2;
  string status = 3;
  int32 total_steps = 4;
  int32 current_step = 5;
  repeated BuildStepProto steps = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string error = 9;
  bool tdd_enabled = 10;
}

message BuildStepProto {
  string id = 1;
  string plan_id = 2;
  string project_id = 3;
  int32 step_number = 4;
  string step_id = 5;
  string label = 6;
  string description = 7;
  string status = 8;
  bool is_previewable = 9;
  repeated string depends_on = 10;
  repeated string files_planned = 11;
  repeated string files_created = 12;
  string preview_url = 13;
  string thumbnail_url = 14;
  string error = 15;
  google.protobuf.Timestamp started_at = 16;
  google.protobuf.Timestamp completed_at = 17;
  repeated string test_files_planned = 18;
  repeated string test_files_created = 19;
  string test_status = 20;
}

message GetStepRequest {
  string step_id = 1;
}

message BuildStepReply {
  BuildStepProto step = 1;
  string error = 2;
}

message BuildProgressRequest {
  string project_id = 1;
  string plan_id = 2;
}

message BuildProgressUpdate {
  string plan_id = 1;
  string project_id = 2;
  int32 step_number = 3;
  int32 total_steps = 4;
  string step_label = 5;
  string status = 6;
  string preview_url = 7;
  string thumbnail_url = 8;
  string message = 9;
  string error = 10;
}

// ── Previews & Testing ──

message GetPreviewRequest {
  string project_id = 1;
  string page_name = 2;
  string step_id = 3;
}

message GetPreviewReply {
  string page_name = 1;
  string preview_url = 2;
  string thumbnail_url = 3;
  string status = 4;
  string error = 5;
}

message RebuildPreviewRequest {
  string plan_id = 1;
  string step_id = 2;
  string project_id = 3;
  repeated string page_files = 4;
}

message RebuildPreviewReply {
  bool accepted = 1;
  string error = 2;
}

message E2ETestRequest {
  string project_id = 1;
  string start_page = 2;
  string end_page = 3;
}

message E2ETestReply {
  string test_name = 1;
  bool passed = 2;
  string output = 3;
  string test_code = 4;
  string duration = 5;
  string error = 6;
}

message GetFullAppRequest {
  string project_id = 1;
  string plan_id = 2;
}

message GetFullAppReply {
  string preview_url = 1;
  string error = 2;
}

// ── Source Code Viewer ──

message GetFileContentRequest {
  string project_id = 1;
  string repo_id = 2;
  string file_path = 3;
  string ref = 4;              // branch/commit ref, defaults to HEAD
}

message GetFileContentReply {
  string content = 1;
  string language = 2;         // detected language for syntax highlighting
  repeated int32 violation_lines = 3;
}

// ── Violation Detail (lazy) ──

message GetViolationDetailRequest {
  // Stable evidence-row UUID — comes from NodeViolation.violation_id /
  // FileViolation.violation_id on a prior GetRepositoryGraph response.
  // Clients treat the value as opaque.
  string violation_id = 1;

  // force_regenerate, when true, makes the server bypass the Redis
  // cache entry for this violation_id and re-run the Stage 3
  // ChangeSet plan-pass (file fetch + scope resolution + LLM call
  // + validation). The fresh result is then written into Redis, so
  // subsequent reads observe the new plan. Used by the client's
  // "Try a different fix" / "Retry" CTA on the stream-error banner
  // — the user has explicitly indicated the prior result was
  // unusable and clearing the client's local cache without
  // bypassing the server cache would just re-burst the same stale
  // entry.
  //
  // Defaults false: the cache hit is the overwhelmingly common path
  // and the warm-RPC's value depends on it. Server applies the same
  // per-user / per-violation rate limit to force-regenerate calls
  // as to warm calls, so a stuck client can't hammer the AI
  // pipeline.
  bool force_regenerate = 2;
}

// GetViolationDetailReply carries everything the violation detail sheet
// needs to render. The cheap fields (rule_name, explanation, line, etc.)
// are echoed from the evidence row so the client doesn't need to keep a
// reference to the originating list-row around. The expensive fields
// (current_code, suggested_fix, estimated_fix_minutes, confidence) are
// the actual point of this RPC — they require file I/O and AI calls
// that would be prohibitively expensive to ship eagerly with every
// canvas snapshot.
message GetViolationDetailReply {
  // Identity / cheap fields — echoed from the underlying evidence row
  // for client convenience.
  string violation_id = 1;
  string rule_id = 2;
  string rule_name = 3;
  string explanation = 4;
  ViolationSeverity severity = 5;
  string file_path = 6;
  int32 line = 7;          // 1-based; 0 means "no line known"
  int32 end_line = 8;      // 0 means single-line; see canvas.NodeViolation sentinel doc
  string docs_url = 9;
  string label = 10;       // short citation (e.g. "GDPR Art.32")

  // Expensive fields — populated server-side per request, cached by
  // violation_id. Empty when the underlying source is unavailable
  // (file not in repo, AI client offline, etc.) — clients hide the
  // corresponding UI section.

  // current_code is the offending snippet extracted from file_path
  // between line and end_line (inclusive), dedented, no line numbers.
  // Capped at a reasonable line count; truncated snippets append "…".
  // Empty when file_path resolves to no file (structural violations
  // without a localized snippet).
  string current_code = 11;

  // violation_reason is the per-instance "why this specific code is
  // violating this rule" message from the constraint runner — e.g.
  // "Hardcoded secret detected: Database Connection String" for a
  // secret-detection rule, "data layer directly accessed from
  // presentation layer" for a layer-violation rule. Distinct from
  // `explanation` (the rule's general definition) and `rule_name`
  // (the rule's display title). Populated from the underlying
  // evidence row's message column; empty when the runner didn't
  // record a per-instance reason.
  //
  // Lets the client surface the actionable trigger text directly
  // ("the value 'sk_live_4eC39...' looks like a Stripe key") rather
  // than the user having to infer it from the rule name + the
  // offending snippet. UX win for non-expert users skimming
  // violations.
  string violation_reason = 19;

  // (field 12 retired in PR 10d-F — legacy FixPlan shape replaced
  // by [change_set] below.)
  reserved 12;
  reserved "fix_plan";

  // estimated_fix_minutes is the rough effort estimate to apply the
  // suggested fix. 0 when not estimable.
  int32 estimated_fix_minutes = 13;

  // confidence is the AI fix confidence in [0.0, 1.0]. 0 when not set.
  // The client renders a confidence chip when > 0.
  float confidence = 14;

  // resolves lists every violation_id the suggested_fix is intended
  // to address. Always includes the requested violation_id; may
  // include others when the server detected co-located violations
  // (overlapping line ranges in the same file) and asked the AI to
  // produce one fix covering all of them. Lets the client mark
  // multiple sheet entries as "resolved by this fix" without making
  // N separate detail requests.
  repeated string resolves = 15;

  // validation_status maps each violation_id in `resolves` to the
  // outcome of the deterministic post-fix validation pass. The server
  // applies the fix in-memory, re-runs the relevant constraint
  // runners against the modified content, and reports per-rule
  // resolution. Lets the client distinguish "AI claims to fix this"
  // (suggested_fix non-empty) from "the constraint engine confirms
  // this fix resolves the rule" (status = RESOLVED).
  map<string, FixValidationStatus> validation_status = 16;

  // deterministically_validated is true when at least one rule in
  // scope was validatable (file-based) and the validation pass ran.
  // False when all in-scope rules are graph-based (data flow, layer,
  // breach notification, deletion) and require re-indexing to verify
  // — the suggested_fix is then AI-only with no deterministic
  // backstop. Clients render an "AI-suggested, requires re-index to
  // verify" indicator in that case.
  bool deterministically_validated = 17;

  // fix_scope conveys how broad the suggested change is, derived
  // server-side from line counts + the AI's own FIX_SCOPE marker.
  // The client surfaces this so a user about to apply a 200-line
  // file rewrite knows it isn't a one-line tweak before clicking.
  FixScope fix_scope = 18;

  // (field 19 = violation_reason, declared above with the
  // identity/cheap fields where it semantically belongs.)

  // validation_context is server-side prose accompanying the
  // validation_status map. Explains in plain language WHY some
  // rules show RESOLVED vs NOT_VALIDATABLE — e.g.
  // "Re-ran 1 file-based rule against the modified content: passed.
  // Skipped 2 graph-based rules (require re-indexing to verify)."
  // Empty when no validation ran (no fix generated, file fetch
  // failed). Lets the client render an honest "what we checked"
  // explainer instead of leaving users to interpret a status map.
  string validation_context = 20;

  // resolves_names is the human-readable rule-name lookup keyed by
  // the same violation_ids in `resolves`. Always includes the
  // requested violation, plus every co-located violation listed in
  // resolves. Lets the client render "this fix addresses 3 rules:
  // Secret Detection, GDPR Article 32, Forbidden Import" without
  // making N separate detail requests just to render names.
  //
  // Lookup contract: every violation_id in `resolves` MUST appear as
  // a key in `resolves_names`. Empty value (rule_name unknown)
  // signals the row's rule_name column was NULL — clients fall back
  // to displaying the rule_id. Missing key is a server bug.
  map<string, string> resolves_names = 21;

  // validation_outcome is the single-axis collapse of the per-rule
  // `validation_status` map into the three render states the client
  // actually needs. Today the client conflates "we couldn't check"
  // with "we checked and it failed", which surfaces a misleading
  // "AI plan failed validation" CTA on graph-based rules where the
  // file-only validator returns NOT_VALIDATABLE for every entry —
  // there is no evidence the fix is wrong, only an absence of
  // positive evidence. Eroding-trust UX bug observed in production
  // logs 2026-04-28 on rule_id=breach-notification-handler.
  //
  // Routing rule (positive evidence wins, negative evidence trumps
  // absence-of-evidence):
  //
  //   - any UNRESOLVED or INTRODUCED → FAILED  (real failure: render
  //     red chip + "Try a different fix" CTA + list newly-tripped
  //     rules from INTRODUCED entries)
  //
  //   - else any RESOLVED              → VALIDATED  (positive
  //     evidence; mixed RESOLVED+NOT_VALIDATABLE counts as validated
  //     because at least one rule was checked and passed)
  //
  //   - else (all NOT_VALIDATABLE)     → COULD_NOT_VALIDATE  (yellow
  //     chip; do NOT show "Try a different fix" — it would burn AI
  //     budget on a re-roll that has no signal to improve against)
  //
  //   - empty map (no validation ran) → UNSPECIFIED  (client falls
  //     back to its no-validation rendering, same as today)
  //
  // Derived server-side from `validation_status` so the client
  // doesn't have to re-implement the routing rule. The map stays on
  // the wire for clients that want the per-rule breakdown (e.g.,
  // listing which rules INTRODUCED).
  ValidationOutcome validation_outcome = 22;

  // fix_status surfaces whether an Apply Fix dispatch is
  // already in flight for this violation. Server reads
  // pr_violation_fix_branch fresh on every detail call (NOT
  // cached) so the field reflects current state without
  // requiring client-side cache invalidation. Empty +
  // pr_url/pr_number unset on NOT_STARTED.
  //
  // Clients use this to gate the Apply Fix CTA — render
  // "Apply Fix" on NOT_STARTED, "View PR ↗" (linked to
  // pr_url) on PR_OPEN. Older clients that don't read this
  // field continue to render the legacy Apply Fix CTA;
  // they'll dispatch a no-op re-apply (the runner's
  // idempotency table dedups), but the UX is degraded
  // rather than broken.
  ViolationFixStatus fix_status = 23;
  // pr_url is GitHub's html_url for the open PR. Set when
  // fix_status == PR_OPEN; empty otherwise.
  string pr_url = 24;
  // pr_number is the PR's GitHub-side number. Set when
  // fix_status == PR_OPEN; zero otherwise.
  int32 pr_number = 25;

  // change_set is the typed Fix ChangeSet plan that resolves the
  // constraint(s) — the unit of human review and the contract
  // between Stages 3–7 of the pipeline. Empty when Stage 3 didn't
  // produce a plan (rule not addressable, plan-pass error, gaps
  // unresolvable). Canvas client renders the no-preview UI in that
  // case.
  ChangeSet change_set = 26;
}

// StreamViolationDetailRequest is the input shape for
// [BuildService.StreamViolationDetail]. Identical to
// [GetViolationDetailRequest] today; lives as its own message so
// the streaming RPC can evolve without dragging the unary RPC's
// shape (e.g. adding stream-specific options like "skip header"
// for clients that already cached the cheap fields).
message StreamViolationDetailRequest {
  string violation_id = 1;

  // force_regenerate mirrors [GetViolationDetailRequest.force_regenerate]:
  // when true, the server bypasses the Redis cache entry for this
  // violation_id and re-runs the streaming compute path. The fresh
  // result is written back to Redis so the next non-forced read
  // sees the new plan. Used by the client's "Try a different fix"
  // CTA on the stream-error banner.
  //
  // Same rate-limiter applies as the warm RPC's per-user budget —
  // a stuck client looping on regenerate can't outrun the AI cost
  // ceiling.
  bool force_regenerate = 2;
}

// ViolationDetailUpdate is one message on the
// [BuildService.StreamViolationDetail] stream. Exactly one oneof
// payload is set per message. Clients MUST handle every payload
// type — unknown payloads should be ignored gracefully (allows
// adding new update types without breaking older clients).
//
// Wire-order contract:
//
//   1. HEADER — exactly one, FIRST.
//   2. PROGRESS — zero or more, between HEADER and VALIDATION.
//      Streamed from the agentic-fix-loop's tool-call activity
//      (the AI's "thinking" / "reading file X" / "searching for
//      symbol Y" reasoning) so the client can render visible
//      progress under the spinner instead of dead time. Clients
//      SHOULD treat absence of PROGRESS messages as fine (older
//      deploys and cache-hit bursts skip them) — never block on
//      receipt.
//   3. VALIDATION — zero or more, one per rule_id in resolves[].
//   4. CHANGE_SET — at most one, after VALIDATION and before
//      FOOTER. Carries the typed Fix ChangeSet from Stage 3.
//      Omitted entirely when Stage 3 produced no plan (degraded
//      path — canvas client renders no-preview UI).
//   5. FOOTER — exactly one, LAST. After this message the server
//      closes the stream.
//
// On error mid-stream: the server emits ERROR and closes. Clients
// should keep whatever HEADER + PROGRESS + VALIDATION + CHANGE_SET
// messages they've already received and render the sheet in
// degraded state.
//
// On cache hit: the server emits HEADER + N VALIDATION +
// CHANGE_SET + FOOTER in a single non-streaming burst (no PROGRESS
// messages because there's no agentic compute to narrate). Clients
// render identically — the streaming wire shape is correct for
// both warm-cache and cold-compute paths.
//
// (Field 2 reserved — legacy `FixHunk hunk` payload retired in PR 10d-F.)
message ViolationDetailUpdate {
  reserved 2;
  reserved "hunk";
  oneof payload {
    ViolationDetailHeader header = 1;
    ValidationStatusEntry validation = 3;
    ViolationDetailFooter footer = 4;
    ViolationDetailError error = 5;
    ViolationDetailProgress progress = 6;
    // change_set is the typed Fix ChangeSet from Stage 3. Newer
    // clients render this via ChangeSetView (PR 10b).
    ChangeSet change_set = 7;
  }
}

// ViolationDetailProgress carries one observable from the
// agentic-fix-loop's reasoning trace. Sent between HEADER and
// HUNK so the client can render the AI's tool-call activity
// inline with the spinner — same UX as Claude Code's tool-use
// trace.
//
// **Kind discrimination**: the `kind` enum tells the client how
// to render the message. Clients MUST handle unknown values
// gracefully (treat as KIND_THINKING and render `text`) so
// adding new kinds doesn't break older clients.
//
// **Privacy**: `text` and `args_summary` are server-redacted
// before send — they MUST NOT contain raw file contents,
// secrets, or full tool result bodies. The agentloop's
// summarizeResultText helper enforces this contract; client
// renders verbatim.
message ViolationDetailProgress {
  // ProgressKind mirrors the agentloop ProgressKind enum.
  // Stable wire identifier; never reused.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // KIND_THINKING — model's natural-language reasoning text.
    // From provider's reasoning blocks (Anthropic native) or
    // synthesized from tool name when reasoning isn't surfaced
    // by the upstream.
    KIND_THINKING = 1;
    // KIND_TOOL_CALL — model is about to invoke a tool. tool_name
    // is set; args_summary carries a redacted JSON arg summary.
    KIND_TOOL_CALL = 2;
    // KIND_TOOL_RESULT — a tool just returned. tool_name is set;
    // text carries a one-line outcome summary
    // ("read_file: ok (1024 bytes)" / "<tool>: error: <reason>").
    KIND_TOOL_RESULT = 3;
  }

  Kind kind = 1;

  // tool_name is set on KIND_TOOL_CALL and KIND_TOOL_RESULT.
  // Empty for KIND_THINKING.
  string tool_name = 2;

  // text is the human-readable summary (model prose for
  // THINKING; one-line outcome for TOOL_RESULT). Server-redacted.
  string text = 3;

  // args_summary is set on KIND_TOOL_CALL and carries a redacted
  // summary of the tool arguments. Empty otherwise.
  string args_summary = 4;
}

// ViolationDetailHeader carries the cheap identity fields echoed
// from the evidence row plus the offending code snippet. Sent
// FIRST on the stream so the client can render the sheet
// container immediately (~150ms after the RPC starts) — well
// before any AI work completes.
//
// Field set is the strict subset of [GetViolationDetailReply]
// that doesn't depend on the AI plan. The remaining fields
// (change_set, validation_status, deterministically_validated,
// confidence, estimated_fix_minutes, fix_scope, resolves) arrive
// in subsequent stream messages.
message ViolationDetailHeader {
  string violation_id = 1;
  string rule_id = 2;
  string rule_name = 3;
  string explanation = 4;
  ViolationSeverity severity = 5;
  string file_path = 6;
  int32 line = 7;
  int32 end_line = 8;
  string docs_url = 9;
  string label = 10;
  string current_code = 11;
  // violation_reason mirrors [GetViolationDetailReply.violation_reason]
  // — the per-instance "why this code violates this rule" message
  // from the constraint runner. Streamed in the HEADER so the client
  // can render the actionable trigger text immediately, before any
  // AI work completes.
  string violation_reason = 12;
  // fix_status mirrors [GetViolationDetailReply.fix_status]
  // — whether an Apply Fix dispatch is already in flight for
  // this violation. Streamed in the HEADER (cheap to compute —
  // one indexed lookup against pr_violation_fix_branch) so the
  // client renders the right CTA from the very first frame
  // without waiting for the AI plan to land in the FOOTER.
  ViolationFixStatus fix_status = 13;
  // pr_url is GitHub's html_url for the open PR. Set when
  // fix_status == PR_OPEN; empty otherwise.
  string pr_url = 14;
  // pr_number is the PR's GitHub-side number. Set when
  // fix_status == PR_OPEN; zero otherwise.
  int32 pr_number = 15;
}

// ValidationStatusEntry pairs one violation_id with its
// deterministic-validation outcome. Streamed as the per-rule
// validation runs complete (one entry per rule_id eventually
// listed in [ViolationDetailFooter.resolves]).
message ValidationStatusEntry {
  string violation_id = 1;
  FixValidationStatus status = 2;
}

// ViolationDetailFooter is the wrap-up message — sent LAST after
// validation + change_set. Carries the metadata that depends on
// the full plan (confidence/scope/effort estimate) plus the
// deterministically_validated bit and the resolves[] list.
//
// After receiving this message the client should mark the sheet
// as "fully loaded" and enable the Apply button (subject to the
// Apply safety floor: no UNRESOLVED / INTRODUCED entries).
message ViolationDetailFooter {
  int32 estimated_fix_minutes = 1;
  float confidence = 2;
  repeated string resolves = 3;
  bool deterministically_validated = 4;
  FixScope fix_scope = 5;
  // validation_context mirrors [GetViolationDetailReply.validation_context]
  // — server-side prose explaining what the validation pass actually
  // checked vs skipped. Streamed in the FOOTER (after all per-rule
  // VALIDATION entries) so the client renders the badges first then
  // the contextual explainer.
  string validation_context = 6;
  // resolves_names mirrors [GetViolationDetailReply.resolves_names]
  // — human-readable rule names keyed by violation_id. Streamed in
  // the FOOTER alongside `resolves` so the client renders the
  // multi-violation summary line ("This fix addresses 3 rules: X,
  // Y, Z") in one pass.
  map<string, string> resolves_names = 7;
  // (Field 8 reserved — legacy `string fix_plan_summary` retired in
  // PR 10d-F. The Stage 3 ChangeSet's PlanRationale.Summary is the
  // single source of plan-scoped explainer prose now.)
  reserved 8;
  reserved "fix_plan_summary";
  // validation_outcome mirrors [GetViolationDetailReply.validation_outcome]
  // — the tri-state collapse of the per-rule validation_status map
  // (validated / failed / could-not-validate). Streamed in the
  // FOOTER so the client routes the chip + the conditional "Try a
  // different fix" CTA off this single value rather than
  // re-implementing the derivation rule from per-rule VALIDATION
  // events. See the field godoc on the unary reply for the full
  // routing contract.
  ValidationOutcome validation_outcome = 9;
}

// ViolationDetailError is the stream-level failure shape. Emitted
// by the server when the AI call failed transiently, the plan
// schema parse failed, or the upstream timed out. The client
// should render the sheet in degraded state (showing whatever
// HEADER + HUNK + VALIDATION arrived) plus an error indicator;
// existing partial content is NOT discarded.
//
// Stream-level errors are distinct from gRPC-status errors:
// gRPC-status errors abort the stream entirely (no payload
// messages reach the client). ViolationDetailError lets the
// server send "the stream's content is incomplete because of X"
// while still delivering whatever HEADER + partial hunks made it
// through.
message ViolationDetailError {
  // code is a short machine-readable error category. Currently:
  //   "transient_ai" — upstream AI failure (timeout, retry-exhausted, 5xx).
  //   "schema_invalid" — model emitted JSON that didn't match the ChangeSet schema.
  //   "not_json" — model emitted non-JSON content (model regression signal).
  //   "internal" — server-side error not attributable to AI.
  string code = 1;
  // message is a human-readable one-line explanation. Safe to
  // surface in the UI; does NOT contain raw upstream error bodies
  // or internal stack traces.
  string message = 2;
}

// WarmViolationDetailRequest is the input shape for
// [BuildService.WarmViolationDetail]. Single field today; the
// shape exists for forward compatibility (future: priority hint,
// cancellation token, etc.).
message WarmViolationDetailRequest {
  string violation_id = 1;
}

// WarmViolationDetailReply is the immediate response from the
// fire-and-forget warm trigger. Returns within milliseconds
// regardless of whether the AI compute is ongoing in the
// background.
message WarmViolationDetailReply {
  // cache_hit is true when the result was already in Redis (no
  // background work was triggered). False when the warm
  // launched a background goroutine — the result will land in
  // Redis when the AI call completes (~10-30s typical), and a
  // subsequent GetViolationDetail / StreamViolationDetail will
  // hit the cache.
  bool cache_hit = 1;
  // single_flight_lost is true when this warm did NOT trigger
  // background compute because another concurrent warm for the
  // same violation_id won the single-flight lock. The cache will
  // be populated by the winning warm; this caller should poll or
  // wait the same way it would for cache_hit=false.
  bool single_flight_lost = 2;
  // rate_limited is true when this warm was rejected because the
  // caller exceeded the per-user-per-minute warm budget. The
  // server returns the rejection as a clean 200 reply (not gRPC
  // RESOURCE_EXHAUSTED) so client-side hover/scroll handlers can
  // back off without surfacing a user-visible error.
  bool rate_limited = 3;
}

// FixValidationStatus is the per-violation outcome of the deterministic
// post-fix validation pass.
enum FixValidationStatus {
  FIX_VALIDATION_STATUS_UNSPECIFIED = 0;
  // The rule's constraint runner did not fire after applying the fix
  // to the file content — the constraint is satisfied by the fix.
  FIX_VALIDATION_STATUS_RESOLVED = 1;
  // The rule still fires after applying the fix — the AI's fix did
  // not actually satisfy this constraint.
  FIX_VALIDATION_STATUS_UNRESOLVED = 2;
  // The rule is graph-based (data flow, layer violation, etc.) and
  // requires re-indexing into Neo4j to verify; we couldn't run the
  // check deterministically.
  FIX_VALIDATION_STATUS_NOT_VALIDATABLE = 3;
  // A rule that wasn't firing before now fires after applying the
  // fix — the fix introduced a new violation.
  FIX_VALIDATION_STATUS_INTRODUCED = 4;
}

// ValidationOutcome is the single-axis collapse of the per-rule
// `validation_status` map into the three render states the canvas
// detail view actually surfaces (validated / failed / could-not-
// validate). Derivation rule lives on
// [GetViolationDetailReply.validation_outcome] so the per-rule map
// and the collapsed outcome can't drift.
// ViolationFixStatus reports whether an Apply Fix dispatch
// has been kicked off for this violation, and if so, where it
// currently stands. Server-side authoritative — derived from
// `pr_violation_fix_branch` (the runner's idempotency table)
// fresh on every detail read, never cached. The canvas client
// gates the Apply Fix CTA off this field:
//
//   - NOT_STARTED → render "Apply Fix" button
//   - PR_OPEN     → render "View PR ↗" (linked to pr_url)
//
// Future tiers (MERGED / CLOSED) require GitHub PR-state
// integration (webhook or lazy poll) and aren't shipped yet.
// Clients ignoring the field render the legacy Apply Fix CTA;
// clients that read it gate appropriately.
//
// Stable wire surface: append new values, never renumber.
enum ViolationFixStatus {
  VIOLATION_FIX_STATUS_UNSPECIFIED = 0;
  // No row exists in the runner's idempotency table —
  // no Apply Fix has been dispatched against this violation.
  // The standard "Apply Fix" CTA is the right user action.
  VIOLATION_FIX_STATUS_NOT_STARTED = 1;
  // A row exists with a populated pr_number — the runner
  // opened (or updated) a PR. The client renders a "View PR"
  // CTA linked to pr_url instead of inviting the user to
  // re-dispatch. Read pr_number / pr_url for navigation.
  VIOLATION_FIX_STATUS_PR_OPEN = 2;
  // Reserved for future extension when PR-state webhook /
  // polling lands:
  //   VIOLATION_FIX_STATUS_MERGED = 3;
  //   VIOLATION_FIX_STATUS_CLOSED = 4;
}

enum ValidationOutcome {
  VALIDATION_OUTCOME_UNSPECIFIED = 0;
  // At least one rule was deterministically checked and resolved by
  // the fix; no rule was UNRESOLVED or INTRODUCED. Render the green
  // "validated" chip.
  VALIDATION_OUTCOME_VALIDATED = 1;
  // At least one rule fired post-fix (UNRESOLVED) or wasn't firing
  // before but fires now (INTRODUCED). Render the red "failed
  // validation" chip + "Try a different fix" CTA.
  VALIDATION_OUTCOME_FAILED = 2;
  // Every rule in scope is graph-based or otherwise non-file-
  // validatable (NOT_VALIDATABLE) — no positive evidence and no
  // negative evidence either. Render the yellow "could not be auto-
  // validated" chip and DO NOT surface the "Try a different fix"
  // CTA: a re-roll has no signal to improve against.
  VALIDATION_OUTCOME_COULD_NOT_VALIDATE = 3;
}

// FixScope conveys the breadth of an AI-generated suggested fix so the
// client can render an honest scope indicator.
enum FixScope {
  FIX_SCOPE_UNSPECIFIED = 0;
  // The fix replaces only the offending lines (or fewer).
  FIX_SCOPE_LINE = 1;
  // The fix replaces a function/method body — affects more than just
  // the offending lines but stays within one function.
  FIX_SCOPE_FUNCTION = 2;
  // The fix touches multiple functions or replaces a significant
  // portion of the file — UI should warn the user.
  FIX_SCOPE_FILE = 3;
  // The fix requires changes across multiple files (rare; usually
  // means new dependency, new helper module, etc.). UI should warn
  // strongly and recommend manual review.
  FIX_SCOPE_BROADER = 4;
}

// ── Apply Fix (Phase 2e) ──
//
// (Legacy `FixPlan`, `FixHunk`, `FixDependency` messages and
// `FixHunkRole` / `FixDependencyKind` enums retired in PR 10d-F —
// the typed Fix [ChangeSet] / refactor.RefactorOp vocabulary
// supersedes them. Stage 3 produces ChangeSets directly; the
// `ViolationDetail.change_set` field carries them on the wire.)

// ApplyFixViaAgentRequest dispatches the canvas Apply Fix CTA
// through the agentloop fix_apply agent (KA-242). The agent owns
// the full lifecycle (branch → execute ops → validators → push →
// PR open) and streams progress via [AgentProgressUpdate]. The
// server resolves the ChangeSet from cache when [change_set] is
// unset.
//
// (Field 2 reserved — legacy `FixPlan fix_plan` retired in PR 10d-F.)
message ApplyFixViaAgentRequest {
  reserved 2;
  reserved "fix_plan";

  // The violation the agent should fix. Server resolves
  // org_id/repo_id and the seed ChangeSet from this id.
  string violation_id = 1;

  // Optional branch name. When unset, the agent generates one of
  // the form `korelink/fix-violation-<short_id>` so concurrent
  // ApplyFixViaAgent calls for the same violation collide on the
  // canonical name (idempotency anchor).
  string branch_name = 3;

  // Optional client-provided deep-link URL pointing back at the
  // violation in the canvas (e.g.,
  // `https://app.korelink.dev/canvas/<project>?violation_id=<id>`).
  // The server forwards this verbatim into the auto-generated PR
  // body so reviewers can click through from GitHub to the
  // violation's full context (rule definition, evidence trail,
  // surrounding repo state) without manually reconstructing the
  // URL.
  //
  // Client-provided (not server-constructed) because the canvas
  // routing convention is owned by the client; the server has no
  // first-class notion of canvas URLs. Empty → the PR body omits
  // the link section gracefully.
  string violation_url = 4;

  // change_set is the typed Fix ChangeSet hint. When set, the
  // pipeline skips Stage 3 (LLM plan-pass) and uses this hint as
  // the validated plan. Stage 4 validators still run against the
  // hint — a malformed/stale ChangeSet rejects safely. When unset,
  // the agent runs Stage 3 over the violation to produce a fresh
  // plan.
  //
  // Set by the canvas client when it has the user-reviewed
  // ChangeSet (consumed from `GetViolationDetailReply.change_set`).
  ChangeSet change_set = 5;
}

// DispatchApplyFixRequest dispatches the canvas Apply Fix
// CTA through the same agent path as [ApplyFixViaAgentRequest]
// but returns the run_id synchronously instead of streaming.
// Field shape is intentionally identical so the two RPCs can
// share request-construction code on the client and
// param-marshaling code on the server.
message DispatchApplyFixRequest {
  reserved 2;
  reserved "fix_plan";

  string violation_id  = 1;
  string branch_name   = 3;
  // See ApplyFixViaAgentRequest.violation_url docstring — same
  // contract on this RPC.
  string violation_url = 4;
  // change_set is the typed Fix ChangeSet hint. Same contract as
  // [ApplyFixViaAgentRequest.change_set] — when set, the dispatch
  // path routes to the fix_violation agent and feeds the hint into
  // the Stage 3 short-circuit.
  ChangeSet change_set = 5;
}

// DispatchApplyFixResponse carries the dispatched run's
// identity. The caller feeds [run_id] into
// [AgentService.StreamAgentRunProgress] to observe lifecycle
// events (typically alongside other in-flight runs the panel
// is already streaming).
message DispatchApplyFixResponse {
  // The agent_runs row id the dispatch created. Always
  // populated on success — the runner is fire-and-forget but
  // the agent_runs INSERT is synchronous within the dispatch
  // call.
  string run_id = 1;

  // The agent_type that was dispatched. Always
  // AGENT_TYPE_FIX_APPLY today; carried explicitly so future
  // dispatch RPCs (project-scope DispatchProjectFixViolations,
  // PR E) can share the response shape.
  AgentType agent_type = 2;
}

// ── What-If Simulation ──

message EvaluateWhatIfRequest {
  string project_id = 1;
  string repo_id = 2;
  repeated WhatIfAction actions = 3;
}

message WhatIfAction {
  WhatIfActionType type = 1;
  string node_id = 2;
  string target_layer = 3;        // for MOVE_NODE
  string target_node_id = 4;      // for ADD_EDGE / REMOVE_EDGE
  string edge_kind = 5;           // DependencyKind as string
  string description = 6;         // human-readable for UI
}

enum WhatIfActionType {
  WHAT_IF_ACTION_UNSPECIFIED = 0;
  WHAT_IF_ACTION_MOVE_NODE = 1;
  WHAT_IF_ACTION_REMOVE_EDGE = 2;
  WHAT_IF_ACTION_ADD_EDGE = 3;
  WHAT_IF_ACTION_REMOVE_NODE = 4;
  WHAT_IF_ACTION_CHANGE_TAG = 5;
}

message EvaluateWhatIfReply {
  int32 before_violations = 1;
  string before_coverage = 2;
  int32 after_violations = 3;
  string after_coverage = 4;
  string delta_summary = 5;
  repeated WhatIfViolationChange resolved = 6;
  repeated WhatIfViolationChange introduced = 7;
  repeated CanvasNode updated_nodes = 8;
  repeated CanvasEdge updated_edges = 9;
}

message WhatIfViolationChange {
  string source_node_id = 1;
  string target_node_id = 2;
  string edge_kind = 3;
  string reason = 4;
}

// ── AnalyzeNode (AI) ──

message AnalyzeNodeRequest {
  string repo_id = 1;
  string node_id = 2;
  string question = 3;       // optional: specific question about the node
}

message AnalyzeNodeResponse {
  string summary = 1;                             // what this component does
  string risk_assessment = 2;                      // risk level + reasoning
  repeated string refactoring_suggestions = 3;
  repeated string compliance_notes = 4;
  string raw_response = 5;                         // full AI response
}

// ── Canvas Chat History ──

message CanvasChatMessage {
  string id = 1;
  string repo_id = 2;
  string user_id = 3;
  string node_id = 4;                             // optional: which node was selected
  string role = 5;                                 // "user" or "assistant"
  string content = 6;
  google.protobuf.Timestamp created_at = 7;
}

message GetCanvasChatHistoryRequest {
  string repo_id = 1;
  int32 limit = 2;                                 // default 50
  int32 offset = 3;                                // default 0
}

message GetCanvasChatHistoryReply {
  repeated CanvasChatMessage messages = 1;
  int32 total_count = 2;
}

message ClearCanvasChatHistoryRequest {
  string repo_id = 1;
}

message ClearCanvasChatHistoryReply {
  bool success = 1;
}

// ── Fix ChangeSet Architecture ──
//
// The ChangeSet is the structured plan the canvas violation-fix
// pipeline (docs/architecture/KoreLink_Fix_ChangeSet_Architecture.md)
// produces in Stage 3 (plan) and consumes in Stages 4–7 (validate_plan
// → generate → validate_diffs → apply). It carries a typed-Operations
// vocabulary that downstream stages can validate (cluster coverage,
// caller coverage, layer integrity) and dispatch (per-op executor
// per language).
//
// Wire equivalent of internal/fix/changeset.ChangeSet. Sole plan
// shape on the wire post-PR-10d-F — the legacy FixPlan/FixHunk
// shape was retired in the same cutover (Stage 3 emits ChangeSets
// directly into ViolationDetail.change_set; the Apply path
// consumes the ChangeSet hint via ApplyFixViaAgentRequest /
// DispatchApplyFixRequest).
message ChangeSet {
  // id is a stable identifier derived from cluster_id + ordered op
  // ids (sha256-hashed). Re-plans that produce the same operations
  // on the same cluster yield the same id — useful for cache
  // dedup + audit trail.
  string id = 1;

  // cluster_id names the equivalence class (set of related
  // violations) this ChangeSet addresses.
  string cluster_id = 2;

  // operations[] is the ordered op list. Order is significant:
  // a RenameSymbolOp's UpdateCallSitesOp must follow it. v1 closed
  // vocabulary lives in the RefactorOp oneof.
  repeated RefactorOp operations = 3;

  // affected_files names every distinct file the operations touch,
  // de-duplicated. Each entry maps file → role → contributing op
  // ids so the canvas client can render a per-file panel grouped
  // by role + the PR description renderer can attribute changes.
  repeated AffectedFile affected_files = 4;

  // rationale is the structured explanation: WHAT the plan does,
  // WHY it addresses the cluster, and which alternatives the
  // planner considered + rejected.
  PlanRationale rationale = 5;

  // coverage is the structured proof that the plan addresses every
  // cluster member + caller + layer invariant. Stage 4's plan
  // validators populate this; downstream stages can trust the
  // coverage claims without re-walking the cluster/scope.
  CoverageProof coverage = 6;

  // layer_decisions records per-file layer assignments + the
  // auto-approval state at decision time. One entry per
  // affected_file when the planner made a layer choice; absent
  // when no layer movement is involved (most rename + replace
  // ops).
  repeated LayerDecision layer_decisions = 7;

  // llm_trace points at the LLM call(s) that produced this
  // ChangeSet — plan-pass run id + per-op generate-pass run ids.
  // Lets the audit subsystem reconstruct the exact prompts
  // without dragging the prompt payload through the wire.
  LLMTraceRef llm_trace = 8;

  // created_at is the server-side construction time. Stamped at
  // Stage 3 emission; never updated after.
  google.protobuf.Timestamp created_at = 9;

  // status tracks the lifecycle position. PROPOSED → VALIDATED →
  // GENERATING → APPLIED is the happy path; AWAITING_CONFIRMATION,
  // PARTIAL_APPLIED, REJECTED are alternate terminals.
  PlanStatus status = 10;
}

// RefactorOp is the typed sum-type for v1's closed Operations
// vocabulary. The five op kinds cover: in-place renames, literal
// replacements, derived caller updates, cross-file moves, and
// extract-to-module restructurings. Adding a new op kind requires
// the per-language executor + plan validator to land first
// (extensibility checklist in §4.7 of the architecture doc).
message RefactorOp {
  oneof op {
    RenameSymbolOp rename_symbol = 1;
    ReplaceLiteralOp replace_literal = 2;
    UpdateCallSitesOp update_call_sites = 3;
    MoveSymbolOp move_symbol = 4;
    ExtractToModuleOp extract_to_module = 5;
  }
}

// RenameSymbolOp renames a symbol at its definition site. Spawns
// an explicit UpdateCallSitesOp the planner must emit so caller
// updates appear in the coverage proof.
message RenameSymbolOp {
  string id = 1;
  string symbol_id = 2;
  string old_name = 3;
  string new_name = 4;
  string file_path = 5;
  string reason = 6;
}

// ReplaceLiteralOp replaces a literal value at a precise range.
// Strict-mode mechanical text replacement.
message ReplaceLiteralOp {
  string id = 1;
  string file_path = 2;
  Range range = 3;
  string old_literal = 4;
  string new_literal = 5;
  string justification = 6;
}

// UpdateCallSitesOp is the derived op spawned by RenameSymbolOp /
// MoveSymbolOp / ExtractToModuleOp. Updates every call site of the
// renamed/moved symbol. derived_from points at the parent op id;
// plan validators reject UpdateCallSitesOps without a parent.
message UpdateCallSitesOp {
  string id = 1;
  string derived_from = 2;
  repeated CallSiteRef sites = 3;
  string old_name = 4;
  string new_name = 5;
  UpdateStrategy strategy = 6;
}

// MoveSymbolOp moves a symbol from its source file to a target
// file without changing its name. Spawns UpdateCallSitesOps to
// rewrite caller import paths. LLM-supervised execution (PR 12).
message MoveSymbolOp {
  string id = 1;
  string symbol_id = 2;
  string source_file_path = 3;
  string target_file_path = 4;
  ArchLayer target_layer = 5;
  bool preserve_callers = 6;
  string layer_justification = 7;
}

// ExtractToModuleOp extracts one or more symbols to a target
// module. Stronger architectural decision than MoveSymbol —
// proposes a new file or appends to an existing module file.
// Requires user confirmation when the project uses
// DefaultLayerPolicy (§9.4.3). LLM-supervised execution (PR 12).
message ExtractToModuleOp {
  string id = 1;
  repeated string source_symbols = 2;
  string target_file_path = 3;
  ArchLayer target_layer = 4;
  string target_package_name = 5;
  bool new_file = 6;
  string naming_convention = 7;
  string layer_justification = 8;
}

// CallSiteRef identifies a precise call site within a caller file.
// Used by UpdateCallSitesOp to enumerate every site the op
// addresses.
message CallSiteRef {
  string symbol_id = 1;
  string file_path = 2;
  int32 line = 3;
  int32 column = 4;
  string called_symbol = 5;
}

// Range is a 1-indexed line+column pair (start, end). End is
// exclusive — a single-character range at line 5 col 10 is
// {start_line=5, start_col=10, end_line=5, end_col=11}.
message Range {
  int32 start_line = 1;
  int32 start_col = 2;
  int32 end_line = 3;
  int32 end_col = 4;
}

// UpdateStrategy controls how UpdateCallSitesOp executes. The
// default is LLM-supervised but a per-org override allows strict
// mode for cost-sensitive deployments.
enum UpdateStrategy {
  UPDATE_STRATEGY_UNSPECIFIED = 0;
  UPDATE_STRATEGY_STRICT = 1;
  UPDATE_STRATEGY_LLM_SUPERVISED = 2;
}

// AffectedFile names a file the ChangeSet writes to. The
// op_ids list lets the PR description renderer attribute each
// change to its op; the role drives per-file UI framing
// (PRIMARY focal diff vs. CONSUMER supporting edit vs. NEW
// file create).
message AffectedFile {
  string file_path = 1;
  AffectedFileRole role = 2;
  repeated string op_ids = 3;
  ArchLayer layer = 4;
}

// AffectedFileRole classifies a file's role in the ChangeSet.
enum AffectedFileRole {
  AFFECTED_FILE_ROLE_UNSPECIFIED = 0;
  AFFECTED_FILE_ROLE_PRIMARY = 1;
  AFFECTED_FILE_ROLE_CONSUMER = 2;
  AFFECTED_FILE_ROLE_NEW = 3;
  AFFECTED_FILE_ROLE_MIGRATION = 4;
  AFFECTED_FILE_ROLE_DELETED = 5;
}

// PlanRationale is the structured explanation of WHY the
// ChangeSet addresses the cluster the way it does. Free-form
// prose is avoided in favour of named fields so the canvas
// client renders consistently and Stage 4 validators can
// check structurally that all required fields are populated.
message PlanRationale {
  string summary = 1;
  repeated string reasoning = 2;
  repeated AlternativeConsidered alternatives_considered = 3;
  string layer_impact = 4;
}

// AlternativeConsidered records an op kind the planner
// considered and rejected, with reason. Empty list means the
// chosen plan was the obvious answer.
message AlternativeConsidered {
  // op_kind is the rejected op kind as a string (one of
  // "rename_symbol", "replace_literal", "update_call_sites",
  // "move_symbol", "extract_to_module"). String wire encoding
  // (rather than a typed enum) keeps forward-compat trivial
  // when v2 vocabulary expands.
  string op_kind = 1;
  string reason = 2;
}

// CoverageProof is the artifact every successful plan/diff
// carries. Records explicitly that every cluster member is
// addressed by some op, every caller in scope is addressed,
// and every affected file holds its layer invariants.
message CoverageProof {
  // cluster_members_addressed lists violation ids that some
  // op in the ChangeSet targets.
  repeated string cluster_members_addressed = 1;

  // callers_addressed lists symbol ids of callers whose call
  // sites are addressed by some UpdateCallSitesOp.
  repeated string callers_addressed = 2;

  // layer_invariants_held records per-file layer integrity.
  // One entry per affected file.
  repeated LayerCheck layer_invariants_held = 3;

  // unaddressed lists gaps the validators detected. Empty on
  // a fully-covered plan; non-empty on a partial-apply (§16.7).
  repeated CoverageGap unaddressed = 4;
}

// LayerCheck is a per-file post-diff layer integrity claim.
message LayerCheck {
  string file_path = 1;
  // pre_layer is the file's layer classification before the fix.
  string pre_layer = 2;
  // post_layer is the file's layer classification after applying
  // the fix. Equal to pre_layer for files that don't move; the
  // field is captured anyway so unintended layer drift is
  // observable in the proof.
  string post_layer = 3;
  // held is true when the post-fix file's layer + dependency
  // edges satisfy the project's LayerPolicy.
  bool held = 4;
}

// CoverageGap is a structured re-prompt suggestion for the
// LLM (§5.2 re-plan loop) AND the surface for partial-apply
// reporting (§16.7). The kind enum mirrors the Go GapKind enum
// (string-encoded for forward-compat with future kinds).
message CoverageGap {
  // kind is one of "missing_member", "missing_caller",
  // "malformed_op", "layer_violation", "colliding_identifier",
  // "target_file_conflict", "budget_exceeded", "plan_unresolvable",
  // "diff_not_implementing_op", "syntactic_invalid",
  // "coverage_regression".
  string kind = 1;
  string detail = 2;
  string hint = 3;
  string op_id = 4;
}

// LayerDecision records a single per-file layer assignment
// the planner made (or kept). One entry per AffectedFile when
// the planner made a layer choice; absent when no layer
// movement is involved.
message LayerDecision {
  string file_path = 1;
  ArchLayer layer = 2;
  string op_id = 3;
  string justification = 4;
  bool auto_approved = 5;
  // auto_approve_config_snapshot records the auto-approval
  // config that was in effect at decision time, for audit
  // trail. Empty when AutoApproved is true with the default
  // config.
  string auto_approve_config_snapshot = 6;
}

// LLMTraceRef points back to the LLM call(s) that produced
// this ChangeSet. Lets the audit subsystem reconstruct prompts
// without dragging the prompt payload through this struct.
message LLMTraceRef {
  string plan_pass_run_id = 1;
  repeated string generate_pass_run_ids = 2;
  int32 replan_count = 3;
}

// PlanStatus tracks where in its lifecycle a ChangeSet
// currently sits. Persisted to agent_runs.metadata; rendered
// by the canvas client.
enum PlanStatus {
  PLAN_STATUS_UNSPECIFIED = 0;
  PLAN_STATUS_PROPOSED = 1;
  PLAN_STATUS_VALIDATED = 2;
  PLAN_STATUS_AWAITING_CONFIRMATION = 3;
  PLAN_STATUS_GENERATING = 4;
  PLAN_STATUS_APPLIED = 5;
  PLAN_STATUS_PARTIAL_APPLIED = 6;
  PLAN_STATUS_REJECTED = 7;
}

// ArchLayer is the architectural-layer classification used by
// LayerPolicy + LayerCheck. Mirrors messages.ArchLayer in Go;
// the wire enum exists so the canvas client can render layer
// chips without a string-to-enum conversion.
enum ArchLayer {
  ARCH_LAYER_UNSPECIFIED = 0;
  ARCH_LAYER_PRESENTATION = 1;
  ARCH_LAYER_DOMAIN = 2;
  ARCH_LAYER_DATA = 3;
  ARCH_LAYER_API = 4;
  ARCH_LAYER_INFRA = 5;
  ARCH_LAYER_SHARED = 6;
  ARCH_LAYER_UNKNOWN = 7;
}
