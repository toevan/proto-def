syntax = "proto3";

package korelink.v1;

option go_package = "github.com/kore-services/api-server/gen/korelink/v1;korelinkv1";

import "google/protobuf/timestamp.proto";

// ============================================
// OrgService — Organization Management & Invitations
// ============================================

service OrgService {
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse);
  rpc GetOrg(GetOrgRequest) returns (GetOrgResponse);
  rpc UpdateOrg(UpdateOrgRequest) returns (UpdateOrgResponse);

  // Tier change for an organisation — the dedicated admin-only RPC that
  // CreateOrgRequest field 5's tombstone points at. Deliberately NOT part of
  // UpdateOrg: the tier is commercial state, gated on payment authorization and on
  // a STRICT org-admin check (platform staff may not make the customer's
  // commercial decision), while UpdateOrg edits presentation fields.
  rpc AssignOrgPlan(AssignOrgPlanRequest) returns (AssignOrgPlanResponse);

  // GetBillingOverview is what the billing page renders: the org's REAL plan, and
  // usage measured against what that plan advertises. Everything here is
  // usage-visibility, which every tier includes; cost/spend breakdowns are a
  // separate, sold capability and deliberately not in this message.
  rpc GetBillingOverview(GetBillingOverviewRequest) returns (GetBillingOverviewResponse);

  // List orgs
  rpc ListMyOrgs(ListMyOrgsRequest) returns (ListMyOrgsResponse);                // caller's own orgs (from JWT)
  rpc ListUserOrgs(ListUserOrgsRequest) returns (ListUserOrgsResponse);           // admin: orgs for a specific user
  rpc ListAllOrgs(ListAllOrgsRequest) returns (ListAllOrgsResponse);              // admin: every org on the platform
  rpc ListGitHubOrgs(ListGitHubOrgsRequest) returns (ListGitHubOrgsResponse);

  // Member management (adding members goes through InviteMember → AcceptInvitation flow)
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);

  // OrgInvitation workflow
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse);
  // Invitee-scoped preview: the authenticated caller may view an invitation
  // only when their email matches the invitee's — the accept page needs to
  // show WHAT you are joining before you commit. Returns any status so the
  // client can render accepted/expired/revoked honestly.
  rpc GetInvitation(GetInvitationRequest) returns (GetInvitationResponse);
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);
  rpc DeclineInvitation(DeclineInvitationRequest) returns (DeclineInvitationResponse);
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
  rpc ResendInvitation(ResendInvitationRequest) returns (ResendInvitationResponse);

  // Audit log queries
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);
  // Compliance export of the org's admin activity log as CSV. Same filters,
  // authorization (org admin) and plan gate (FeatureAuditLog) as
  // ListAuditLogs; the export is row-capped server-side and reports
  // truncation honestly so a partial file is never mistaken for the whole
  // history.
  rpc ExportAuditLogsCsv(ExportAuditLogsCsvRequest) returns (ExportAuditLogsCsvResponse);
}

// ── Core Types ──

message OrgPlanConfig {
  OrgPlan plan = 1;
  int32 seat_limit = 2;
  int32 seat_used = 3;
  int32 repo_limit = 4;
  int32 repo_used = 5;
}

message Org {
  string id = 1;
  string name = 2;                       // "Acme Corporation"
  string handle = 3;                     // "acme-corp"
  string avatar_url = 4;
  string initials = 5;                   // [NEW] "AC" — for avatar fallback when no image
  string color = 6;                      // [NEW] "#295581" — avatar background color
  OrgPlanConfig plan_config = 7;
  string github_org = 8;               // linked GitHub organization
  string github_installation_id = 9;   // GitHub App installation ID
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  // Which kind of account this is: "personal" (the auto-created single-user
  // workspace, named after its owner) or "team". Carried so clients can
  // present personal workspaces as what they are (the owner's identity +
  // a Personal tag) instead of as an oddly-named organisation.
  string kind = 12;
  // Numeric GitHub id for a personal account (the owner's GitHub user id), so a
  // client can deep-link straight to the account's App install/authorize page
  // (target_id + target_type=User) instead of GitHub's account picker. 0 when
  // unknown / not a personal account.
  int64 github_id = 13;
}

// Organization-level plan — governs org-wide limits (seats, repos, features).
// Distinct from UserPlan (defined in auth.proto) which governs individual user access.
enum OrgPlan {
  ORG_PLAN_UNSPECIFIED = 0;
  ORG_PLAN_FREE = 1;                     // 2 repos, 3 seats
  ORG_PLAN_TEAM = 2;                     // 10 repos, 15 seats
  ORG_PLAN_ENTERPRISE = 3;              // unlimited repos, unlimited seats, SSO, audit
  ORG_PLAN_PLATFORM = 4;                // KoreLink HQ internal — not user-facing
}

message OrgMember {
  string user_id = 1;
  string org_id = 2;
  string name = 3;
  string email = 4;
  string avatar_url = 5;
  string initials = 6;                   // [NEW] avatar initials fallback
  string color = 7;                      // [NEW] avatar color
  OrgRole role = 8;
  google.protobuf.Timestamp joined_at = 9;
  google.protobuf.Timestamp last_active_at = 10;
}

enum OrgRole {
  ORG_ROLE_UNSPECIFIED = 0;
  ORG_ROLE_ADMIN = 1;                    // full org access
  ORG_ROLE_DEVELOPER = 2;               // repos, PRs, fix violations
  ORG_ROLE_TEAM_LEAD = 3;               // approve exceptions, manage team
  ORG_ROLE_COMPLIANCE = 4;              // exception approval, evidence trail, risk
  ORG_ROLE_CISO = 5;                    // escalated exception approval
  ORG_ROLE_VIEWER = 6;                  // read-only
  ORG_ROLE_PLATFORM = 8;               // [NEW] KoreLink HQ superadmin
  // NOTE: No "author" role — blueprint publishing is a capability, not a role.
  // Any user can create/publish blueprints.
}

// ── Invitation types [NEW] ──

// Invitation is org-level only. It assigns an OrgRole to the invitee.
// Project assignment (which projects + what permission) is a SEPARATE operation
// handled by ProjectService.AddProjectMember after the user joins the org.
message Invitation {
  string id = 1;
  string org_id = 2;
  string email = 3;
  OrgRole role = 4;
  InvitationStatus status = 5;
  google.protobuf.Timestamp sent_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  string invited_by_id = 8;
  string invited_by_name = 9;
}

enum InvitationStatus {
  INVITATION_STATUS_UNSPECIFIED = 0;
  INVITATION_STATUS_PENDING = 1;
  INVITATION_STATUS_ACCEPTED = 2;
  INVITATION_STATUS_EXPIRED = 3;
  INVITATION_STATUS_REVOKED = 4;
}

// ── GitHub Org Discovery [NEW] ──

// An installable GitHub account — an organisation, or the caller's own.
message GitHubOrg {
  string handle = 1;                      // "acme-corp"
  string name = 2;                       // "Acme Corporation"
  string avatar_url = 3;
  bool already_connected = 4;            // true if already linked to a KoreLink org
  string existing_org_id = 5;            // KoreLink org ID if already connected
  int64 github_id = 6;                   // numeric GitHub org ID (for installation deep-link)
  bool app_installed = 7;                // true if KoreLink GitHub App is installed on this org

  // How many repositories the installation can actually reach.
  //
  // app_installed answers "does an installation record exist on GitHub", which
  // stays true when every repository has been deselected — so it cannot be used
  // to decide whether KoreLink has anything to work with. This is that fact.
  // 0 with app_installed=true means the app is installed but shares no repos.
  int32 accessible_repo_count = 8;

  // True when the CALLER is a member of existing_org_id. Meaningful only
  // when already_connected — it is what separates "switch to your
  // workspace" from "this org is on KoreLink, ask an admin for an invite"
  // (invitations are the ONLY join path). already_connected alone is
  // account-EXISTENCE, resolved by GitHub handle globally, and says
  // nothing about the caller's access.
  bool is_member = 9;
}

// ── Requests/Responses ──

message CreateOrgRequest {
  string name = 1;
  string handle = 2;
  string initials = 3;                   // [NEW]
  string color = 4;                      // [NEW]
  // Field 5 was `OrgPlan plan`. Removed: a new org's tier is a SERVER GRANT, never a client
  // claim. Accepting it let any caller self-assign Enterprise — unlimited seats and repos,
  // the Deep Check entitlement, and tier-1 index-queue priority ahead of paying customers.
  // Never recycle this number. Tier changes belong on a dedicated admin-only RPC.
  reserved 5;
  reserved "plan";
  string github_org = 6;
}
message CreateOrgResponse { Org org = 1; }

message GetOrgRequest { string org_id = 1; }
message GetOrgResponse { Org org = 1; }

message UpdateOrgRequest {
  string org_id = 1;
  string name = 2;
}
message UpdateOrgResponse { Org org = 1; }

message AssignOrgPlanRequest {
  string org_id = 1;
  // The tier the org should hold after this call. ORG_PLAN_UNSPECIFIED is rejected —
  // "no opinion" is not a plan, and defaulting it to anything would turn a
  // zero-initialised request into a tier change.
  OrgPlan plan = 2;
}
message AssignOrgPlanResponse {
  OrgPlan from = 1;
  OrgPlan to = 2;
  // False when the org already held the requested plan. The call is idempotent:
  // a retried delivery succeeds without writing a second audit row.
  bool changed = 3;
}

message GetBillingOverviewRequest { string org_id = 1; }

// One usage meter: consumption against what the plan ADVERTISES. The included
// number is the denominator; the enforcement ceiling is deliberately not reported,
// for the same reason OrgPlanConfig omits it — quoting it would advertise headroom
// we may withdraw.
message BillingUsageMeter {
  int64 used = 1;
  int64 included = 2;
  // hard | fair_use | contractual. Contractual means the included number is an
  // alerting threshold, not a gate — render "custom", never a lockout warning.
  string mode = 3;
}

message GetBillingOverviewResponse {
  OrgPlan plan = 1;
  BillingUsageMeter seats = 2;
  BillingUsageMeter repos = 3;
  // Current metering period. Uses the SAME arithmetic as enforcement, so this
  // number and a refusal can never disagree.
  BillingUsageMeter ai_operations = 4;
  // First day of the AI metering period (YYYY-MM-DD).
  string ai_period_start = 5;
  // Payment method and invoices are DELIBERATELY ABSENT: no payment provider
  // exists, so there is nothing true to return. Clients render honest empty
  // states rather than fabricated records.
}

// Authenticated user's own orgs — no input needed, identity from JWT
message ListMyOrgsRequest {
  int32 limit = 1;
  int32 offset = 2;
}
message ListMyOrgsResponse {
  repeated OrgWithRole orgs = 1;
  int32 total = 2;
}

// Admin: list orgs for a specific user
message ListUserOrgsRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListUserOrgsResponse {
  repeated OrgWithRole orgs = 1;
  int32 total = 2;
}

// Admin: list every org on the platform
message ListAllOrgsRequest {
  int32 limit = 1;
  int32 offset = 2;
  OrgPlan plan_filter = 3;              // optional: filter by plan tier
  string search = 4;                    // optional: search by name/handle
}
message ListAllOrgsResponse {
  repeated Org orgs = 1;
  int32 total = 2;
}

message OrgWithRole {
  Org org = 1;
  OrgRole my_role = 2;                   // the caller's role in this org

  // Whether this account's onboarding is COMPLETE: dismissed, or the three
  // core milestones (GitHub connected + project created + repo added) all
  // latched. Computed by the server from onboarding_progress so clients
  // never re-derive the verdict — the client-side derivation read whichever
  // account the list happened to put first (alphabetically, which places the
  // auto-created personal account before most orgs) and looped fully
  // onboarded users back into the wizard on every login.
  bool onboarding_completed = 3;
}

message ListGitHubOrgsRequest {}          // uses auth token to discover GitHub orgs
message ListGitHubOrgsResponse {
  repeated GitHubOrg orgs = 1;

  // The caller's OWN GitHub account, described with the same fields.
  //
  // A personal account is installable exactly like an organisation — the App is
  // installed on it, shares repositories with it, and can already have a
  // KoreLink workspace. Onboarding could not say any of that about it, so the
  // personal option had no install state to show and no gate to apply, while
  // the organisation beside it had both.
  //
  // Unset when the caller's GitHub login is unknown.
  GitHubOrg personal_account = 2;
}

message RemoveMemberRequest {
  string org_id = 1;
  string user_id = 2;
}
message RemoveMemberResponse {
  bool success = 1;
  string error = 2;
}

message UpdateMemberRoleRequest {
  string org_id = 1;
  string user_id = 2;
  OrgRole role = 3;
}
message UpdateMemberRoleResponse {
  bool success = 1;
  string error = 2;
}

message ListMembersRequest {
  string org_id = 1;
  OrgRole role_filter = 2;              // optional filter
  int32 limit = 3;
  int32 offset = 4;
}
message ListMembersResponse {
  repeated OrgMember members = 1;
  int32 total = 2;
}

// ── Invitation Requests [NEW] ──

// Invites a user to the org with an org-level role.
// To also add them to a project, call ProjectService.AddProjectMember separately.
message InviteMemberRequest {
  string org_id = 1;
  string email = 2;
  OrgRole role = 3;
}
message InviteMemberResponse {
  bool success = 1;
  string error = 2;
  Invitation invitation = 3;
}

message ListInvitationsRequest {
  string org_id = 1;
  InvitationStatus status_filter = 2;
  int32 limit = 3;
  int32 offset = 4;
}
message ListInvitationsResponse {
  repeated Invitation invitations = 1;
  int32 total = 2;
}

message GetInvitationRequest {
  string invitation_id = 1;
}
message GetInvitationResponse {
  Invitation invitation = 1;
  Org org = 2;  // display summary of the inviting org
}

// Invitee accepts — server creates OrgMember, sets invitation status to ACCEPTED
message AcceptInvitationRequest {
  string invitation_id = 1;
}
message AcceptInvitationResponse {
  bool success = 1;
  string error = 2;
  Org org = 3;                                     // the org the user just joined
  OrgRole role = 4;                                // the role they were assigned
}

// Invitee declines — server sets invitation status to REVOKED
message DeclineInvitationRequest {
  string invitation_id = 1;
}
message DeclineInvitationResponse {
  bool success = 1;
  string error = 2;
}

message RevokeInvitationRequest { string invitation_id = 1; }
message RevokeInvitationResponse {
  bool success = 1;
  string error = 2;
}

message ResendInvitationRequest { string invitation_id = 1; }
message ResendInvitationResponse {
  bool success = 1;
  string error = 2;
}

// ---- Audit Logs ----

message AuditLogEntry {
  string id = 1;
  string org_id = 2;
  string actor_id = 3;
  string actor_email = 4;
  string action = 5;
  string resource_type = 6;
  string resource_id = 7;
  string metadata_json = 8;                           // JSON-encoded action-specific details
  string ip_address = 9;
  string user_agent = 10;
  google.protobuf.Timestamp created_at = 11;
}

message ListAuditLogsRequest {
  string org_id = 1;
  string action_filter = 2;                           // optional: filter by action type
  string actor_id_filter = 3;                         // optional: filter by actor
  string resource_type_filter = 4;                    // optional: filter by resource type
  google.protobuf.Timestamp since = 5;                // optional: start of date range
  google.protobuf.Timestamp until = 6;                // optional: end of date range
  int32 limit = 7;
  int32 offset = 8;
}
message ListAuditLogsResponse {
  repeated AuditLogEntry entries = 1;
  int32 total = 2;
}

message ExportAuditLogsCsvRequest {
  string org_id = 1;
  string action_filter = 2;
  string actor_id_filter = 3;
  string resource_type_filter = 4;
  google.protobuf.Timestamp since = 5;
  google.protobuf.Timestamp until = 6;
}
message ExportAuditLogsCsvResponse {
  bytes csv = 1;                 // UTF-8 CSV with a header row
  string filename = 2;           // suggested download name
  int32 row_count = 3;           // data rows in the file
  // True when the org's matching history exceeds the server-side export cap
  // — the file holds the MOST RECENT row_count rows; narrow the date range
  // for the rest.
  bool truncated = 4;
}