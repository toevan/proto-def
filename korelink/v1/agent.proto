syntax = "proto3";

package korelink.v1;

option go_package = "github.com/kore-services/api-server/gen/korelink/v1;korelinkv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// ============================================
// Agent Orchestration Service
// ============================================

service AgentService {
  // Config CRUD
  rpc CreateAgentConfig(CreateAgentConfigRequest) returns (CreateAgentConfigResponse);
  rpc GetAgentConfig(GetAgentConfigRequest) returns (GetAgentConfigResponse);
  rpc ListAgentConfigs(ListAgentConfigsRequest) returns (ListAgentConfigsResponse);
  rpc UpdateAgentConfig(UpdateAgentConfigRequest) returns (UpdateAgentConfigResponse);
  rpc DeleteAgentConfig(DeleteAgentConfigRequest) returns (DeleteAgentConfigResponse);

  // Runs
  rpc TriggerAgentRun(TriggerAgentRunRequest) returns (TriggerAgentRunResponse);
  rpc GetAgentRun(GetAgentRunRequest) returns (GetAgentRunResponse);
  rpc ListAgentRuns(ListAgentRunsRequest) returns (ListAgentRunsResponse);
  rpc CancelAgentRun(CancelAgentRunRequest) returns (CancelAgentRunResponse);

  // Streaming
  rpc StreamAgentProgress(StreamAgentProgressRequest) returns (stream AgentProgressUpdate);

  // Steps & Logs
  rpc ListAgentSteps(ListAgentStepsRequest) returns (ListAgentStepsResponse);
  rpc ListAgentLogs(ListAgentLogsRequest) returns (ListAgentLogsResponse);

  // Analytics
  rpc GetAgentAnalytics(GetAgentAnalyticsRequest) returns (GetAgentAnalyticsResponse);

  // Task ingestion + approval
  rpc IngestTask(IngestTaskRequest) returns (IngestTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc ApproveTaskPlan(ApproveTaskPlanRequest) returns (ApproveTaskPlanResponse);
  rpc RejectTaskPlan(RejectTaskPlanRequest) returns (RejectTaskPlanResponse);
}

// ── Enums ──

enum AgentType {
  AGENT_TYPE_UNSPECIFIED = 0;
  AGENT_TYPE_PR_REVIEW = 1;
  AGENT_TYPE_VIOLATION_FIX = 2;
  AGENT_TYPE_IMPLEMENTATION = 3;
  AGENT_TYPE_MIGRATION = 4;
}

enum AgentRunStatus {
  AGENT_RUN_STATUS_UNSPECIFIED = 0;
  AGENT_RUN_STATUS_QUEUED = 1;
  AGENT_RUN_STATUS_RUNNING = 2;
  AGENT_RUN_STATUS_COMPLETED = 3;
  AGENT_RUN_STATUS_FAILED = 4;
  AGENT_RUN_STATUS_CANCELLED = 5;
}

enum AgentScope {
  AGENT_SCOPE_UNSPECIFIED = 0;
  AGENT_SCOPE_ORG = 1;
  AGENT_SCOPE_PROJECT = 2;
  AGENT_SCOPE_REPO = 3;
}

// ── Core Messages ──

message AgentConfig {
  string id = 1;
  string org_id = 2;
  string project_id = 3;
  string repo_id = 4;
  AgentType agent_type = 5;
  AgentScope scope = 6;
  bool enabled = 7;
  google.protobuf.Struct settings = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message AgentRun {
  string id = 1;
  string org_id = 2;
  string repo_id = 3;
  AgentType agent_type = 4;
  AgentRunStatus status = 5;
  string trigger = 6;
  string trigger_ref = 7;
  string summary = 8;
  string error_message = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp completed_at = 11;
  int32 duration_ms = 12;
  google.protobuf.Timestamp created_at = 13;
}

message AgentStep {
  string id = 1;
  string run_id = 2;
  int32 step_number = 3;
  string name = 4;
  AgentRunStatus status = 5;
  string message = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp completed_at = 8;
  int32 duration_ms = 9;
}

message AgentLog {
  int64 id = 1;
  string run_id = 2;
  string level = 3;
  string message = 4;
  google.protobuf.Timestamp created_at = 5;
}

// ── Config Requests ──

message CreateAgentConfigRequest {
  string org_id = 1;
  string project_id = 2;           // optional
  string repo_id = 3;              // optional
  AgentType agent_type = 4;
  AgentScope scope = 5;
  bool enabled = 6;
  google.protobuf.Struct settings = 7;
}

message CreateAgentConfigResponse { AgentConfig config = 1; }

message GetAgentConfigRequest { string config_id = 1; }
message GetAgentConfigResponse { AgentConfig config = 1; }

message ListAgentConfigsRequest { string org_id = 1; }
message ListAgentConfigsResponse { repeated AgentConfig configs = 1; }

message UpdateAgentConfigRequest {
  string config_id = 1;
  bool enabled = 2;
  google.protobuf.Struct settings = 3;
}
message UpdateAgentConfigResponse { AgentConfig config = 1; }

message DeleteAgentConfigRequest { string config_id = 1; }
message DeleteAgentConfigResponse { bool success = 1; }

// ── Run Requests ──

message TriggerAgentRunRequest {
  string org_id = 1;
  string repo_id = 2;              // optional
  AgentType agent_type = 3;
  string trigger = 4;              // "manual", "webhook", "scheduled"
  string trigger_ref = 5;          // PR number, commit SHA, etc.
  google.protobuf.Struct params = 6;
}
message TriggerAgentRunResponse { AgentRun run = 1; }

message GetAgentRunRequest { string run_id = 1; }
message GetAgentRunResponse {
  AgentRun run = 1;
  repeated AgentStep steps = 2;
}

message ListAgentRunsRequest {
  string org_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListAgentRunsResponse {
  repeated AgentRun runs = 1;
}

// ── Cancel ──

message CancelAgentRunRequest { string run_id = 1; }
message CancelAgentRunResponse { bool success = 1; }

// ── Streaming ──

message StreamAgentProgressRequest { string run_id = 1; }

message AgentProgressUpdate {
  string run_id = 1;
  string phase = 2;
  int32 step = 3;
  string message = 4;
  AgentRunStatus status = 5;
  bool completed = 6;

  // Typed failure category, set on terminal frames where
  // `status == AGENT_RUN_STATUS_FAILED`. Lets clients switch on a
  // stable enum instead of substring-matching the free-form
  // `message`. UNSPECIFIED on success frames OR when the runner
  // returned a failure shape the executor couldn't classify
  // (clients should fall back to `message` parsing then).
  //
  // Wire-stable: enum values mirror the metric outcome labels
  // emitted by [internal/agent/fixapply.observeOutcome] so
  // server-side analytics + client-side branching see the same
  // categorization.
  AgentRunFailureCode failure_code = 7;

  // Optional structured failure metadata. Set when
  // `failure_code == AGENT_RUN_FAILURE_CODE_REFACTOR_BLAST_RADIUS`
  // and the runner attributed the failure to Phase A
  // (blast-radius static analysis) or Phase B (build/lint
  // validation). Empty on success / non-terminal frames OR when
  // the failure code is anything other than
  // `REFACTOR_BLAST_RADIUS`.
  //
  // Lets the canvas client render structured operator-readable
  // detail (renamed symbol, uncovered callers, build errors)
  // instead of a generic toast — load-bearing for the
  // KoreLink value proposition: a fix the agent rejects MUST
  // surface WHY at file:line precision, not just "blast-radius
  // exceeded."
  BlastRadiusFailureMetadata blast_radius_metadata = 8;

  // PR coordinates set on the terminal success frame
  // (`completed == true && status == AGENT_RUN_STATUS_COMPLETED`)
  // for runners that open or update a pull request as their
  // outcome (currently fixapply; future PR-producing runners
  // populate the same pair). Empty / zero on:
  //
  //   - non-terminal frames
  //   - terminal failure frames
  //   - success frames from runners that don't produce a PR
  //
  // Wire contract: clients use these fields directly to render
  // a "View PR" CTA on completion; they MUST NOT substring-parse
  // [message] to find the URL (fragile + drift-prone). The
  // server-side runner records the same pair in
  // `agent_runs.metadata` for post-hoc lookup; the streaming
  // fields are the load-bearing path for live UX.
  string pr_url = 9;
  int32 pr_number = 10;
}

// BlastRadiusFailureMetadata carries the structured payload
// the canvas client needs to render Phase A / Phase B failure
// detail. Mirrors the in-process metadata the runner writes to
// `agent_runs.metadata` after a fail-closed validation
// outcome (see internal/agent/fixapply/runner.go).
//
// Phase discriminator:
//
//   - BLAST_RADIUS_PHASE_BLAST_RADIUS_BLOCKED: Phase A
//     (rename detection + graph-backed caller search). The
//     agent's FixPlan renamed a symbol but didn't update all
//     its callers. `renames` + `uncovered` are populated;
//     `language` / `build_errors` / `truncated` are empty.
//
//   - BLAST_RADIUS_PHASE_BUILD_VALIDATE_BLOCKED: Phase B
//     (post-plan build/lint). The agent's mutated worktree
//     produced analyzer errors. `language` + `build_errors`
//     + `truncated` are populated; `renames` / `uncovered`
//     are empty.
message BlastRadiusFailureMetadata {
  BlastRadiusPhase phase = 1;

  // Phase A: the per-hunk rename candidates the validator
  // detected, in detection order. Always populated on Phase A
  // Blocked even when only some have uncovered callers — the
  // detection list itself is operator-relevant signal.
  repeated SymbolRename renames = 2;

  // Phase A: the uncovered caller list per detected rename.
  // Each entry's `rename_index` points back into `renames` so
  // the client can pair "this rename" with "these uncovered
  // callers." Renames with all callers covered by hunks in
  // the FixPlan don't appear here.
  repeated UncoveredCallerEntry uncovered = 3;

  // Phase B: the language identifier of the project (matches
  // pkg/base/language_registry canonical IDs:
  // "go" / "dart" / "typescript" / "javascript" /
  // "python" / "java"). Empty on Phase A frames.
  string language = 4;

  // Phase B: the parsed analyzer errors from the language
  // tool's output. Capped server-side at MaxBuildErrors;
  // `truncated` set when more existed than the cap allowed.
  repeated BuildError build_errors = 5;

  // Phase B: true when the parser hit MaxBuildErrors and
  // capped the result. Operators see "more errors exist
  // than what's listed" in the UI so they don't assume the
  // listed set is complete.
  bool truncated = 6;
}

// BlastRadiusPhase distinguishes which validation phase
// fail-closed the run. Stable wire surface — the canvas
// client switches on these values to render Phase A vs
// Phase B detail panes. Append, never renumber.
enum BlastRadiusPhase {
  BLAST_RADIUS_PHASE_UNSPECIFIED = 0;
  BLAST_RADIUS_PHASE_BLAST_RADIUS_BLOCKED = 1;   // Phase A
  BLAST_RADIUS_PHASE_BUILD_VALIDATE_BLOCKED = 2; // Phase B
}

// SymbolRename mirrors the validator's per-hunk rename
// detection product (internal/agent/fixapply/blastradius.SymbolRename).
// Field-for-field 1:1; the client renders these in a
// human-readable rename table.
message SymbolRename {
  // Worktree-relative path the rename was detected in.
  string file_path = 1;

  // Language identifier (matches pkg/base/language_registry).
  string language = 2;

  // The symbol name BEFORE the rename — this is what callers
  // currently reference and what the build will fail on if
  // they're not updated.
  string original_identifier = 3;

  // The symbol name AFTER the rename. Empty allowed for
  // pure-deletion renames (rare).
  string replacement_identifier = 4;

  // Classification of the renamed symbol (const/var/func/
  // class/type/etc.). Stable for metric labels + UI badges.
  string declaration_kind = 5;

  // Whether the symbol's visibility makes it a candidate for
  // cross-file callers. Internal symbols can sometimes be
  // renamed safely; the validator surfaces them anyway so the
  // operator gets the full detection picture.
  bool is_exported = 6;
}

// UncoveredCallerEntry pairs one rename (by index into
// BlastRadiusFailureMetadata.renames) with the set of caller
// files that still reference its `original_identifier` and
// AREN'T covered by any hunk in the FixPlan.
message UncoveredCallerEntry {
  // Index into BlastRadiusFailureMetadata.renames identifying
  // which detected rename has uncovered callers. Stable
  // within one frame.
  int32 rename_index = 1;

  // The caller file:line list. Always populated when the entry
  // is present — entries with empty hits aren't emitted.
  CallerSet callers = 2;
}

// CallerSet is the result for one rename: caller hits in
// worktree order + truncation flag.
message CallerSet {
  // Caller hits in worktree order (deterministic across runs
  // for reproducible failure metadata + diffable across
  // re-dispatches).
  repeated CallerHit hits = 1;

  // True when more matches existed than MaxCallerHits — the
  // client surfaces this as "more callers exist than what's
  // listed" so operators don't assume the list is complete.
  bool truncated = 2;
}

// CallerHit is one caller-file location that needs updating
// for the rename to be safe. The canvas client renders each
// hit as a clickable row; tapping it jumps the code viewer to
// `file_path:line`.
message CallerHit {
  // Worktree-relative path of the caller file.
  string file_path = 1;

  // 1-based line where the caller-symbol was found.
  int32 line = 2;

  // 1-based column. May be 0 when the search backend can't
  // resolve column-precision (graph-backed search returns 1
  // by convention when the source is not in the graph).
  int32 column = 3;

  // Short snippet of the matching context — typically the
  // caller's containing symbol name. Surfaced in the failure
  // pane so operators can eyeball whether the hit is a real
  // caller or a false positive.
  string snippet = 4;
}

// BuildError mirrors the Phase B parser's classified output
// (internal/agent/fixapply/buildvalidate.BuildError). Each
// entry is one analyzer diagnostic the post-plan build
// surfaced.
message BuildError {
  // Worktree-relative (or absolute, depending on the language
  // tool) path the diagnostic targets.
  string file_path = 1;

  // 1-based line.
  int32 line = 2;

  // 1-based column. May be 0 for tools that don't surface
  // columns (Go's `go build` without vet, for example).
  int32 column = 3;

  // Language-agnostic taxonomy bucket. Drives the UI's
  // grouping + icon: unresolved-identifier renders as a
  // "missing reference" badge, type-mismatch as a "type
  // error" badge, syntax-error as a "broken parse" badge.
  BuildErrorClass class = 4;

  // The analyzer's verbatim diagnostic text. Surfaced in the
  // UI so operators can triage without re-running the build.
  string message = 5;
}

// BuildErrorClass is the language-agnostic taxonomy the
// Phase B parser classifies each analyzer entry into. Stable
// wire surface — the canvas UI groups + colors by these.
// Append new values, never renumber.
enum BuildErrorClass {
  BUILD_ERROR_CLASS_UNSPECIFIED = 0;
  // Default bucket — parser matched a build-error line but
  // couldn't classify it more specifically.
  BUILD_ERROR_CLASS_UNKNOWN = 1;
  // The class Phase A is designed to catch: rename without
  // caller updates → undefined symbol at every caller site.
  BUILD_ERROR_CLASS_UNRESOLVED_IDENTIFIER = 2;
  // Caller exists but type signature disagrees with the
  // renamed declaration.
  BUILD_ERROR_CLASS_TYPE_MISMATCH = 3;
  // Parser-level error — the agent's edit produced
  // unparseable source. Should be rare.
  BUILD_ERROR_CLASS_SYNTAX_ERROR = 4;
}

// Stable wire surface for terminal failure categorization on
// AgentProgressUpdate frames. Mirror of the metric-outcome
// labels in [internal/agent/fixapply.metrics.go]. Append new
// values, never renumber.
enum AgentRunFailureCode {
  AGENT_RUN_FAILURE_CODE_UNSPECIFIED = 0;          // success OR unmapped failure
  AGENT_RUN_FAILURE_CODE_LOOP_CAPPED = 1;          // attempt cap reached; admin clear required
  AGENT_RUN_FAILURE_CODE_AGENT_GAVE_UP = 2;        // planner returned empty hunks
  AGENT_RUN_FAILURE_CODE_PARSE_FAILED = 3;         // agentloop output failed to parse
  AGENT_RUN_FAILURE_CODE_PR_OPEN_FAILED = 4;       // GitHub PR-open call errored
  AGENT_RUN_FAILURE_CODE_VALIDATE_FAILED = 5;      // input validation rejected the run
  AGENT_RUN_FAILURE_CODE_AGENTLOOP_FAILED = 6;     // runtime error inside the agentloop
  AGENT_RUN_FAILURE_CODE_PREFLIGHT_DB_ERROR = 7;   // idempotency pre-flight DB error
  AGENT_RUN_FAILURE_CODE_WORKTREE_FAILED = 8;      // resolver couldn't materialize the worktree
  AGENT_RUN_FAILURE_CODE_MARSHAL_FAILED = 9;       // dispatcher couldn't serialize Params
  AGENT_RUN_FAILURE_CODE_REFACTOR_BLAST_RADIUS = 10; // FixPlan rename has uncovered callers OR post-fix build failed; see docs/architecture/refactor-blast-radius-validation.md
}

// ── Steps & Logs ──

message ListAgentStepsRequest { string run_id = 1; }
message ListAgentStepsResponse { repeated AgentStep steps = 1; }

message ListAgentLogsRequest {
  string run_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message ListAgentLogsResponse { repeated AgentLog logs = 1; }

// ── Analytics ──

message GetAgentAnalyticsRequest { string org_id = 1; }

message AgentTypeBreakdown {
  AgentType agent_type = 1;
  int32 total = 2;
  int32 passed = 3;
  int32 failed = 4;
}

message GetAgentAnalyticsResponse {
  string org_id = 1;
  int32 total_runs = 2;
  int32 passed_runs = 3;
  int32 failed_runs = 4;
  repeated AgentTypeBreakdown by_type = 5;
}

// ── Task Ingestion + Approval ──

enum AgentTaskStatus {
  AGENT_TASK_STATUS_UNSPECIFIED = 0;
  AGENT_TASK_STATUS_INGESTED = 1;
  AGENT_TASK_STATUS_PLANNING = 2;
  AGENT_TASK_STATUS_PENDING_APPROVAL = 3;
  AGENT_TASK_STATUS_APPROVED = 4;
  AGENT_TASK_STATUS_EXECUTING = 5;
  AGENT_TASK_STATUS_COMPLETED = 6;
  AGENT_TASK_STATUS_FAILED = 7;
  AGENT_TASK_STATUS_REJECTED = 8;
}

message AgentTask {
  string id = 1;
  string org_id = 2;
  string repo_id = 3;
  string source_type = 4;
  string source_id = 5;
  string source_url = 6;
  string title = 7;
  string description = 8;
  string priority = 9;
  repeated string labels = 10;
  AgentTaskStatus status = 11;
  google.protobuf.Struct plan = 12;
  bool plan_approved = 13;
  string plan_approved_by = 14;
  google.protobuf.Timestamp plan_approved_at = 15;
  string plan_rejected_reason = 16;
  string agent_run_id = 17;
  string result_pr_url = 18;
  string result_summary = 19;
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
}

message IngestTaskRequest {
  string org_id = 1;
  string repo_id = 2;
  string source_type = 3;
  string source_id = 4;
  string source_url = 5;
  string title = 6;
  string description = 7;
  string priority = 8;
  repeated string labels = 9;
}
message IngestTaskResponse { AgentTask task = 1; }

message GetTaskRequest { string task_id = 1; }
message GetTaskResponse { AgentTask task = 1; }

message ListTasksRequest {
  string org_id = 1;
  AgentTaskStatus status = 2;   // optional filter
  int32 limit = 3;
  int32 offset = 4;
}
message ListTasksResponse { repeated AgentTask tasks = 1; }

message ApproveTaskPlanRequest {
  string task_id = 1;
  string approver_id = 2;
}
message ApproveTaskPlanResponse { bool success = 1; }

message RejectTaskPlanRequest {
  string task_id = 1;
  string reason = 2;
}
message RejectTaskPlanResponse { bool success = 1; }
