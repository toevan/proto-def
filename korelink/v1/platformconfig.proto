syntax = "proto3";

package korelink.v1;

option go_package = "github.com/kore-services/api-server/gen/korelink/v1;korelinkv1";

// ===================================================================
// PlatformConfigService — platform-admin runtime config
// ===================================================================
//
// DB-backed, admin-editable operational config knobs (LSP/indexer, AI,
// Stage 3, agentloop, Evidence) that propagate to every process WITHOUT a
// restart. Platform-global (not org-scoped); all RPCs require the platform
// admin role. A knob's tier records how live a change is: A = applies
// immediately, B = applies via a reconfigure seam, C = applies on restart.
service PlatformConfigService {
  // ListConfig returns every catalogued knob with its live value, default,
  // tier, and whether it is currently overridden.
  rpc ListConfig(ListConfigRequest) returns (ListConfigResponse);

  // UpdateConfig validates and persists a new value for one knob, then
  // propagates it. Returns the updated knob view.
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);

  // ResetConfig removes a knob's override so it reverts to the env/struct
  // default, then propagates. Returns the (now default) knob view.
  rpc ResetConfig(ResetConfigRequest) returns (ResetConfigResponse);

  // GetConfigConvergence reports, per live process, which config revision it has
  // applied (plus per-process apply/failure counts) — so an admin can confirm an
  // edit propagated to every process, see which lag, and read aggregate activity.
  // Each process self-reports to a shared store with a heartbeat TTL; a fully-dead
  // process simply stops appearing (consensus among live reporters, no configured
  // expected count).
  rpc GetConfigConvergence(GetConfigConvergenceRequest) returns (GetConfigConvergenceResponse);

  // ListConfigAudit returns the config change history (newest first, across all
  // knobs) for the admin dashboard: which knob changed, old→new, by whom, when.
  rpc ListConfigAudit(ListConfigAuditRequest) returns (ListConfigAuditResponse);

  // ── Plan entitlements ──
  //
  // The commercial limits every plan grants: repositories, seats, AI operations.
  // Modelled as STRUCTURED ROWS rather than as flat dotted knobs, because they are
  // not independent scalars — a ceiling below its own included number is refused by
  // the database, and pretending otherwise would let an admin save a row the schema
  // rejects. They live on this service anyway so they inherit its admin gate and its
  // audit trail rather than growing a second operator surface.

  // ListPlanEntitlements returns every plan on both axes with its current limits and
  // whether an operator has overridden it.
  rpc ListPlanEntitlements(ListPlanEntitlementsRequest) returns (ListPlanEntitlementsResponse);

  // UpdatePlanEntitlement sets the limits for one plan and marks the row
  // operator-owned, so seed reconciliation stops overwriting it on deploy.
  rpc UpdatePlanEntitlement(UpdatePlanEntitlementRequest) returns (UpdatePlanEntitlementResponse);

  // ResetPlanEntitlement hands a plan back to the shipped default. The escape hatch
  // from a bad edit: the admin does not need to remember the original numbers.
  rpc ResetPlanEntitlement(ResetPlanEntitlementRequest) returns (ResetPlanEntitlementResponse);

  // AdjustAIAllowance credits (or claws back) AI-operation units against one
  // account's CURRENT metering period. The operator answer to "this customer is
  // locked out and support owes them headroom": negative units grant allowance,
  // positive units revoke a prior credit. Every adjustment is a terminal ledger row
  // naming the acting admin and the reason — a credit with no author or rationale is
  // indistinguishable from a metering bug.
  rpc AdjustAIAllowance(AdjustAIAllowanceRequest) returns (AdjustAIAllowanceResponse);

  // ── Billing overrides: refunds + credits (PRD_BILLING §4.6) ──────────────
  //
  // Money-movement overrides, platform admin only. They live on this service
  // for the same reason the plan block above does: to inherit its admin gate
  // rather than growing a second operator surface with its own authorization
  // to get wrong. The append-only refund/credit ledger rows record the acting
  // admin and the reason — the row IS the audit entry.

  // RefundPayment returns money to the customer for one captured payment.
  // Partial refunds are allowed; cumulative refunds never exceed the payment's
  // amount, and a payment whose full amount has been returned reads
  // `refunded`. ONE IDEMPOTENCY KEY == ONE REFUND: a retry with the same key
  // converges on the same refund without moving money twice. A refund the
  // gateway left unsettled (transport fault, or an async accept) returns
  // status `pending` — retry with the SAME key to converge; a new key would
  // be a second refund. Refunding is orthogonal to the subscription
  // lifecycle: cancelling, if wanted, is its own explicit action.
  rpc RefundPayment(RefundPaymentRequest) returns (RefundPaymentResponse);

  // GrantBillingCredit banks account credit — goodwill, a promo, or a refund
  // issued as credit instead of money back (`source` says which). Credit only
  // ever ADDS balance: it moves no money and touches no subscription.
  rpc GrantBillingCredit(GrantBillingCreditRequest) returns (GrantBillingCreditResponse);

  // ListPublicPlans is the PRICE LIST, readable without authentication.
  //
  // PUBLIC BY DESIGN, AND DELIBERATELY NARROWER THAN ListPlanEntitlements. It exists
  // so the marketing site stops carrying prices as translated copy — four locale
  // files that could each drift from the biller, and did: the page advertised
  // "$30 per repository" against a server that charges EUR30 per seat.
  //
  // What it OMITS is the security-relevant part. No `source` or `updated_by`: whether
  // a limit was hand-tuned, and by whom, is operator information and would leak the
  // existence and identity of platform staff. No ceilings: the fair-use headroom
  // above the advertised number is deliberately not advertised, because publishing it
  // makes it the real limit. Unlisted plans are excluded entirely rather than
  // returned with a null price, so Enterprise cannot be rendered as "EUR0" by a
  // client that mishandles the flag.
  rpc ListPublicPlans(ListPublicPlansRequest) returns (ListPublicPlansResponse);
}

// PublicPlan is one purchasable plan, as a prospective customer may see it.
message PublicPlan {
  string axis = 1;  // personal | team
  string plan = 2;
  PlanPrice price = 3;
  // Headline allowances — what the plan ADVERTISES, never the fair-use ceiling.
  int32 repos_included = 4;
  int32 seats_included = 5;
  int32 ai_operations_included = 6;
  // Capabilities the plan GRANTS, as stable identifiers. The consumer supplies its
  // own wording; publishing prose here would make marketing copy an API response and
  // put translation in the server.
  repeated string features = 7;
  // Capabilities ADVERTISED BUT NOT IMPLEMENTED. Separate from `features` so a
  // consumer cannot render a roadmap entry as though it were included — the pricing
  // page did exactly that with SSO, which the server has denied on every tier all
  // along. Both lists already ship on /v1/public/pricing; carrying them here too is
  // what stops the two doors onto this catalogue describing different products.
  repeated string planned_features = 8;
}

message ListPublicPlansRequest {}

message ListPublicPlansResponse {
  repeated PublicPlan plans = 1;
}

// PlanLimit is one metered allowance.
message PlanLimit {
  // What the plan advertises. Fair-use tiers warn here.
  int32 included = 1;
  // Where enforcement actually refuses. Must be >= included; the database rejects
  // anything else, because a ceiling below the advertised number would deny customers
  // before they reached what they paid for.
  int32 ceiling = 2;
  // hard | fair_use | contractual
  string mode = 3;
}

// PlanPrice is what a plan costs.
//
// THE UNIT IS PART OF THE PRICE. €30 per seat and €30 per account differ by an order of
// magnitude for a ten-seat team, and that ambiguity is exactly what let a landing page
// reading "$30" appear to contradict a €299 figure when both described the same plan.
message PlanPrice {
  // Minor units (cents). Integer: money that is summed must not accumulate
  // floating-point error. Meaningless when listed is false.
  int64 minor = 1;
  string currency = 2;  // ISO code; EUR is the accounting currency
  // When true the amount is charged per seat, so an account pays minor × seats.
  bool per_seat = 3;
  // false for plans sold by conversation — Enterprise "Custom", and internal tiers.
  // DISTINCT from minor == 0, which means genuinely free: "€0" and "contact us" are
  // different commercial statements and must not render alike.
  bool listed = 4;
}

// PlanEntitlement is what one plan grants on one axis.
message PlanEntitlement {
  string axis = 1;  // personal | team
  string plan = 2;  // free | pro | max | team | enterprise | platform
  PlanLimit repos = 3;
  PlanLimit seats = 4;
  PlanLimit ai_operations = 5;
  PlanPrice price = 9;
  // true when an operator has edited this row, which also means seed reconciliation
  // leaves it alone on deploy.
  bool overridden = 6;
  string updated_by = 7;  // user id, empty when never edited
  int64 updated_at_unix = 8;
}

message ListPlanEntitlementsRequest {}

message ListPlanEntitlementsResponse {
  repeated PlanEntitlement plans = 1;
}

message UpdatePlanEntitlementRequest {
  string axis = 1;
  string plan = 2;
  PlanLimit repos = 3;
  PlanLimit seats = 4;
  PlanLimit ai_operations = 5;
  PlanPrice price = 6;
}

message UpdatePlanEntitlementResponse {
  PlanEntitlement plan = 1;
}

message AdjustAIAllowanceRequest {
  string account_id = 1;
  // Signed units against the ceiling. NEGATIVE = credit (grants allowance),
  // positive = clawback. Zero is rejected — an adjustment that adjusts nothing is
  // an operator mistake, not a no-op.
  int64 units = 2;
  // Why the adjustment was made. Required; recorded verbatim on the ledger row.
  string reason = 3;
}

message AdjustAIAllowanceResponse {
  // The account's adjustment total for the period after this change.
  int64 adjustment_units = 1;
  // First day of the metering period the adjustment landed on (YYYY-MM-DD).
  string period_start = 2;
}

message ResetPlanEntitlementRequest {
  string axis = 1;
  string plan = 2;
}

message ResetPlanEntitlementResponse {
  PlanEntitlement plan = 1;
}

// ConfigKnob is the admin-facing description of one managed knob.
message ConfigKnob {
  string key = 1;            // flat dotted key, e.g. "stage3.max_replans"
  string category = 2;       // indexer | ai | stage3 | agentloop | evidence
  string tier = 3;           // "A" | "B" | "C"
  string value_type = 4;     // int | int32 | int64 | bool | string | float | duration_sec
  string description = 5;
  string value = 6;          // JSON-encoded effective value
  string default_value = 7;  // JSON-encoded env/struct default (Reset target)
  bool overridden = 8;       // effective value differs from the default
  int64 version = 9;         // override row version (0 when not overridden)
}

message ListConfigRequest {}

message ListConfigResponse {
  repeated ConfigKnob knobs = 1;
}

message UpdateConfigRequest {
  string key = 1;
  string value = 2;          // JSON-encoded value for the knob's type
}

message UpdateConfigResponse {
  ConfigKnob knob = 1;
}

message ResetConfigRequest {
  string key = 1;
}

message ResetConfigResponse {
  ConfigKnob knob = 1;
}

// ProcessConfigStatus is one live process's applied-config state + activity.
message ProcessConfigStatus {
  string instance_id = 1;        // restart-stable identity, "host:role"
  string role = 2;               // server | worker-agent | worker-prgate | worker-repo | worker-webhook | unknown
  string host = 3;
  int32 pid = 4;                 // current OS pid; diagnostic only, not part of the identity
  string revision = 5;           // short hash of the applied override fingerprint
  int64 applied_at_unix_ms = 6;  // when this process last reported (heartbeat; epoch ms)
  // Activity counters since this process started (metrics section).
  int64 applied_count = 7;
  int64 refresh_failures = 8;
  int64 publish_failures = 9;
  int64 invariant_rejections = 10;
  int64 started_at_unix_ms = 11;          // process start (uptime)
  int64 revision_applied_at_unix_ms = 12; // when this process LIVE-adopted its current revision; 0 = adopted on boot only (no edit since start)
}

message GetConfigConvergenceRequest {}

message GetConfigConvergenceResponse {
  repeated ProcessConfigStatus processes = 1; // one row per live (non-expired) reporter
  bool converged = 2;                          // all reporting processes share one revision
  string current_revision = 3;                 // the answering server's own applied revision
  int32 reporting_count = 4;                   // number of live reporters
  // Aggregate activity across live reporters (metrics section). Scope note:
  // total_applied/total_failures sum over ALL reporters (fleet-wide lifetime),
  // while convergence_spread_ms is scoped to reporters that live-adopted
  // current_revision — different denominators by design.
  int64 total_applied = 5;
  int64 total_failures = 6;                     // refresh + publish + invariant rejections, summed across all reporters
  int64 convergence_spread_ms = 7;             // gap between earliest & latest LIVE adoption of current_revision; 0 when <2 reporters have live-adopted it (e.g. a freshly restarted fleet with no edit yet)
}

message ListConfigAuditRequest {
  int32 limit = 1;   // page size (server applies a sane default + cap)
  int32 offset = 2;  // page offset, newest-first
}

// ConfigAuditEntry is one recorded config change (from platform_config_audit).
message ConfigAuditEntry {
  string key = 1;
  // JSON-encoded prior value. Empty string means "no prior value" (the knob was
  // first-set, so old_value was SQL NULL). Unambiguous: a present jsonb value
  // always serializes to ≥1 byte (e.g. `0`, `""`, `null`), so "" can only come
  // from a NULL column, never from a real prior value.
  string old_value = 2;
  string new_value = 3;            // JSON-encoded new value
  string changed_by = 4;           // changer's email
  int64 changed_at_unix_ms = 5;
}

message ListConfigAuditResponse {
  repeated ConfigAuditEntry entries = 1;
  bool has_more = 2;               // another older page exists
}

// ── billing overrides (§4.6) ────────────────────────────────────────────────

message RefundPaymentRequest {
  string payment_id = 1;       // the captured payment to refund
  int64 amount_minor = 2;      // > 0; partials allowed up to the payment's amount
  string reason = 3;           // required — recorded on the ledger row; an override without a why is an audit hole
  string idempotency_key = 4;  // required — one key == one refund; retries reuse it
}

message RefundPaymentResponse {
  string refund_id = 1;
  string status = 2;              // pending | succeeded | failed
  int64 amount_minor = 3;
  string gateway_refund_ref = 4;  // set once the gateway settled it
}

message GrantBillingCreditRequest {
  string account_id = 1;      // team account (the personal axis follows PR-5)
  int64 amount_minor = 2;     // > 0
  string source = 3;          // proration | refund | promo
  string reason = 4;          // required — same audit rule as refunds
  int64 expires_at_unix = 5;  // 0 = never expires; otherwise must be in the future
}

message GrantBillingCreditResponse {
  // The owner's available credit after the grant. -1 means the grant COMMITTED
  // but the balance read-back failed — do not re-grant; re-read instead.
  int64 available_minor = 1;
}
